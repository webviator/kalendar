68). Прпп. отців, які в лаврі св. Сави були вбиті (614). Свт. Олександра, єп. Єрусалимського (213 – 250). Мчч. Віта, Модеста і мц. Крискентії (бл. 303). Св. отроковиці Музи (V). Свт. Георгія ІІ, єп. Мітиленського (ІХ). Блгв. Тамари, цариці Грузинської (перехідне святкування в 3-тю неділю після Пасхи). Ран. – Єв. 3-є,","r":["Мк., 71 зач., XVI, 9 – 20.","Літ. – Діян., 16 зач., VI, 1 – 7. Мк., 69 зач., XV, 43 – XVI, 8."],"n":"З цього дня у всі недільні дні до віддання Пасхи на ранній перед каноном тріоді співаємо пасхальний канон з богородичними. До богородичних тропарів приспів: «Пресвята Богородице, спаси нас». На 9-й пісні приспіви звичайні, до пасхальних тропарів «Христос воскрес із мертвих», а до богородичних «Пресвята Богородице, спаси нас»."},{"m":5,"d":17,"h":"3-й тиждень після Пасхи. Ап. Андроніка і св. Юнії (І). Мчч. Солохона, Памфамира і Памфалона, воїнів (284 – 305). Свт. Стефана, патр. Константинопольського (893).","r":["Діян., 17 зач., VI, 8 – VII, 5, 47 – 60. Ін., 13 зач., IV, 46 – 54.","Ап.: 1 Кор., 131 зач., IV, 9 – 16. Мф., 56 зач., XIII, 54 – 58."],"n":""},{"m":5,"d":18,"h":"Пам’ять свв. отців сімох Вселенських соборів. Мчч. Феодота Анкирського, Петра, Діонісія, Андрія, Павла, мц. Христини (249 – 251) і мцц. сімох дів: Олександри, Текуси, Клавдії, Фаїни, Євфрасії, Мотрони і Юлії (303). Мчч. Симеона, Ісаака і Вахтисія (ІV), Іраклія, Павлина, Венедима, Давида і Таричана (693, Груз.).","r":["Діян., 18 зач., VIII, 5 – 17. Ін., 20 зач., VI, 27 – 33."],"n":""},{"m":5,"d":19,"h":"Сщмчч. Патрикія, єп. Пруського, і з ним трьох пресвітерів: Акакія, Менандра і Полієна (бл. 100). Мч. Парфенія Жовківського, Римського (250). Мч. Калуфа Єгиптянина (284 – 303). Прп. Іоана, єп. Готського (VІІІ).","r":["Діян., 19 зач., VIII, 18 – 25. Ін., 21 зач., VI, 35 – 39."],"n":""},{"m":5,"d":20,"h":"Прав. Лідії Филипійської (І). Мчч. Фалалея, Олександра і Астерія (бл. 284). Мч. Аскалона (бл. 287). Прпп. Завулона і Сусанни (ІІІ – поч. IV), батьків рівноап. Ніни. Знай-дення мощів свт. Олексія, митр. Київського і всієї Руси, чудотворця (1431).","r":["Діян., 20 зач., VIII, 26 – 39. Ін., 22 зач., VI, 40 – 44."],"n":""},{"m":5,"d":21,"h":"Рівноапп. імператора Костянтина (337) і матері його імператриці Олени (327). Блгв. кн. Костянтина (Ярослава Святославича) (1129) та дітей його Михаїла і Федора, Чернігівських і Муромських чудотворців.","r":["Діян., 21 зач., VIII, 40 – IX, 19. Ін., 23 зач., VI, 48 – 54.","Рівноапп.: Гал., 200 зач., I, 11 – 19. Ін., 35 зач. (від половини), X, 1 – 9."],"n":""},{"m":5,"d":22,"h":"Прав. Мелхиседека, царя Салимського (2000 до Р.Х.). Мч. Василіска (бл. 308). Пам’ять отців ІІ Вселенського собору (381). Мч. Іоана-Володимира, кн. Сербського (1015).","r":["Діян., 22 зач., IX, 19 – 31. Ін., 52 зач., XV, 17 – XVI, 2."],"n":""},{"m":5,"d":23,"h":"4-та неділя після Пасхи, про паралізованого. Прав. Марії Клеопової (І). Прп. Михайла, спов., єп. Синадського (821). Прмч. Михаїла, ченця (ІХ). Знайдення мощів свт. Леонтія Києво- Печерського, єп. Ростовського (1164). Прп. Єфросинії, ігум. Полоцької (1173). Перенесення мощів мч. Авраамія Болгарського (1230) (перехідне святкування в 4-ту неділю після Пасхи). Прав. Тавифи (І) (перехідне святкування в 4-ту неділю після Пасхи).","r":["Ран. – Єв. 4-е, Лк., 112 зач., XXIV, 1 – 12.","Літ. – Діян., 23 зач., IX, 32 – 42. Ін., 14 зач., V, 1 – 15."],"n":""},{"m":5,"d":24,"h":"4-й тиждень після Пасхи. Прп. Симеона стовпника на Дивній горі (596). Мчч. Мелетія Стратилата, Стефана, Іоана, Серапіона, єгиптянина, Калиника, волхва, Федора і Фавста та з ними 1218 воїнів з дружинами і дітьми (218).","r":["Діян., 24 зач., X, 1 – 16. Ін., 24 зач., VI, 56 – 69."],"n":""},{"m":5,"d":25,"h":"Третє знайдення глави Предтечі і Хрестителя Господнього Іоана (бл. 850). Сщмч. Ферапонта, єп. Кіпрського (ІV). Свт. Інокентія, архієп. Херсонського (1857).","r":["Ран. – Лк., 31 зач., VII, 17 – 30.","Літ. – Діян., 25 зач., X, 21 – 33. Ін., 25 зач., VII, 1 – 13.","Предтечі: 2 Кор., 176 зач., IV, 6 – 15. Мф., 40 зач., XI, 2 – 15."],"n":"На ранній величання: «Величаємо тебе, Хрестителю Спасів Іоане, і шануємо всі чесної твоєї глави знайдення»."},{"m":5,"d":26,"h":"Переполовення П’ятдесятниці. Апп. від 70-х Карпа й Алфея (І). Мч. Аверкія та мц. Олени (І). Прп. Іоана Психаїта, сповідника (ІХ). Мч. Георгія Нового (1515).","r":["Діян., 34 зач., XIV, 6 – 18. Ін., 26 зач., VII, 14 – 30. На водосвятті: Євр., 306 зач., II, 11 – 18. Ін., 14 зач., V, 1 – 4."],"n":"На ранній «Чеснішу…» не співаємо. Цього дня, традиційно, звершується мале освячення води."},{"m":5,"d":27,"h":"Сщмч. Ферапонта, єп. Сардійського (ІІІ). Мц. Феодори, діви, і мч. Дидима, воїна (304). Знайдення мощів свтт. Київських: Кипріана та Фотія (1472). Прав. Іоана Русина, сповідника (1730).","r":["Діян., 26 зач., X, 34 – 43. Ін., 29 зач., VIII, 12 – 20."],"n":""},{"m":5,"d":28,"h":"Прп. Микити, спов., єп. Халкідонського (ІХ). Сщмч. Євтихія, єп. Мелітинського (І), Мц. Єликониди (244). Сщмч. Елладія, єпископа (VІ – VІІ).","r":["Діян., 27 зач., X, 44 – XI, 10. Ін., 30 зач., VIII, 21 – 30."],"n":""},{"m":5,"d":29,"h":"Мц. Феодосії, діви Тирської (307 – 308). Пам’ять І Вселенського собору (325). Прмц. Феодосії, діви (726 – 730). Ікон Божої Матері, званих «Споручниця грішних» та «Невтомне Око».","r":["Діян., 29 зач., XII, 1 – 11. Ін., 31 зач., VIII, 31 – 42."],"n":""},{"m":5,"d":30,"h":"5-та неділя після Пасхи, про самарянку. Прп. Ісаакія, спов., ігумена обителі Далматської (383). Святкування відновлення Михайлівського Золотоверхого собору (2000) в місті Києві (перехідне святкування в останню неділю травня).","r":["Ран. – Єв. 7-е, Ін., 63 зач., XX, 1 – 10.","Літ. – Діян., 28 зач., XI, 19 – 26, 29 – 30. Ін., 12 зач., IV, 5 – 42."],"n":""},{"m":5,"d":31,"h":"5-й тиждень після Пасхи. Ап. від 70-х Єрма (І). Мч. Єрмія (ІІ). Мч. Філософа (ІІІ). Свт. Філофея (Ліщинського), митр. Тобольського (1727).","r":["Діян., 30 зач., XII, 12 – 17. Ін., 32 зач., VIII, 42 – 51."],"n":""},{"m":6,"d":1,"h":"Мчч. Юстина Філософа та іншого Юстина, і з ними Харитона, Харити, Євелпіста, Ієракса, Пеона і Валеріана (166). Прп. Агапіта Києво-Печерського, лікаря безвідплатного, в Ближніх печерах (бл. 1095).","r":["Ран. – Лк., 24 зач., VI, 17 – 23.","Літ. – Діян., 31 зач., XII, 25 – XIII, 12. Ін., 33 зач., VIII, 51 – 59.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":"На ранній величання: «Ублажаємо тебе, преподобний отче Агапіте, і шануємо святу пам’ять твою, наставнику монахів і співрозмовнику ангелів»."},{"m":6,"d":2,"h":"Віддання свята Переполовення П’ятдесятниці. Свт. Никифора, спов., патр. Константинопольського (828). Вмч. Іоана Нового, Сучавського (1330 – 1340). Сщмч. Пофина, єп. Ліонського, і тих, які з ним постраждали (177). Мц. Бландини і мч. Понтика Ліонських (177). Києво-Братської ікони Божої Матері (1654).","r":["Діян., 32 зач., XIII, 13 – 24. Ін., 18 зач., VI, 5 – 14."],"n":"На ранній «Чеснішу…» не співаємо."},{"m":6,"d":3,"h":"Мчч. Лукиліана, Клавдія, Іпатія, Павла, Діонісія і мц. Павли, діви (270 – 275). Сщмчч. Лукіана, єп., Максіана, пресвітера, Юліана, диякона, мчч. Маркеліана і Сатурнина в Бельгії (81 – 96).","r":["Діян., 35 зач., XIV, 20 – 27. Ін., 35 зач., IX, 39 – X, 9."],"n":"З цього дня до суботи – післясвято Неділі про самарянку."},{"m":6,"d":4,"h":"Прав. Марфи і Марії, сестер прав. Лазаря, мироносиць (І). Свт. Митрофана, патр. Константинопольського (бл. 326). Мчч. Фронтасія, Северина, Северіана і Силана (І). Мч. Конкордія (бл. 175). Сщмч. Астія, єп. Диррахійського (ІІ). Прп. Зосими, єп. Вавилона Єгипетського (VІ).","r":["Діян., 36 зач., XV, 5 – 34. Ін., 37 зач., X, 17 – 28."],"n":""},{"m":6,"d":5,"h":"Сщмч. Дорофея, єп. Тирського (бл. 362). Перенесення мощів блгв. Ігоря, кн. Чернігівського і Київського (1150). Свт. Костянтина, митр. Київського і всієї Руси (1159). Мчч. Маркіана, Никандра, Іперехія, Аполона, Леоніда, Арія, Горгія, Селінія, Іринія і Памвона (305 – 311). Прп. Федора, чудотворця (бл. VІ). Прп. Анувія, пустельника Єгипетського (ІV – V). Прп. Дорофея, з обителі авви Серида (620). Ігорівської ікони Божої Матері (1147).","r":["Діян., 37 зач., XV, 35 – 41. Ін., 38 зач., X, 27 – 38."],"n":""},{"m":6,"d":6,"h":"6-та неділя після Пасхи, про сліпого. Прп. Віссаріона, чудотворця Єгипетського (ІV). Прп. Іларіона Нового (845). Прмцц. дів Архелаї, Фекли і Сусанни (293).","r":["Ран. – Єв. 8-е, Ін., 64 зач., XX, 11 – 18.","Літ. – Діян., 38 зач., XVI, 16 – 34. Ін., 34 зач., IX, 1 – 38."],"n":"На ранній катавасія «Спасителю Богу...»."},{"m":6,"d":7,"h":"6-й тиждень після Пасхи. Мч. Феодота Анкирського (303). Сщмч. Маркеліана, єп. Римського, і мчч. Клавдія, Кирина і Антоніна (304). Сщмчч. Маркела, єп. Римського, Сисинія і Киріака, дияконів, мчч. Смарагда, Ларгія, Апроніана, Сатурніна, Папія і Мавра, воїнів, і Крискентіана, мцц. Прискіли, Лукини і Артемії, царівни (304 – 310). Мцц. Калерії (Валерії), Киріакії і Марії в Кесарії Палестинській (ІV).","r":["Діян., 39 зач., XVII, 1 – 15. Ін., 40 зач., XI, 47 – 57."],"n":""},{"m":6,"d":8,"h":"Вмч. Федора Стратилата (319). Прп. Єфрема, патр. Антіохійського (545). Прп. Зосими Фінікійського (VІ). Свт. Федора, єп. Суздальського (1023). Ікони Божої Матері «Далешівська».","r":["Діян., 40 зач. (від половини), XVII, 19 – 28. Ін., 42 зач., XII, 19 – 36."],"n":""},{"m":6,"d":9,"h":"Віддання свята Пасхи. Свт. Кирила, архієп. Олександрійського (444). Мцц. Фекли, Марфи і Марії в Персії (346).","r":["Діян., 41 зач., XVIII, 22 – 28. Ін., 43 зач., XII, 36 – 47."],"n":"Початок вечірні, ранньої і Літургії – пасхальний. На ранній катавасія «Спасителю Богу...». Часи звичайні. Закінчення Літургії та відпуст – пасхальні. Існує також традиція звершувати вечірню й ранню за пасхальним чином. Після завершення Літургії плащаниця з престолу відноситься у ризницю."},{"m":6,"d":10,"h":"ВОЗНЕСІННЯ ГОСПОДНЄ. Сщмч. Тимофія, єп. Пруського (361 – 363). Свт. Іоана (Максимовича), митр. Тобольського (1715). Прп. Силуана, схимника Києво-Печерського, в Дальніх печерах (ХІІІ – ХІV). Мчч. Олександра, Антоніни, діви (бл. 313). Прп. Феофана Антіохійського (369). Свт. Вассіана, єп. Лавдійського (409). Мучеників, які в долині Ферейдан (Іран) від персів постраждали (XVII) (Груз.) (перехідне свято в день Вознесіння Господнього).","r":["Ран. – Мк., 71 зач., XVI, 9 – 20.","Літ. – Діян., 1 зач., I, 1 – 12. Лк., 114 зач., XXIV, 36 – 53."],"n":"На ранній величання: «Величаємо Тебе, Життєдавче Христе, і шануємо на небеса з пречистою Твоєю плоттю Божественне вознесіння». Після Євангелія – «Воскресіння Христове бачивши…». Замість «Чеснішу...» співаються приспіви свята. 1-й приспів: «Величай, душе моя, Христа Життєдавця, Який вознісся від землі на Небо». На Літургії антифони свята. Вхідний стих: «Зійшов Бог при окликах радості, Господь – при звуках сурмних». Після вхідного стиха відразу співається тропар свята, «Слава і нині» – кондак свята, а на архієрейській Літургії після вхідного стиха співається: «Прийдіть, поклонімось… спаси нас, Сину Божий, що вознісся у славі…», а тоді тропар і кондак. Співається Трисвяте. Замість «Достойно…» – «Величай, душе моя... Тебе, вищу розуму...». Замість «Ми бачили Світло істинне...» – «Вознісся ти у славі...» (до віддання). Увечері на свято відправляється вечірня із входом і великим прокимном."},{"m":6,"d":11,"h":"Апп. Варфоломія і Варнави (І). Свт. Луки, архієп. Сімферопольського, спов. (1961). Ікони Божої Матері «Достойно є» («Милуюча») (Х).","r":["Ран. – Ін., 67 зач., XXI, 15 – 25.","Літ. – Діян., 42 зач., XIX, 1 – 8. Ін., 47 зач., XIV, 1 – 11.","Апп.: Діян., 28 зач., XI, 19 – 26, 29 – 30. Лк., 51 зач., X, 16 – 21."],"n":"З цього дня на ранній, коли співається велике славослів’я, катавасія «Спасителю Богу...», крім 7-ої неділі після Пасхи і віддання Вознесіння. На Літургії після входу у будні дні до віддання: «Прийдіть, поклонімось... спаси нас, Сину Божий, що вознісся у славі...». Прокимен, алилуарій і причасний свята (до віддання). На ранній величання: «Величаємо вас, апостоли Христові Варфоломію та Варнаво, і шануємо страждання і труди ваші, ними ж потрудилися ви у благовісті Христовому»."},{"m":6,"d":12,"h":"Прп. Онуфрія Великого (ІV). Прп. Петра Афонського (734). Прпп. Іоана, Андрія, Іраклемона і Феофіла (ІV).","r":["Діян., 43 зач., XX, 7 – 12. Ін., 48 зач., XIV, 10 – 21.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":""},{"m":6,"d":13,"h":"7-ма неділя після Пасхи, святих отців І Вселенського собору. Глас 6-й. Мц. Акилини Біблської (293). Свт. Трифилія, єп. Левкусії Кіпрської (бл. 370). Мц. Антоніни Нікейської (284 – 305). Прп. Анни (826) і сина її Іоана.","r":["Ран. – Єв. 10-е, Ін., 66 зач., XXI, 1 – 14.","Літ. – Діян., 44 зач., XX, 16 – 18, 28 – 36. Ін., 56 зач., XVII, 1 – 13."],"n":"На ранній катавасія «Божественним покритий...», співаємо «Чеснішу». На Літургії після входу тропар воскресний, Вознесіння і отцям, «Слава…» кондак отцям, «І нині…» – кондак Вознесіння. Прокимен, Апостол, алилуарій і Євангеліє отцям. Задостойник свята. Причасний «Хваліть Господа…» і «Радуйтеся, праведні…»."},{"m":6,"d":14,"h":"7-й тиждень після Пасхи. Прор Єлисея (ІX ст. до Р. Х.). Свт. Мефодія, патр. Константинопольського (847). Блгв. кн. Мстислава, у св. хрещенні Георгія, Хороброго (1180). Прп. Єлисея Сумського (ХV – ХVІ).","r":["Діян., 45 зач., XXI, 8 – 14. Ін., 49 зач., XIV, 27 – XV, 7."],"n":""},{"m":6,"d":15,"h":"Прор. Амоса (VІІІ ст. до Р. Х.). Свт. Михаїла, першого митр. Київського і всієї Руси (992). Апп. від 70-х Ахаїка і Фортуната (І). Мчч. Віта, Модеста і Крискентії, годувальниці (бл. 303). Мч. Дули Килікійського (305 – 313). Прп. Дули, страстотерпця, Єгипетського. Прп. Ієроніма Блаженного Стридонського (420). Свт. Августина Блаженного, єп. Іпонійського (430). Перенесення мощів прп. Федора Сикеота, єп. Анастасіупольського (бл. ІХ). Блгв. кн. Лазаря Сербського (1389). Свт. Єфрема ІІ, патр. Сербського (ХІV).","r":["Ран. – Ін., 35 зач. (від половини), X, 1 – 9.","Літ. – Діян., 46 зач., XXI, 26 – 32. Ін., 53 зач., XVI, 2 – 13.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16."],"n":"На ранній величання: «Величаємо тебе, святителю отче Михаїле, і шануємо святу пам’ять твою, бо ти молиш за нас Христа Бога нашого»."},{"m":6,"d":16,"h":"Свт. Тихона, єп. Амафунтського (425). Сщмч. Тигрія, пресвітера, і мч. Євтропія, читця (бл. 404). Прп. Додо Давидо-Гареджийського (596, Груз.) (перехідне святкування в середу після Вознесіння).","r":["Діян., 47 зач., XXIII, 1 – 11. Ін., 54 зач., XVI, 15 – 23."],"n":""},{"m":6,"d":17,"h":"Мчч. Мануїла, Савела та Ісмаїла (362). Прав. Соломона, царя (928- 933 до Р.Х.).","r":["Діян., 48 зач., XXV, 13 – 19. Ін., 55 зач., XVI, 23 – 33.","Мчч.: Еф., 233 зач., VI, 10 – 17. Лк., 106 зач., XXI, 12 – 19."],"n":""},{"m":6,"d":18,"h":"Віддання свята Вознесіння Господнього. Мчч. Леонтія, Іпатія та Феодула (70 – 79). Прп. Леонтія, канонарха Києво-Печерського, в Дальніх печерах (ХІV).","r":["Ран. – Ін., 67 зач., XXI, 15 – 25.","Літ. – Діян., 50 зач., XXVII, 1 – 44. Ін., 57 зач., XVII, 18 – 26.","Ап.: Іуд., 77 зач., I, 1 – 10. Ін., 48 зач. (від половини), XIV, 21 – 24."],"n":"Служба за Тріоддю і Мінеєю (див. Типікон 25 травня). На ранній катавасія «Божественним покритий...». «Чеснішу...» не співається, а приспіви свята. На цей день переноситься служба святому апостолу Іуді, брату Господьному по плоті."},{"m":6,"d":19,"h":"Троїцька поминальна субота. Звершуємо пам’ять всіх від віку спочилих православних християн – отців, матерів, братів і сестер наших. Апостола Іуди, брата Господнього по плоті (бл. 80). Мч. Зосими (ІІ). Прп. Паїсія Великого (V). Прп. Іоана Палестинського, пустельника (VІ). Прп. Паїсія Хіландарського (ХVІІІ, Болг.).","r":["Ряд.: Діян., 51 зач., XXVIII, 1 – 31. Ін., 67 зач., XXI, 15 – 25. Заупокійне: 1 Кор., 163 зач., XV, 47 – 57. Ін., 16 зач., V, 24 – 30."],"n":"Служба тільки з Тріоді. На вечірні замість прокимна – «Алилуя» із заупокійними стихами. На ранній замість «Бог Господь..» – «Алилуя» із заупокійними стихами. Канон храму і Тріоді (з 2-ю піснею). Катавасія Тріоді. На Літургії «Достойно є…». Замість «Ми бачили світло істинне...» – тропар «Глибиною мудрості...»."},{"m":6,"d":20,"h":"8-ма неділя після Пасхи. ДЕНЬ СВЯТОЇ ТРОЙЦІ, П’ЯТДЕСЯТНИЦЯ. Сщмч. Мефодія, єп. Патарського (312). Мчч. Інни, Пінни та Римми (І – ІІ). Сщмчч. Аристоклія, пресвітера, Димитріана, диякона, і мч. Афанасія, читця (бл. 306). Свт. Левкія, спов., єп. Врунтисіопольського (V). Свт. Мини Києво-Печерського, єп. Полоцького (1116). Прав. Миколая Кавасили (1397/98).","r":["Ран. – Ін., 65 зач., XX, 19 – 23.","Літ. – Діян., 3 зач., II, 1 – 11. Ін., 27 зач., VII, 37 – 52; VIII, 12."],"n":"На ранній величання «Величаємо Тебе, Життєдавче Христе, і шануємо Всесвятого Духа Твого, що Його від Отця послав Ти божественним учням Твоїм». «Воскресіння Христове бачивши…» не співаємо. У Тріоді для 9-ої пісні канону приспівів немає, але в Тріоді нотного співу для задостойника в день П’ятдесятниці вказується такий приспів: «Апостоли, зішестя Утішителя бачивши, здивувалися, як у вигляді вогняних язиків явився Дух Святий». «Свят Господь Бог наш» не промовляється. На Літургії – антифони свята. Вхідний стих: «Піднесися, Господи, силою Твоєю! Будемо співати й прославляти могутність Твою». Замість Трисвятого – «Всі ви, що в Христа хрестилися...», замість «Достойно є…» – «Радуйся, Царице...». Після «Спаси, Боже...» співаємо «Ми бачили світло істинне...». Після відпусту Літургії царські врата зачиняються, звершуємо 9-й час і починаємо вечірню з виголосу «Благословенний Бог наш...». «Царю Небесний…», як правило, співається народом. На вечірні після 103 псалма – велика ектенія з додаванням особливих прохань, вхід з кадилом, великий прокимен і читання коліновклонних молитов. Відпуст вечірні при відчинених царських вратах «Христос, що з Отчого і Божественного лона...». З цього дня і до віддання П’ятдесятниці на ранній, коли співається велике славослів’я, катавасія «Божественним покритий...». Після свята П’ятдесятниці тижні починаються з понеділка, а закінчуються неділею."},{"m":6,"d":21,"h":"1-й тиждень після П’ятдесятниці. Загальниця. День Святого Духа. Мч. Юліана Тарсійського (бл. 305). Сщмч. Терентія, єп. Іконійського (І). Прпп. Юлія, пресвітера, і Юліана, диякона (V). Мчч. Арчила ІІ, царя Іверського (744), і Луарсаба ІІ, царя Карталинського (1622, Груз.). Кіпрської ікони Божої Матері (перехідне святкування в День Святого Духа).","r":["Еф., 229 зач., V, 8 – 19. Мф., 75 зач., XVIII, 10 – 20."],"n":"На ранній замість «Чеснішу...» співається ірмос «Радуйся, Царице...». На Літургії вхідний стих: «Піднесися, Господи, силою Твоєю! Будемо співати й прославляти могутність Твою». Співається Трисвяте. Замість «Достойно є…» – «Радуйся, Царице...» (до віддання). Відпуст вечірні, ранньої та Літургії у всі дні до віддання – «Христос, що у вигляді вогняних язиків...». У середу і п’ятницю посту немає."},{"m":6,"d":22,"h":"Сщмч. Євсевія, єп. Самосатського (380). Мчч. Зинона та Зіни (304). Мчч. Галактіона та Юліанії.","r":["Рим., 79 зач., I, 1 – 7, 13 – 17. Мф., 10 зач., IV, 25 – V, 13."],"n":"З цього дня співається «Чеснішу...» (крім віддання П’ятдесятниці)."},{"m":6,"d":23,"h":"Мц. Агрипини Римлянки (ІІІ). Сщмч. Євстохія, пресвітера, мчч. Гая, Провія, Лолія, Урвана та інших (ІV).","r":["Рим., 80 зач., I, 18 – 27. Мф., 12 зач., V, 20 – 26 (за середу). Рим., 81 зач., I, 28 – II, 9."],"n":"Мф., 13 зач., V, 27–32 (за четвер)."},{"m":6,"d":24,"h":"Різдво чесного славного пророка, Предтечі та Хрестителя Господнього Іоана. Мчч. сімох братів: Орентія, Фарнакія, Єроса, Фірмоса, Фірмина, Киріака і Лонгина (ІV). Ікони Божої Матері «Споручниця грішних», Корецької (1622) (перехідне святкування в четвер 1-го тижня після П’ятдесятниці).","r":["Ран. – Лк., 3 зач., I, 24 – 25, 57 – 68, 76, 80.","Літ. – Предтечі: Рим., 112 зач., XIII, 11 – XIV, 4. Лк., 2 зач., I, 5 – 25, 57 – 68, 76, 80."],"n":"На ранній величання Предтечі: «Величаємо тебе, Предтече Спасів Іоане, і шануємо від неплідної преславне народження твоє»."},{"m":6,"d":25,"h":"Прмц. Февронії, діви (бл. 304). Манявської ікони Божої Матері «Визволителька» (1788).","r":["Рим., 82 зач., II, 14 – 29. Мф., 14 зач., V, 33 – 41.","Прмц.: 2 Кор., 181 зач., VI, 1 – 10. Лк., 33 зач., VII, 36 – 50."],"n":""},{"m":6,"d":26,"h":"Віддання свята П’ятдесятниці. Прп. Давида Солунського (бл. 540). Прп. Іоана, єп. Готського (VІІІ). Свт. Діонісія Києво-Печерського, архієп. Суздальського (1385). Ліддської (Римської) (І), Тихвинської (1383) та Нямецької (1399) ікон Божої Матері.","r":["Рим., 79 зач. (від половини), I, 7 – 12. Мф., 15 зач., V, 42 – 48."],"n":"Уся служба за Тріоддю. На ранній замість «Чеснішу...» співається ірмос «Радуйся, Царице...». Співається велике славослів’я."},{"m":6,"d":27,"h":"1-ша неділя після П’ятдесятниці. Всіх святих. Глас 8-й. Прп. Самсона, гостинного (бл. 530). Прав. Іоанни, мироносиці (І). Прп. Севіра, пресвітера (VІ). Прп. Георгія Іверського Святогорця (1065, Груз.). Прп. Мартина Турівського (1150). Сщмч. Кирила (Лукаріса), патр. Константинопольського (1638). Сщмч. Киріона, Католикоса-Патріарха всієї Грузії (1918). Ікон Божої Матері Тернопільської та «Пом’якшення злих сердець» (Семистрільна) (перехідні святкування в неділю всіх святих).","r":["Ран. – Єв. 1-е, Мф., 116 зач., XXVIII, 16 – 20.","Літ. – Євр., 330 зач., XI, 33 – XII, 2. Мф., 38 зач., X, 32 – 33, 37 – 38; XIX, 27 – 30."],"n":"Заговини на Петрів піст. Вся служба з Тріоді. З цього дня і до 1-го серпня на святкових ранніх (коли співається велике славослів’я) катавасія «Відкрию уста мої...»."},{"m":6,"d":28,"h":"2-й тиждень після П’ятдесятниці. Перенесення мощів мчч., безсрр. та чудотворців Кира та Іоана (412). Прп. Ксенофонта Робейського, ігумена (1262). Прп. Павла, лікаря (VII).","r":["Рим., 83 зач., II, 28 – III, 18. Мф., 19 зач., VI, 31 – 34; VII, 9–11 (за понеділок). Рим., 86 зач., IV, 4–12. Мф., 22 зач., VII, 15–21 (за вівторок, під зачало).","Безсрібн.: 1 Кор., 153 зач., XII, 27 – XIII, 8. Мф., 34 зач. (від половини), X, 1, 5 – 8."],"n":"День Петрового посту."},{"m":6,"d":29,"h":"Славних і всехвальних першоверховних апостолів Петра і Павла (бл. 67). Свт. Григорія, митр. Іраклійського (1925). Касперівської ікони Божої Матері (ХІХ).","r":["Ран. – Ін., 67 зач., XXI, 15 – 25.","Літ. – Апп.: 2 Кор., 193 зач., XI, 21 – XII, 9. Мф., 67 зач., XVI, 13 – 19."],"n":"На ранній величання «Величаємо вас, святі першоверховні апостоли Петре i Павле, що весь світ ученням своїм просвiтили і всі краї землі до Христа привели»."},{"m":6,"d":30,"h":"Собор славних і всехвальних 12-ох апостолів: Петра, Андрія Першозванного, Якова Зеведеєвого, Іоана Богослова, Филипа, Варфоломія, Фоми, Матфея, Якова Алфеєвого, Іуди Якового, Симона Зилота і Матфія. Волинської (ХХ ст.), Баликінської (1711) та Горбанівської (1786) ікон Божої Матері.","r":["Рим., 87 зач., IV, 13 – 25. Мф., 23 зач., VII, 21 – 23.","Апп.: 1 Кор., 131 зач., IV, 9 – 16. Мк., 12 зач., III, 13 – 19."],"n":""},{"m":7,"d":1,"h":"Безсрр. Косми та Даміана, які в Римі постраждали (284). Мч. Потита (ІІ). Прп. Петра, патрикія (854). Перенесення мощів прп. Іоана Рильського (1469). Прп. Никодима Святогорця (1809).","r":["Рим., 89 зач., V, 10 – 16. Мф., 27 зач., VIII, 23 – 27.","Безсрібн.: 1 Кор., 153 зач., XII, 27 – XIII, 8. Мф., 34 зач. (від половини), X, 1, 5 – 8."],"n":""},{"m":7,"d":2,"h":"Покладення чесної ризи Пресвятої Богородиці у Влахерні (V). Свт. Ювеналія, патр. Єрусалимського (бл. 458). Свт. Фотія, митр. Київського і всієї Руси (1431). Свт. Іоана (Максимовича), архієп. Шанхайського і Сан-Франциського, чудотворця (1966). Охтирської (1739), «Одигитрії-Дорогобузької» (ХІІІ) та Пожайської (ХVІІ) ікон Божої Матері.","r":["Рим., 90 зач., V, 17 – VI, 2. Мф., 31 зач., IX, 14 – 17. Богородиці: Євр., 320 зач., IX, 1 – 7. Лк., 54 зач., X, 38 – 42; XI, 27 – 28."],"n":""},{"m":7,"d":3,"h":"Мч. Якинфа (108). Мчч. Діомида, Євлампія, Аскліпіодота і мц. Голіндухи (ІІ). Прпп. Анатолія, затворника, у Ближніх печерах (ХІІ), та іншого Анатолія, затворника, у Дальніх печерах (ХІІІ). Мчч. Мокія і Марка (ІV). Прп. Олександра, засновника обителі «Невсипущих» (бл. 430). Свт. Анатолія, патр. Константинопольського (458).","r":["Рим., 84 зач., III, 19 – 26. Мф., 20 зач., VII, 1 – 8."],"n":""},{"m":7,"d":4,"h":"2-га неділя після П’ятдесятниці. Всіх святих землі Української. Глас 1-й. Новомучеників та сповідників, які в Україні та в інших землях у ХХ ст. за Христа і православну віру постраждали (перехідне святкування в 2-гу неділю після П’ятдесятниці). Свт. Андрія, архієп. Критського (740). Прп. Марфи, матері Симеона Дивногорця (551). Мчч. Феодота і Феодотії Кесарійських (108). Сщмч. Федора, єп. Киринейського (310). Всіх преподобних і богоносних отців, які на Святій Горі Афонській просяяли (перехідне святкування в 2-гу неділю після П’ятдесятниці). Галатської ікони Божої Матері.","r":["Ран. – Єв. 2-е, Мк., 70 зач., XVI, 1 – 8.","Літ. – Рим., 81 зач. (від половини), II, 10 – 16. Мф., 9 зач., IV, 18 – 23.","Свв.: Євр., 330 зач., XI, 33 – XII, 2. Мф., 10 зач., IV, 25 – V, 12."],"n":"На ранній величання «Ублажаємо вас, чудотворці наші славні, що землю українську чеснотами вашими осяяли і образ спасіння нам ясно показали»."},{"m":7,"d":5,"h":"3-й тиждень після П’ятдесятниці. Прп. Афанасія Афонського (1000). Мцц. Агнії (Анни) Римської і Кирилли (304). Прп. Лампада Іринопольського (Х). Ікони Божої Матері, званої «Економісса».","r":["Ран. – Мф., 43 зач., XI, 27 – 30.","Літ. – Рим., 94 зач., VII, 1 – 13. Мф., 34 зач., IX, 36 – X, 8.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Лк., 24 зач., VI, 17 – 23."],"n":"На ранній величання: «Ублажаємо тебе, преподобний отче Афанасію, і шануємо святу пам’ять твою, наставнику монахів і співрозмовнику ангелів»."},{"m":7,"d":6,"h":"Прп. Сисоя Великого (429). Прп. Сисоя, схимника Києво-Печерського, у Дальніх печерах (ХVІ). Знайдення мощів прав. діви Юліанії, кн. Ольшанської (ХІІІ). Мчч. Марина, Марфи, Авдифакса, Авакума, Кирина, Валентина, пресвітера, Астерія та інших багатьох у Римі (269). Сщмч. Ісавра, диякона, мчч. Інокентія, Фелікса, Єрмія, Василія, Перегрина, Руфа та Руфина (ІІІ). Мч. Коїнта Фригійського (бл. 283). Мц. Лукії, діви, і з нею мчч. Рикса, Антонія, Лукіана, Ісидора, Діона, Діодора, Кутонія, Ароноса, Капика і Сатура (301).","r":["Рим., 95 зач., VII, 14 – VIII, 2. Мф., 35 зач., X, 9 – 15. Прав. діви: Гал., 208 зач., III, 23 – IV, 5. Мф., 104 зач., XXV, 1 – 13."],"n":""},{"m":7,"d":7,"h":"Прпп. Іова (1621) та Феодосія (1629) Манявських. Прп. Фоми з Малеї (Х). Прп. Акакія, про якого розповідається в Ліствиці (VІ). Мчч. Перегрина, Лукіана, Помпея, Ісихія, Папія, Саторнина і Германа (ІІ). Сщмч. Епіктета, пресвітера, і прмч. Астіона, ченця (290). Мч. Євангела (ІІІ – ІV). Мц. Киріакії Нікомидійської (ІV). Прп. Севери, ігум. Трірської (бл. 646). Влахернської ікони Божої Матері.","r":["Ран. – Мф., 43 зач., XI, 27 – 30.","Літ. – Рим., 96 зач., VIII, 2 – 13. Мф., 36 зач., X, 16 – 22.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Лк., 24 зач., VI, 17 – 23."],"n":"На ранній величання: «Ублажаємо вас, преподобні отці Іове та Феодосію Манявські, і шануємо святу пам’ять вашу, наставники монахів і співрозмовники ангелів»."},{"m":7,"d":8,"h":"Вмч. Прокопія (303). Ікони Божої Матері «Одигітрія Влахернська-Казанська» (1579).","r":["Рим., 98 зач., VIII, 22 – 27. Мф., 37 зач., X, 23 – 31.","Вмч.: 2 Тим., 292 зач., II, 1 – 10. Мф., 39 зач., Х, 37 – ХІ, 1."],"n":""},{"m":7,"d":9,"h":"Сщмч. Панкратія, єп. Тавроменійського (І). Сщмч. Кирила, єп. Гортинського (ІІІ – ІV). Прмчч. Патермуфія, Копрія і мч. Олександра (ІV). Свт. Федора, єп. Едеського (ІХ).","r":["Рим., 101 зач., IX, 6 – 19. Мф., 38 зач., X, 32 – 36; XI, 1."],"n":""},{"m":7,"d":10,"h":"Мчч. 45-ох в Нікополі Вірменському: Леонтія, Маврикія, Даниїла, Антонія, Олександра, Яникита, Сисинія, Менея, Вирилада та інших (бл. 319). Прп. Антонія Києво-Печерського, засновника українського чернецтва (1073). Прп. Силуана, схимника Києво- Печерського, в Дальніх печерах (ХІІІ – ХІV). Мч. Аполлонія (ІІІ). Мчч. Віанора й Силуана (ІV). Прмчч. пустельників єгипетських, вогнем і димом закатованих (бл. 398).","r":["Ран. – Мф., 43 зач., XI, 27 – 30.","Літ. – Рим., 85 зач., III, 28 – IV, 3. Мф., 24 зач., VII, 24 – VIII, 4.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 10 зач., IV, 25 – V, 12."],"n":"На ранній величання «Ублажаємо тебе, преподобний отче наш Антонію Печерський, і шануємо святу пам’ять твою, наставнику монахів і співрозмовнику ангелів»."},{"m":7,"d":11,"h":"3-тя неділя після П’ятдесятниці. Глас 2-й. Згадування чуда вмц. Євфимії Всехвальної, через яке православ’я утвердилось (451). Рівноап. Ольги, княгині Київської, у святому хрещенні Олени (969). Сщмч. Кіндея, пресвітера (ІІІ – ІV). Ран. – Єв. 3-є,","r":["Мк., 71 зач., XVI, 9 – 20.","Літ. – Рим., 88 зач., V, 1 – 10. Мф., 18 зач., VI, 22 – 33.","Рівноап.: Діян., 39 зач., ХVІ, 1 – 15. Лк., 33 зач., VII, 36 – 50."],"n":"На ранній величання «Величаємо тебе, свята рівноапостольна княгине Ольго, як зорю ранню, що на землі нашій засяяла і світло віри православної народу своєму сповістила»."},{"m":7,"d":12,"h":"4-й тиждень після П’ятдесятниці. Мчч. Прокла та Іларія (ІІ). Прав. Вероніки Єрусалимської (І). Прп. Михаїла Малеїна, ігумена (962). Мчч. Федора, варяга, і сина його Іоана, в Києві (983). Мц. Голіндухи Перської, у св. хрещенні Марії (591). Прп. Іоана (1005) і Гавриїла (Х) Святогорців (Груз.). Прп. Паїсія Святогорця (1994). Ікони Божої Матері «Троєручиця» (VІІІ).","r":["Рим., 102 зач., IX, 18 – 33. Мф., 40 зач., XI, 2 – 15.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Лк., 24 зач., VI, 17 – 23."],"n":""},{"m":7,"d":13,"h":"Собор архангела Гавриїла. Прп. Стефана Саваїта (794). Свт. Юліана, єп. Кеноманійського (І). Мч. Серапіона (ІІ – ІІІ). Мч. Маркіана (258). Прославлення свт. Софронія (Кришталевського), єп. Іркутського (1918).","r":["Рим., 104 зач., X, 11 – XI, 2. Мф., 41 зач., XI, 16 – 20.","Арханг.: Євр., 315 зач., VІІ, 1 – 6. Лк., 51 зач., X, 16 – 21."],"n":""},{"m":7,"d":14,"h":"Апостола від 70-х Акили (І). Мч. Юста Римського (І). Прп. Елія, ченця (ІV). Прп. Онисима Магнезійського, чудотв. (ІV). Блгв. Оскольда, першомуч. Київського, у св. хрещенні Миколая (882). Прп. Стефана Махрицького (1406).","r":["Рим., 105 зач., XI, 2 – 12. Мф., 42 зач., XI, 20 – 26.","Блгв.: Гал., 213 зач., V, 22 – VI, 2. Мф., 10 зач., IV, 25 – V, 12."],"n":""},{"m":7,"d":15,"h":"Рівноап. князя Київського Володимира, у св. хрещенні Василія (1015). Мчч. Кирика і матері його Улити (бл. 305). Мч. Авудима Тенедоського (ІV).","r":["Ран. – Ін., 36 зач., X, 9 – 16.","Літ. – Рівноап.: Гал., 200 зач., I, 11 – 19. Ін., 35 зач. (від половини), X, 1 – 9."],"n":"День хрещення Руси–України. На ранній величання: «Величаємо тебе, святий рівноапостольний княже Володимире, і шануємо святу пам’ять твою, ідолів ти знищив і всю нашу землю святим хрещенням просвітив»."},{"m":7,"d":16,"h":"Сщмч. Афіногена Севастійського, єп., і десятьох учнів його (бл. 311). Мч. Павла і мцц. Алевтини (Валентини) та Хіонії (308). Мч. Антіоха Севастійського, лікаря (ІV). Мц. Юлії, діви (бл. 440 або 613). Пам’ять свв. отців IV Вселенського собору (451). Прп. Іоана Вишенського, Святогорця (після 1620). Собор Київських святих.","r":["Рим., 106 зач., XI, 13 – 24. Мф., 43 зач., XI, 27 – 30 (за четвер). Рим., 107 зач., XI, 25 – 36."],"n":"Мф., 44 зач., XII, 1 – 8 (за п’ятницю)."},{"m":7,"d":17,"h":"Вмц. Марини (Маргарити) Антіохійської (ІV). Перенесення мощів прп. Лазаря Галисійського.","r":["Рим., 92 зач., VI, 11 – 17. Мф., 26 зач., VIII, 14 – 23."],"n":""},{"m":7,"d":18,"h":"4-та неділя після П’ятдесятниці. Глас 3-й. Пам’ять святих отців шістьох Вселенських соборів (перехідне святкування в неділю, найближчу до 16 липня). Мч. Еміліана (363). Мч. Якинфа Амастридського (ІV). Прп. Іоана Багатостраждального, Києво-Печерського, в Ближніх печерах (1160). Прп. Памви, затворника Києво-Печерського, в Дальніх печерах (1241). Прп. Памви Нітрійського, пустельника (ІV).","r":["Ран. – Єв. 4-е, Лк., 112 зач., XXIV, 1 – 12.","Літ. – Рим., 93 зач., VI, 18 – 23. Мф., 25 зач., VIII, 5 – 13. Свв. отців: Євр., 334 зач., XIII, 7 – 16. Ін., 56 зач., XVII, 1 – 13."],"n":"Воскресна служба з Октоїха поєднується зі службою святим отцям (у Мінеї під 16 липня). На Літургії прокимен, Апостол, алилуарій, Євангеліє і причасний воскресний і отцям."},{"m":7,"d":19,"h":"5-й тиждень після П’ятдесятниці. Прп. Макрини, сестри свт. Василія Великого (380). Прп. Дія Константинопольського, ігум. (бл. 430). Прп. Паїсія Києво-Печерського, в Дальніх печерах (ХІV). Блгвв. кн. Стефана (1427) і матері його кн. Милиці (1405), правителів Сербських. Знайдення мощів прп. Серафима, Саровського чудотворця (1903).","r":["Рим., 109 зач., XII, 4 – 5, 15 – 21. Мф., 45 зач., XII, 9 – 13."],"n":""},{"m":7,"d":20,"h":"Прор. Іллі (ІХ ст. до Р. Х.). Знайдення мощів прмч. Афанасія Берестейського (1649). Прав. Аарона, першосвященника (1451 до Р.Х.).","r":["Ран. – Лк., 14 зач., IV, 22 – 30.","Літ. – Рим., 114 зач., XIV, 9 – 18. Мф., 46 зач., XII, 14 – 16, 22 – 30.","Прор.: Як., 57 зач., V, 10 – 20. Лк., 14 зач., IV, 22 – 30."],"n":"На ранній величання «Величаємо тебе, пророче славний Іллє, і шануємо твоє на небеса з плоттю вогненне вознесіння»."},{"m":7,"d":21,"h":"Прор. Єзекиїля (VІ ст. до Р. Х.). Прпп. Симеона, юродивого заради Христа, та Іоана, співпосника його (бл. 590). Прпп. Онуфрія Мовчазного й Онисима, затворника, Києво-Печерських, у Ближніх печерах (ХІІ – ХІІІ).","r":["Рим., 117 зач., XV, 7 – 16. Мф., 48 зач., XII, 38 – 45."],"n":""},{"m":7,"d":22,"h":"Мироносиці рівноап. Марії Магдалини (І). Перенесення мощів сщмч. Фоки, єп. Синопського (403 – 404).","r":["Рим., 118 зач., XV, 17 – 29. Мф., 49 зач., XII, 46 – XIII, 3.","Рівноап.: 1 Кор., 141 зач., IX, 2 – 12. Ін., 64 зач., ХХ, 11 – 18 або Лк., 34 зач., VIІІ, 1–3."],"n":""},{"m":7,"d":23,"h":"Почаївської ікони Божої Матері (1675). Сщмч. Аполлінарія, єп. Равенійського (бл. 75). Мчч. Трофима, Феофіла і з ними 13 мчч. (ІV).","r":["Ран. – Лк., 4 зач., I, 39 – 49, 56.","Літ. – Рим., 120 зач., XVI, 1 – 16. Мф., 50 зач., XIII, 3 – 9. Богородиці: Євр., 320 зач., IX, 1 – 7. Лк., 54 зач., X, 38 – 42; XI, 27 – 28."],"n":"На ранній величання «Величаємо Тебе, Пресвятая Діво, і шануємо ікону Твою святу, її ж від літ древніх на горі Почаївській прославила Ти»."},{"m":7,"d":24,"h":"Прав. Афінагора Афінського (ІІ). Вмц. Христини (бл. 300). Мчч. блгвв. кнн. Бориса і Гліба, у св. хрещенні Романа і Давида (1015). Прп. Полікарпа, архім. Києво-Печерського (1182).","r":["Ран. – Лк., 106 зач., XXI, 12 – 19.","Літ. – Блгвв. кнн.: Рим., 99 зач., VIII, 28 – 39. Ін., 52 зач., XV, 17 – XVI, 2.","Ряд.: Рим., 97 зач., VIII, 14 – 21. Мф., 30 зач., IX, 9 – 13."],"n":"На ранній величання: «Величаємо вас, святі страстотерпці Борисе і Глібе, і шануємо чесні страждання ваші, бо ви молите за нас Христа Бога нашого»."},{"m":7,"d":25,"h":"5-та неділя після П’ятдесятниці. Глас 4-й. Успіння прав. Анни, матері Пресвятої Богородиці. Свв. жінок Олімпіади, диякониси (408 – 410), та Євпраксії, діви Тавенської (413). Пам’ять V Вселенського собору (553).","r":["Ран. – Єв. 5-е, Лк., 113 зач., XXIV, 12 – 35.","Літ. – Рим., 103 зач., X, 1 – 10. Мф., 28 зач., VIII, 28 – IX, 1.","Прав.: Гал., 210 зач., IV, 22 – 31. Лк., 36 зач., VIII, 16 – 21."],"n":""},{"m":7,"d":26,"h":"6-й тиждень після П’ятдесятниці. Сщмчч. Єрмолая, Єрмипа і Єрмократа, пресвітерів Нікомидійських (бл. 305). Прмц. Параскеви Римської (ІІ). Прп. Мойсея Угрина, Києво-Печерського, в Ближніх печерах (бл. 1043). Прп. Мойсея, чудотворця Києво-Печерського, в Дальніх печерах (ХІІІ – ХІV). Свт. Йосифа (Нелюбовича-Тукальського), митр. Київського, Галицького і всієї Руси (1675).","r":["Ран. – Ін., 35 зач. (від пол.), X, 1 – 9.","Літ. – Рим., 121 зач., XVI, 17 – 24. Мф., 51 зач., XIII, 10 – 23.","Свт.: Євр., 335 зач., ХІІІ, 17 – 21. Ін., 36 зач., Х, 9 – 16."],"n":"На ранній величання святителю: «Величаємо тебе, святителю отче Йосифе, і шануємо святу пам’ять твою, бо ти молиш за нас Христа Бога нашого»."},{"m":7,"d":27,"h":"Вмч. і цілителя Пантелеймона (305). Прпп. Анфіси, ігумені, і 90 сестер її (VІІІ). Рівноапп. Климента, єп. Охридського (916), Наума, Сави, Горазда й Ангеляра (ІХ-Х, Болг.). Прп. Германа Аляскинського (1837).","r":["Ран. – Лк., 106 зач., XХІ, 12 – 19.","Літ. – 1 Кор., 122 зач., I, 1 – 9. Мф., 52 зач., XIII, 24 – 30.","Вмч.: 2 Тим., 292 зач., II, 1 – 10. Ін., 52 зач., XV, 17 – XVI, 2."],"n":"На ранній величання: «Величаємо тебе, святий великомученику і цілителю Пантелеймоне, і шануємо чесні страждання твої, які за Христа перетерпів ти»."},{"m":7,"d":28,"h":"Апп. від 70-х: Прохора, Никанора, Тимона і Пармена, дияконів (І). Мчч. Юліана (І), Євстафія (бл. 316) та Акакія (бл. 321). Прп. Іова Угольського (1985). Смоленської ікони Божої Матері «Одигітрія» («Провідниця», принесена з Константинополя у 1046 році).","r":["1 Кор., 127 зач., II, 9 – III, 8. Мф., 53 зач., XIII, 31 – 36."],"n":""},{"m":7,"d":29,"h":"Мч. Калиника Кілікійського (ІІІ – ІV). Мц. Серафими, діви (ІІ). Мц. Феодотії і трьох дітей її (бл. 304). Прмч. Михаїла Едеського, ченця (ІХ). Мч. Євстафія Мцхетського (589, Груз.). Мч. Даниїла (Кушніра), Мліївського (1766).","r":["1 Кор., 129 зач., III, 18 – 23. Мф., 54 зач., XIII, 36 – 43."],"n":""},{"m":7,"d":30,"h":"Апп. від 70-х: Сили, Силуана, Крискента, Епенета і Андроніка (І). Мч. Іоана Воїна (ІV). Сщмчч. Поліхронія, єп. Вавилонського, Парменія, Єлими і Хрисотеля, пресвітерів, Луки і Муко, дияконів, мчч. Авдона і Сеніса, князів Перських, та Олімпія і Максима (бл. 251). Сщмч. Валентина (Уалентина), єпископа Італійського, і трьох учнів його – мчч. Прокули, Єфива та Аполлонія і прав. Авундія (бл. 273). Прп. Ангеліни, правительки Сербської (1520)","r":["1 Кор., 130 зач. (від половини), IV, 5 – 8. Мф., 55 зач., XIII, 44 – 54.","Мч.: Рим., 116 зач., XV, 1 – 7. Мф., 69 зач., ХVІ, 24 – 28."],"n":""},{"m":7,"d":31,"h":"Передсвято винесення древ чесного і животворчого Хреста Господнього. Прав. Йосифа Аримафейського (І). Прав. Євдокима Кападокійця (ІХ). Мц. Юлити Кесарійської (304 – 305).","r":["Рим., 100 зач., IX, 1 – 5. Мф., 32 зач., IX, 18 – 26.","Прав.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":"Заговини на Успенський піст."},{"m":8,"d":1,"h":"6-та неділя після П’ятдесятниці. Глас 5-й. Винесення чесних древ животворчого Хреста Господнього. Сімох мчч. Маккавеєвих: Авима, Антоніна, Гурія, Єлеазара, Євсевона, Аліма і Маркела, матері їхньої мц. Соломонії та вчителя їхнього мч. Єлеазара (166 р. до Р. Х.). Мчч. в Пергії Памфілійській: Леонтія, Атія, Олександра, Киндея, Минсифея, Киріака, Минеона, Катуна і Евклея (ІІІ).","r":["Ран. – Єв. 6-е, Лк., 114 зач., XXIV, 36 – 53.","Літ. – Рим., 110 зач., XII, 6 – 14. Мф., 29 зач., IX, 1 – 8.","Хреста: 1 Кор., 125 зач., I, 18 – 24. Ін., 60 зач., XIX, 6 – 11, 13 – 20, 25 – 28, 30 – 35.","Мчч.: Євр., 330 зач., XI, 33 – XII, 2. Мф., 38 зач., X, 32 – 36; XI, 1 (під зачало). На водосвятті: Євр., 306 зач., II, 11 – 18. Ін., 14 зач., V, 1 – 4."],"n":"Початок Успенського посту. На ранній полієлей звершуємо у вівтарі, катавасія «Хрест накреслив Мойсей...», після великого славослів’я винесення Хреста та поклоніння йому за чином Хрестопоклонної неділі. На Літургії співається Трисвяте. Після Літургії служимо мале освячення води. Хрест заноситься у вівтар увечері після відпусту вечірні. З цього дня до віддання Воздвиження на ранній, коли співається славослів’я, катавасія «Хрест накреслив Мойсей...». За винятком післясвята Преображення – катавасія Преображення: «Зібрання ізраїльтян…», а в період передсвята Успіння, на свято Успіння і в дні післясвята і віддання Успіння – катавасія Успіння: «Прикрашена божественною славою…»."},{"m":8,"d":2,"h":"7-й тиждень після П’ятдесятниці. Перенесення з Єрусалима до Константинополя мощів першомученика архідияк. Стефана (бл. 428) і знайдення мощів правв. Никодима, таємного учня Христового, Гамаліїла і сина його Авіва. Сщмч. Стефана, єп. Римського, та інших з ним (257).","r":["1 Кор., 134 зач., V, 9 – VI, 11. Мф., 56 зач., XIII, 54 – 58.","Першомч.: Діян., 17 зач., VI, 8 – 15; VII, 1–5, 47 – 60. Мф., 87 зач., XXI, 33 – 42."],"n":""},{"m":8,"d":3,"h":"Прав. Соломії, мироносиці (І). Прпп. Ісаакія, Далмата і Фавста (ІV – V). Мч. Раждена, перса (457, Груз.). Прп. Косми, пустельника (VІ).","r":["1 Кор., 136 зач., VI, 20 – VII, 12. Мф., 57 зач., XIV, 1 – 13."],"n":""},{"m":8,"d":4,"h":"Сімох отроків у Ефесі: Максиміліана, Ямвлиха, Мартиніана, Іоана, Діонісія, Ексакустодіана (Костянтина) та Антоніна (бл. 250; 408 – 450). Прмц. Євдокії (Ії) (362 – 364). Мч. Єлевферія (ІV).","r":["1 Кор., 137 зач., VII, 12 – 24. Мф., 60 зач., XIV, 35 – XV, 11."],"n":""},{"m":8,"d":5,"h":"Передсвято Преображення Господнього. Мч. Євсигнія Антіохійського (362). Сщмчч. Анфіра (236) і Фабіана (250), єп. Римських. Мч. Понтія Римлянина (бл. 257). Мчч. Кантидія, Кантидіана і Сивела, в Єгипті. Прав. Нонни, диякониси, матері свт. Григорія Богослова (374). Прп. Феоктиста Печерського, єп. Чернігівського (1123).","r":["1 Кор., 138 зач., VII, 24 – 35. Мф., 61 зач., XV, 12 – 21 (за четвер). 1 Кор., 139 зач., VII, 35 – VIII, 7."],"n":"Мф., 63 зач., XV, 29 – 31 (за п’ятницю)."},{"m":8,"d":6,"h":"ПРЕОБРАЖЕННЯ ГОСПОДА БОГА І СПАСИТЕЛЯ НАШОГО ІСУСА ХРИСТА.","r":["Ран. – Лк., 45 зач., IX, 28 – 36.","Літ. – 2 Пет., 65 зач., I, 10 – 19. Мф., 70 зач., XVII, 1 – 9."],"n":"На трапезі дозволяється риба. На ранній величання «Величаємо Тебе, Життєдавче Христе, і шануємо пречистої Твоєї Плоті преславне преображення». На каноні катавасія «Хрест накреслив Мойсей...». Замість «Чеснішу...» співаємо приспіви свята – 1-й приспів «Величай, душе моя, Господа, Який преобразився на Фаворі». На Літургії – антифони свята. Вхідний стих: «Господи, пошли світло Твоє й істину Твою, нехай вони ведуть мене і виведуть на святу гору Твою». Після вхідного стиха відразу співається тропар свята, «Слава і нині» – кондак свята, а на архієрейській Літургії після вхідного стиха співається: «Прийдіть, поклонімось… спаси нас, Сину Божий, що преобразився на горі…», а тоді тропар і кондак. Замість «Достойно є…» – «Величай, душе моя...», «Різдво Твоє нетлінне явилося...» (до віддання). Після закінчення Літургії здійснюється освячення винограду та інших плодів."},{"m":8,"d":7,"h":"Післясвято Преображення Господнього. Прмчч. Дометія Перського, ієродияк. та двох учнів його (363). Прп. Пимена Багатохворобливого, Києво-Печерського, в Ближніх печерах (1110). Прп. Пимена, посника Києво-Печерського, в Дальніх печерах (ХІІІ – ХІV). Прп. Меркурія Києво-Печерського, єп. Смоленського, в Ближніх печерах (1239). Мчч. Марина і Астерія (260). Прп. Ора Фіваїдського (бл. 390). Прмц. Потамії, чудотвориці. Прп. Феодосія Нового, лікаря (IX–X). Свт. Ієрофея, єп. Угорського (X). Св. Стефана I, короля Угорщини (1038). Прп. Феодори Сихлівської (XVIII, Рум.).","r":["Рим., 108 зач., XII, 1 – 3. Мф., 39 зач., X, 37 – XI, 1.","Прмчч.: Еф., 233 зач., VI, 10 – 17. Ін., 52 зач., XV, 17 – XVI, 2."],"n":"З цього дня на Літургії в будні дні, після входу, до віддання свята співається: «Прийдіть, поклонімось…спаси нас, Сину Божий, що преобразився на горі…»."},{"m":8,"d":8,"h":"7-ма неділя після П’ятдесятниці. Глас 6-й. Свт. Еміліана, спов., єп. Кизицького (815 – 820). Прп. Григорія, іконописця Києво-Печерського, в Ближніх печерах (ХІІ). Свт. Мирона, чудотворця, єп. Критського (бл. 350). Мчч. Єлевферія та Леоніда. Прп. Григорія Синаїта (ХІV).","r":["Ран. – Єв. 7-е, Ін., 63 зач., XX, 1 – 10.","Літ. – Рим., 116 зач., XV, 1 – 7. Мф., 33 зач., IX, 27 – 35."],"n":""},{"m":8,"d":9,"h":"8-й тиждень після П’ятдесятниці. Апостола Матфія (бл. 63). Мч. Антонія Олександрійського. Прп. Псоя Єгипетського (ІV). Мчч. Юліана, Маркіана, Іоана, Якова, Олексія, Димитрія, Фотія, Петра, Леонтія, Марії, патрикії, та ін. (730). Свт. Філарета, архієп. Чернігівського і Ніжинського (1866).","r":["Ран. – Ін., 67 зач., XXI, 15–25.","Літ. – 1 Кор., 142 зач., IX, 13 – 18. Мф., 65 зач., XVI, 1 – 6.","Ап.: Діян., 2 зач., I, 12–17, 21 – 26. Лк., 40 зач., IX, 1 – 6."],"n":"На ранній величання: «Величаємо тебе, апостоле Христів Матфію, і шануємо страждання і труди твої, ними ж потрудився ти у благовісті Христовому»."},{"m":8,"d":10,"h":"Сщмчч. Лаврентія, архідияк., Сикста ІІ, єп., Фелікисима й Агапіта, дияконів, мч. Романа воїна, Римських (258).","r":["1 Кор., 144 зач., X, 5 – 12. Мф., 66 зач., XVI, 6 – 12."],"n":""},{"m":8,"d":11,"h":"Сщмч. Євпла, архідиякона (304). Прмчч. Федора і Василія Києво-Печерських, в Ближніх печерах (1098). Прп. Федора, кн. Острозького, Києво-Печерського, в Дальніх печерах (бл. 1438). Мц. Сусанни, діви, і з нею сщмчч. Гая, єп. Римського, Гавинія, пресвітера, мчч. Клавдія, Максима, Препедигни, Олександра і Куфія (295 – 296).","r":["1 Кор., 145 зач., X, 12 – 22. Мф., 68 зач., XVI, 20 – 24."],"n":""},{"m":8,"d":12,"h":"Мчч. Фотія й Аникити та багатьох із ними (305 – 306). Сщмч. Олександра, єп. Команського (ІІІ). Мчч. Памфіла й Капітона.","r":["1 Кор., 147 зач., X, 28 – XI, 7. Мф., 69 зач., XVI, 24 – 28."],"n":""},{"m":8,"d":13,"h":"Віддання свята Преображення Господнього. Прп. Максима Сповідника (662). Мчч. Іполита, Іринея, Авундія і мц. Конкордії в Римі (258). Свт. Тихона.","r":["1 Кор., 148 зач., XI, 8 – 22. Мф., 71 зач., XVII, 10 – 18."],"n":"Служба з великим славослів’ям. Замість «Чеснішу...» співаються приспіви свята."},{"m":8,"d":14,"h":"Передсвято Успіння Пресвятої Богородиці. Прор. Михея (VІІІ ст. до Р. Х.). Перенесення мощів прп. Феодосія Києво-Печерського (1091). Сщмч. Маркела, єп. Апамейського (бл. 389).","r":["Прп.: Гал., 213 зач., V, 22 – VI, 2. Лк., 24 зач., VI, 17 – 23.","Ряд.: Рим., 111 зач., XIII, 1 – 10. Мф., 47 зач., XII, 30 – 37."],"n":""},{"m":8,"d":15,"h":"8-ма неділя після П’ятдесятниці. Глас 7-й. УСПІННЯ ПРЕСВЯТОЇ ВЛАДИЧИЦІ НАШОЇ БОГОРОДИЦІ І ПРИСНОДІВИ МАРІЇ. Ікони Успіння Божої Матері Києво-Печерської (1073). Ацкурської (І), Цилканської (ІV), Влахернської (Груз.), Бахчисарайської ікон Божої Матері.","r":["Ран. – Єв. 8-е, Ін., 64 зач., XX, 11 – 18.","Літ. – 1 Кор., 124 зач., I, 10 – 18. Мф., 58 зач., XIV, 14 – 22. Богородиці: Флп., 240 зач., II, 5 – 11. Лк., 54 зач., X, 38 – 42; XI, 27 – 28."],"n":"На ранній величання: «Величаємо Тебе, Пренепорочна Мати Христа Бога нашого, і всеславне славимо Успіння Твоє». Замість «Чеснішу...» співаємо приспіви свята – 1-й приспів: «Ангели, Успіння Пречистої бачивши, здивувалися: як Діва возноситься від землі на небо». На Літургії антифони святкові (див. у додатку с. 91), замість «Достойно є…» – «Ангели Успіння…», «Перемагаються закони природи...» (до віддання)."},{"m":8,"d":16,"h":"9-й тиждень після П’ятдесятниці. Післясвято Успіння. Перенесення з Едеси до Константинополя Нерукотворного образа (убруса) Господа Ісуса Христа (944). Мч. Діомида, лікаря (298). Мчч. 33-ох палестинських. Прп. Херимона Єгипетського (ІV). Мч. кн. Костянтина (1714, Рум.). Прп. Йосифа Ісихаста (1959).","r":["Ряд.: 1 Кор., 150 зач., XI, 31 – XII, 6. Мф., 74 зач., XVIII, 1 – 11.","Образу: Кол., 250 зач., I, 12 – 18. Лк., 48 зач. (від половини), IX, 51 – 56; X, 22 – 24."],"n":"З цього дня до віддання Успіння на літургії після входу в седмичні дні співається: «Прийдіть, поклонімось... спаси нас, Сину Божий, молитвами Богородиці...»."},{"m":8,"d":17,"h":"Сщмч. Мирона, пресвітера (250). Прп. Аліпія, іконописця Києво-Печерського, в Ближніх печерах (бл. 1114). Мч. Павла, мц. Юліанії та ін. (бл. 273). Мчч. Фірса, Левкія, Короната і воїнів їхніх (249 – 251). Мч. Патрокла (270 – 275). Мчч. Стратона, Филипа, Євтихіана і Кипріана (бл. 303).","r":["1 Кор., 152 зач., XII, 12 – 26. Мф., 76 зач., XVIII, 18 – 22; XIX, 1 – 2, 13 – 15."],"n":""},{"m":8,"d":18,"h":"Мчч. Флора і Лавра (ІІ). Мчч. Єрма, Серапіона і Полієна (ІІ). Сщмчч. Еміліана, єп., і з ним Іларіона, ієром., мчч. Діонісія і Єрмипа (бл. 300). Свтт. Іоана (674) та Георгія (683), патрр. Константинопольських. Прп. Макарія, ігум. Пелікитського (бл. 830). Прп. Іоана Рильського (946, Болг.). Ікони Божої Матері, названої «Всецариця» (XVII).","r":["1 Кор., 154 зач., XIII, 4 – XIV, 5. Мф., 80 зач., XX, 1 – 16.","Мчч.: Еф., 233 зач., VI, 10 – 17. Лк., 63 зач., XII, 2 – 12."],"n":""},{"m":8,"d":19,"h":"Мч. Андрія Стратилата і з ним 2593 мучеників (284 – 305). Мчч. Тимофія, Агапія і мц. Фекли (бл. 304).","r":["1 Кор., 155 зач., XIV, 6 – 19. Мф., 81 зач., XX, 17 – 28.","Мч.: Еф., 233 зач., VI, 10 – 17. Лк., 106 зач., XXI, 12 – 19." асиліси Нікомидійської (309). Сщмч. Аристіона, єп. Олександрійського. Свт. Іоаникія, патр. Сербського (1354). Пісидійської Мироточивої ікони Божої Матері (VI).","r":["2 Кор., 175 зач., IV, 1 – 6. Мф., 99 зач., XXIV, 13 – 28 (за четвер, під зачало). 2 Кор., 177 зач., IV, 13 – 18. Мф., 100 зач., XXIV, 27 – 33, 42 – 51 (за п’ятницю).","Сщмч.: Євр., 334 зач., XIII, 7 – 16. Ін., 36 зач., X, 9 – 16."],"n":""},{"m":9,"d":4,"h":"Сщмч. Вавили, єп. Антіохійського, і з ним трьох отроків: Урвана, Прилідіана, Еполонія та матері їхньої Христодули (бл. 251). Прор. Мойсея Боговидця (1531 до Р. Х.). Знайдення мощів свт. Іоасафа (Горленка), єп. Білгородського (1911). Мц. Єрміонії, дочки ап. Филипа, дияк. (бл. 117). Мч. Вавили Нікомидійського і з ним 84 учнів (ІV). Мчч. Федора, Міана, Юліана та Кіона (305 – 311). Ікони Божої Матері «Неопалима купина».","r":["1 Кор., 123 зач., I, 3 – 9. Мф., 78 зач., XIX, 3 – 12.","Прор.: Як., 57 зач., V, 10 – 20. Лк., 14 зач., IV, 22 – 30."],"n":""},{"m":9,"d":5,"h":"11-та неділя після П’ятдесятниці. Глас 2-й. Прор. Захарії і прав. Єлизавети, батьків св. Іоана Предтечі (І). Прмч. Афанасія, ігум. Берестейського (1648). Кончина блгв. кн. Гліба, в хрещенні Давида (1015). Мч. Фифаїла і сестри його мц. Фивеї (Вивеї) (98 – 138). Мч. Сарвила. Мц. Раїси (Іраїди) (бл. 308). Мчч. Ювентина і Максима, воїнів (361 – 363). Мчч. Урвана, Федора, Медимна і з ними 77 чоловіків з церковного чину, які в Нікомидії постраждали (370). Мч. Авдія (Авида) Перського (V).","r":["Ран. – Єв. 11-е, Ін., 67 зач., XXI, 15 – 25.","Літ. – 1 Кор., 141 зач., IX, 2 – 12. Мф., 77 зач., XVIII, 23 – 35.","Прор.: Євр., 314 зач., VI, 13 – 20. Мф., 96 зач., XXIII, 29 – 39 або Лк., 2 зач., І, 5 – 25, 57 – 68, 76, 80."],"n":"Після Літургії звершується молебень за збереження довкілля."},{"m":9,"d":6,"h":"12-й тиждень після П’ятдесятниці. Спомин чуда архістратига Михаїла в Хонах (Колосах) (ІV). Мчч. Євдоксія, Зинона і Макарія (311 – 312). Прп. Архипа в Хонах (ІV). Мчч. Ромила Римського і з ним багатьох інших (105 – 115). Сщмч. Кирила, єп. Гортинського (ІІІ – ІV). Сщмчч. Фавста, пресвітера, Авіва, диякона, і з ними 11 мучеників: Киріака та інших (бл. 250). Прп. Давида Гермопольського (VІ). Свтт. Михаїла (бл. 1073) і Марина (бл. 1095), єпп. Юр’ївських. Свтт. Лазаря (1117) та Сильвестра (1123), єпп. Переяславських, ігумм. Видубицьких. Києво-Братської (1654) й Арапетської (Аравійської) ікон Божої Матері.","r":["2 Кор., 179 зач., V, 10 – 15. Мк., 2 зач., I, 9 – 15.","Архангела: Євр., 305 зач., II, 2 – 10. Лк., 51 зач., X, 16 – 21."],"n":""},{"m":9,"d":7,"h":"Передсвято Різдва Пресвятої Богородиці. Мч. Созонта (бл. 304). Прмч. Макарія, архім. Канівського, Овруцького, Переяславського чудотворця (1678). Апп. від 70-х Евода (66) й Онисифора (після 67). Мч. Євпсихія Кесарійського (ІІ). Прп. Луки Каппадокійського (Х). Собор Вінницьких святих. Ікони Божої Матері «Вінницька» («Вінницько-Ріжецька») (XVIII).","r":["Ран.: Мф., 43 зач., XI, 27 – 30.","Літ. – 2 Кор., 180 зач., V, 15 – 21. Мк., 3 зач., I, 16 – 22 (за вівторок). 2 Кор., 182 зач., VI, 11 – 16. Мк., 4 зач., I, 23 – 28 (за середу, під зачало).","Прмч.: Еф., 233 зач., VI, 10 – 17. Ін., 52 зач., XV, 17 – XVI, 2."],"n":"На ранній величання: «Ублажаємо тебе, святий преподобномученику Макарію, і шануємо святу пам’ять твою, наставнику монахів і співрозмовнику ангелів»."},{"m":9,"d":8,"h":"РІЗДВО ПРЕСВЯТОЇ ВЛАДИЧИЦІ НАШОЇ БОГОРОДИЦІ І ПРИСНОДІВИ МАРІЇ. Ікони Софії – Премудрості Божої (Київської). Почаївської (1559), Домницької (1696), Холмської, Ліснинської та Кам’янка- Струмилової (XVII) ікон Божої Матері.","r":["Ран. – Лк., 4 зач., I, 39 – 49, 56.","Літ. – Флп., 240 зач., II, 5 – 11. Лк., 54 зач., X, 38 – 42; XI, 27 – 28."],"n":"На ранній величання: «Величаємо Тебе, Пресвятая Діво, і шануємо святих Твоїх батьків, і всеславне славимо різдво Твоє». Замість «Чеснішу…» - приспіви свята. 1-й приспів: «Величай, душе моя, преславне народження Божої Матері». На Літургії антифони святкові (див. у додатку с. 86). До віддання на Літургії (крім недільних днів) після входу співається: «Прийдіть, поклонімось... Спаси нас, Сину Божий, молитвами Богородиці…». Замість «Достойно…» – «Величай, душе... Чуже матерям...» (до віддання)."},{"m":9,"d":9,"h":"Післясвято Різдва Пресвятої Богородиці. Правв. Богоотців Іоакима й Анни. Мч. Северіана Севастійського (320). Знайдення і перенесення мощів свт. Феодосія, архієп. Чернігівського (1896). Прп. Феофана, сповідника і посника (бл. 300). Мчч. Харитона і Стратора (Стратоніка). Св. Микити Константинополького (ХІІ). Пам’ять ІІІ Вселенського собору (431).","r":["2 Кор., 183 зач., VII, 1 – 10. Мк., 5 зач., I, 29 – 35.","Богоотців: Гал., 210 зач. (від половини), IV, 22 – 31. Лк., 36 зач., VIII, 16 – 21."],"n":"Після Літургії звершується молебень за сім’ю."},{"m":9,"d":10,"h":"Мцц. Минодори, Митродори й Німфодори (305 – 311). Прп. Павла Послушного, Києво-Печерського, в Дальніх печерах (ХІІІ – ХІV). Апп. від 70-х: Аполоса (Апелія), Лукія і Климента (І). Мч. Варипсава (ІІ). Блгв. Пульхерії, імператриці Візантійської (453). Свтт. Петра і Павла, єпп. Нікейських (ІХ).","r":["2 Кор., 184 зач., VII, 10 – 16. Мк., 9 зач., II, 18 – 22."],"n":""},{"m":9,"d":11,"h":"Субота перед Воздвиженням. Прп. Феодори Олександрійської (474 – 491). Мчч. Димитрія, Єванфії, дружини його, і Димитріана, сина їхнього (І). Мчч. Діодора і Дидима, Сирійських. Прмц. Євдокії (Ії) Римлянки (362 – 364). Прп. Єфросина Палестинського (ІХ). Суботи перед Воздвиженням:","r":["1 Кор., 126 зач., II, 6 – 9. Мф., 39 зач., X, 37 – XI, 1.","Прп.: Гал., 208 зач., III, 23 – 29. Ін., 28 зач., VIІІ, 3 – 11."],"n":"На Літургії особливий прокимен: «Співайте Богу нашому, співайте…»."},{"m":9,"d":12,"h":"12-та неділя після П’ятдесятниці, перед Воздвиженням. Глас 3-й. Віддання свята Різдва Пресвятої Богородиці. Сщмч. Автонома, єп. Італійського (313). Сщмч. Юліана, пресвітера і з ним 40 мучеників (ІV). Сщмч. Федора, єп. Олександрійського. Сщмч. Корнута, єп. Нікомидійського (249 – 259).","r":["Ран. – Єв. 1-е, Мф., 116 зач., XXVIII, 16 – 20.","Літ. – неділі перед Воздвиженням: Гал., 215 зач., VI, 11 – 18. Ін., 9 зач., III, 13 – 17.","Ряд.: 1 Кор., 158 зач., XV, 1 – 11. Мф., 79 зач., XIX, 16 – 26."],"n":""},{"m":9,"d":13,"h":"13-й тиждень після П’ятдесятниці. Передсвято Воздвиження Чесного Хреста Господнього. Пам’ять оновлення (освячення) храму Воскресіння Христового в Єрусалимі (335). Сщмч. Корнилія Сотника, єп. (І). Мчч. Кроніда, Леонтія і Серапіона (бл. 237). Мчч. Селевка і Стратоніка (ІІІ). Мчч. Макровія і Гордіана (320). Сщмч. Юліана, пресвітера (ІV). Мчч. Іллі, Зотика, Лукіана і Валеріана (320). Прп. Петра в Атрої (ІХ). Вмц. Кетевані, цариці Кахетинської (1624, Груз.).","r":["2 Кор., 186 зач., VIII, 7 – 15. Мк., 11 зач., III, 6 – 12.","Оновленню: Євр., 307 зач., III, 1 – 4. Мф., 67 зач., XVI, 13 – 18."],"n":""},{"m":9,"d":14,"h":"ВОЗДВИЖЕННЯ ЧЕСНОГО І ЖИВОТВОРЧОГО ХРЕСТА ГОСПОДНЬОГО. Упокоєння свт. Іоана Золотоустого (407). Ліснинської ікони Божої Матері (1683).","r":["Ран. – Ін., 42 зач. (від половини), XII, 28 – 36.","Літ. – 1 Кор., 125 зач., I, 18 – 24. Ін., 60 зач., XIX, 6 – 11, 13 – 20, 25 – 28, 30 – 35."],"n":"Пісний день. Перед всенічною прикрашений квітами Хрест переноситься з жертовника на престол (за чином Хрестопоклонної неділі). На ранній величання: «Величаємо Тебе, Життєдавче Христе, і шануємо Хрест Твій святий, ним же спас нас від неволі ворожої». Полієлей звершується у вівтарі. Замість «Чеснішу…» – приспіви свята. 1-й приспів: «Величай, душе моя, пречесний Хрест Господній». Після великого славослів’я Хрест виноситься на середину храму. На Літургії – антифони свята. Вхідний стих: «Возносьте Господа Бога нашого і поклоняйтеся підніжжю ніг Його, бо Він Святий». Замість трисвятого співається «Хресту Твоєму...». З цього дня на архієрейській Літургії та в седмичні дні після входу до віддання свята співається: «Прийдіть, поклонімось… спаси нас, Сину Божий, що плоттю розіп’явся…». Хрест залишається посеред храму до віддання свята."},{"m":9,"d":15,"h":"Післясвято Воздвиження. Вмч. Микити (бл. 372). Знайдення мощів свт. Акакія, спов., єп. Мелітинського (ІІІ). Мчч. Максима, Феодота, мц. Аскліади (Аскліпіодоти) (305 – 311). Мч. Порфирія Ефеського (361). Знайдення мощів першомученика архідияк. Стефана (415). Прп. Філофея, пресвітера, в Малій Азії (Х). Свт. Йосифа, єп. Алавердського (570, Груз.). Свт. Симеона, архієп. Солунського (1429). Новомикитської ікони Божої Матері (372).","r":["2 Кор., 187 зач., VIII, 16 – IX, 5. Мк., 12 зач., III, 13 – 19 (за вівторок, під зачало). 2 Кор., 189 зач., IX, 12 – X, 7. Мк., 13 зач., III, 20 – 27 (за середу).","Вмч.: 2 Тим., 292 зач., II, 1 – 10. Мф., 36 зач., Х, 16 – 22."],"n":""},{"m":9,"d":16,"h":"Вмц. Євфимії Всехвальної (304). Мц. Севастіани (І). Мц. Мелітини (ІІ). Мчч. Віктора і Сосфена (бл. 304). Прп. Дорофея, пустельника Єгипетського (ІV). Мц. Людмили, кн. Чеської (921). Мчч. братів Йосифа та Ісака (808, Груз.). Свт. Кипріана, митр. Київського і всієї Руси, чудотворця (1406). Ікони Божої Матері, званої «Зглянься на смирення» (1420).","r":["2 Кор., 190 зач., X, 7 – 18. Мк., 14 зач., III, 28 – 35.","Вмц.: 2 Кор., 181 зач., VI, 1 – 10. Лк., 33 зач., VII, 36 – 50."],"n":""},{"m":9,"d":17,"h":"Мцц. Віри, Надії, Любові та матері їх Софії (бл. 137). Мцц. Феодотії (бл. 230) і Агафоклії. Мчч. 156: сщмчч. Пелія та Ніла, єпп. Єгипетських, Зинона, пресвітера, мчч. Патермуфія, Іллі та інших (310). Свт. Іоакима (Пані), патр. Олександрійського (1567). Константинопольської ікони Божої Матері (1071).","r":["2 Кор., 192 зач., XI, 5 – 21. Мк., 15 зач., IV, 1 – 9.","Мцц.: 2 Кор, 182 зач., VI, 1 – 10. Мф., 62 зач., ХV, 21 – 28."],"n":""},{"m":9,"d":18,"h":"Субота після Воздвиження. Прп. Євменія, єп. Гортинського (VІІ). Мц. Аріадни Фригійської (ІІ). Мцц. Софії та Ірини (ІІІ). Мч. Кастора. Мчч. Бидзини, Шалви і Елізбара, князів Ксанських (1660, Груз.). Молченської ікони Божої Матері (1405). Суботи після Воздвиження:","r":["1 Кор., 125 зач. (від половини), I, 26 – 29. Ін., 30 зач., VIII, 21 – 30.","Ряд.: 1 Кор., 126 зач., II, 6 – 9. Мф., 90 зач., XXII, 15 – 22."],"n":""},{"m":9,"d":19,"h":"13-та неділя після П’ятдесятниці, після Воздвиження. Глас 4-й. Мчч. Трофима, Саватія і Доримедонта (276). Прмч. Зосими, пустельника (ІV). Блгв. кн. Ігоря Чернігівського та Київського (1147). Перенесення мощів мч. Парфенія Жовківського, Римського на Галичину (1784) (перехідне свято у неділю після Воздвиження).","r":["Ран. – Єв. 2-е, Мк., 70 зач., XVI, 1 – 8.","Літ. – неділі після Воздвиження: Гал., 203 зач., II, 16 – 20. Мк., 37 зач., VIII, 34 – IX, 1.","Ряд.: 1 Кор., 166 зач., XVI, 13 – 24. Мф., 87 зач., XXI, 33 – 42.","Блгв.: Діян., 17 зач., VІ, 8 – VІІ, 5, 58 –60."],"n":"Ін., 52 зач., XV, 17 – XVI, 2 (під зачало)."},{"m":9,"d":20,"h":"14-й тиждень після П’ятдесятниці. Вмч. Євстафія Плакиди, дружини його Феопістії та синів їхніх Агапія та Феопіста (бл. 118). Мчч. та сповв. Михаїла, кн. Чернігівського, і боярина його Федора, чудотворців (1245). Прп. і блгв. кн. Чернігівського Олега Романовича (бл. 1285).","r":["2 Кор., 195 зач., XII, 10 – 19. Мк., 16 зач., IV, 10 – 23.","Вмч.: Еф., 233 зач., VI, 10 – 17. Лк., 106 зач., XXI, 12 – 19."],"n":""},{"m":9,"d":21,"h":"Віддання свята Воздвиження Животворчого Хреста Господнього. Ап. від 70-х Кодрата (бл. 130). Знайдення мощів свт. Димитрія (Туптала), митр. Ростовського (1752). Сщмчч. Іпатія, єпископа, та Андрія, пресвіт. (бл. 730 – 735). Свтт. Ісакія і Мелетія, єпп. Кіпрських. Мчч. Євсевія і Приска.","r":["Ран. – Ін., 35 зач. (від пол.), X, 1 – 9.","Літ. – 2 Кор., 196 зач., XII, 20 – XIII, 2. Мк., 17 зач., IV, 24 – 34.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16."],"n":"На ранній замість «Чеснішу…» співаємо приспіви свята. Величання святителю: «Величаємо тебе, святителю отче Димитрію, і шануємо святу пам’ять твою, бо ти молиш за нас Христа Бога нашого». Після відпусту Літургії священник через Царські врата виходить до аналоя, на якому лежить Хрест, і, обкадивши його тричі, в супроводі диякона чи свічконосця під час співу тропаря і ина Аназарвського (ІV). Прп. Юліана Перського (ІV). Вмц. Злати (Хриси) Мегленської (1795, Болг.).","r":["Ран. – Ін., 67 зач., XXI, 15 – 25.","Літ. – Еф., 227 зач., IV, 25 – 32. Лк., 10 зач., III, 19 – 22.","Ап.: Кол., 260 зач. (від половини), IV, 5 – 9, 14, 18. Лк., 51 зач., X, 16 – 21."],"n":"На ранній величання апостолу: «Величаємо тебе, апостоле Христів і євангелісте Луко, і шануємо страждання і труди твої, ними ж потрудився ти у благовісті Христовому»."},{"m":10,"d":19,"h":"Прор. Іоїля (800 до Р. Х.). Мчч. Уара Єгипетського і з ним 7-ох учителів християнських (бл. 307). Свв. Клеопатри (327) та її сина Іоана (320). Сщмч. Садока, єп. Перського, і з ним 128 мчч. (342). Прп. Гавриїла Афонського (1901).","r":["Еф., 230 зач., V, 20 – 26. Лк., 11 зач., III, 23 – IV, 1."],"n":""},{"m":10,"d":20,"h":"Вмч. Артемія (362).","r":["Еф., 231 зач., V, 25–33. Лк., 12 зач., IV, 1–15.","Вмч.: 2 Тим., 292 зач., II, 1 – 10. Ін., 52 зач., XV, 17 – XVI, 2."],"n":""},{"m":10,"d":21,"h":"Прп. Іларіона Великого (371 – 372). Мчч. Дасія, Гая і Зотика (303). Свт. Іларіона, митр. Київського (ХІ). Прп. Іларіона, схимника Києво-Печерського, в Дальніх печерах (ХІ). Перенесення мощів свт. Іларіона, єп. Меглинського (1206).","r":["Еф., 232 зач., V, 33 – VI, 9. Лк., 13 зач., IV, 16 – 22.","Прп.: 2 Кор., 188 зач., IX, 6 – 11. Лк., 24 зач., VI, 17 – 23."],"n":""},{"m":10,"d":22,"h":"Рівноап. Аверкія, єп. Ієрапольського, чудотворця (бл. 167). Свт. Рафаїла (Заборовського), митр. Київського, Галицького і всієї Руси (1747). Сімох отроків у Ефесі: Максиміліана, Ямвлиха, Мартиніана, Іоана, Діонісія, Ексакустодіана (Костянтина) та Антоніна (бл. 250; 408 – 450). Сщмч. Олександра, єп. Адріанопольського, мч. Іраклія, воїна, та мцц. Анни, Єлизавети, Феодотії та Глікерії (ІІ – ІІІ). Андрониківської (1281 – 1332) ікони Божої Матері.","r":["Ран. – Ін., 35 зач. (від пол.), X, 1 – 9.","Літ. – Еф., 234 зач., VI, 18 – 24. Лк., 14 зач., IV, 22 – 30.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16."] -х Клеопи (І). Сщмч. Зиновія, єп. Егейського, і сестри його мц. Зиновії (285). Апп. від 70-х: Тертія (Терентія), Марка, Юста (Варсави) і Артеми (І). Сщмч. Маркіана, єп. Сиракузького (ІІ). Мц. Євтропії Олександрійської (бл. 250). Свв. Стефана Милютина, короля Сербського (1320), брата його Драгутина (1316) і матері їхньої Олени (1306, Серб.). Озерянської ікони Божої Матері (ХVІ).","r":["1 Кор., 164 зач., XV, 58 – XVI, 3. Лк., 19 зач., V, 17 – 26."],"n":""},{"m":10,"d":31,"h":"19-та неділя після П’ятдесятниці. Глас 2-й. Апп. від 70-х: Стахія, Амплія, Урвана, Наркиса, Апелія та Аристовула (І). Мч. Епимаха (бл. 250). Прпп. Спиридона і Никодима, просфорників Києво-Печерських, в Ближніх печерах (ХІІ). Прп. Маври Константинопольської, диякониси (V). Свв. мучч. Тбіліських, убитих хорезмійцями (ХІІІ). Прав. Петра (Калнишевського) Багатостраждального (1803).","r":["Ран. – Єв. 8-е, Ін., 64 зач., XX, 11 – 18.","Літ. – 2 Кор., 194 зач., XI, 31 – XII, 9. Лк., 26 зач., VI, 31 – 36.","Прав.: Еф., 233 зач., VI, 10 – 17. Мф., 11 зач., V, 14 – 19."],"n":""},{"m":11,"d":1,"h":"20-й тиждень після П’ятдесятниці. Безсрр. і чудотворців Косми та Даміана Асійських і матері їхньої прп. Феодотії (ІІІ). Сщмчч. Іоана, єп., і Якова, пресвіт., які в Персії постраждали (бл. 345). Мцц. Кірієни та Юліанії (305 – 311). Мч. Ерминингельда, царевича Готського (586). Мчч. Кесарія, Дасія і з ними п’ятьох (VІІ).","r":["Флп., 241 зач., II, 12 – 16. Лк., 25 зач., VI, 24 – 30.","Безср.: 1 Кор., 153 зач., XII, 27 – XIII, 8. Мф., 34 зач. (від половини), X, 1, 5 – 8."],"n":""},{"m":11,"d":2,"h":"Мчч. Акиндина, Пигасія, Афонія, Елпідофора, Анемподиста та інших з ними (бл. 341 – 345). Прп. Маркіана Киринейського (388).","r":["Флп., 242 зач., II, 16 – 23. Лк., 27 зач., VI, 37 – 45.","Мчч.: Еф., 233 зач., VI, 10 – 17. Мф., 36 зач., X, 16 – 22."],"n":""},{"m":11,"d":3,"h":"Сщмчч. Акепсима, єп., Йосифа, пресвіт., та Аїфала, дияк. (ІV). Оновлення храму вмч. Юрія (Георгія) в Лідді (ІV). Мчч. Атика, Агапія, Євдоксія, Катерія, Істукарія, Пактовія, Никтополіона та воїнів їх (бл. 320). Прп. Акепсима Антіохійського (ІV). Прав. Снандулії (ІV). Прп. Анни Всеволодівни, княжни Київської (1112).","r":["Флп., 243 зач., II, 24 – 30. Лк., 28 зач., VI, 46 – VII, 1.","Прп.: Гал., 208 зач., ІІI, 23 – 29. Мф., 21 зач., VIІ, 12 – 21."],"n":""},{"m":11,"d":4,"h":"Прп. Іоаникія Великого (846). Сщмчч. Никандра, єп. Мирського, і Єрмія, пресвіт. (І). Пам’ять освячення собору Святої Софії в Києві (ХІ). Прп. Меркурія, посника Києво-Печерського, в Дальніх печерах (ХІV). Свт. Павла (Конюшкевича), митр. Тобольського (1770). Ікони Божої Матері «Оранта-Непорушна стіна» (ХІ).","r":["Ран. – Лк., 4 зач., I, 39 – 49, 56.","Літ. – Флп., 244 зач., III, 1 – 8. Лк., 31 зач., VII, 17 – 30. Богородиці: Флп., 240 зач., II, 5 – 11. Лк., 54 зач., X, 38 – 42; XI, 27 – 28."],"n":"На ранній величання: «Величаємо Тебе, Пресвятая Діво Богом обрана Отороковице, і шануємо образ Твій святий, що ним подаєш зцілення всім, хто з вірою приходить»."},{"m":11,"d":5,"h":"Мч. Галактіона та мц. Єпістимії (ІІІ). Апп. від 70-х: Патрова, Єрма, Ліна, Гая, Філолога (І). Свт. Григорія, архієп. Олександрійського (ІХ).","r":["Флп., 245 зач., III, 8 – 19. Лк., 32 зач., VII, 31 – 35."],"n":""},{"m":11,"d":6,"h":"Сщмч. Павла, архієп. Константинопольського, спов. (350). Прп. Луки, іконома Києво-Печерського, в Ближніх печерах (ХІІІ). Мцц. Текуси, Олександри, Полактії, Клавдії, Євфрасії, Афанасії і Мотрони (ІІІ). Прп. Луки Тавроменійського (800 – 820).","r":["2 Кор., 168 зач., I, 8 – 11. Лк., 20 зач., V, 27 – 32."],"n":""},{"m":11,"d":7,"h":"20-та неділя після П’ятдесятниці. Глас 3-й. Мчч. постраждалих у Мелитині: Ієрона, Ісихія, Никандра, Афанасія, Маманта, Варахія, Калиника, Феогена, Никона, Лонгина, Федора, Валерія, Ксанфа, Феодула, Калимаха, Євгенія, Феодоха, Острихія, Епіфанія, Максиміана, Дукитія, Клавдіана, Феофіла, Гігантія, Дорофея, Феодота, Кастрикія, Аникити, Фемелія, Євтихія, Іларіона, Діодота й Амонита (ІІІ). Прп. Лазаря Галісійського, ієром.  Тобі». Замість «Достойно» – «Тобою радується…». Причасний: «Хваліть Господа з небес…». Після відпусту Літургії чин славлення, клірики перед іконою і свічником з запаленою свічкою співають тропар і кондак свята Різдва Христового."},{"m":12,"d":25,"h":"РІЗДВО ГОСПОДА БОГА І СПАСИТЕЛЯ НАШОГО ІСУСА ХРИСТА. Літургія за чином свт. Іоана Золотоустого.","r":["Ран. – Мф., 2 зач., I, 18 – 25.","Літ. – Гал., 209 зач., IV, 4 – 7. Мф., 3 зач., II, 1 – 12."],"n":"Від 25 грудня до 4 січня – святки (святі дні). Немає посту в середу і п’ятницю. Всенічна складається з великого повечір’я, літії та ранньої і починається з виголосу: «Слава Святій, Єдиносущній, Животворчій і Нероздільній Тройці завжди, нині і повсякчас, і на віки віків». На ранній величання: «Величаємо Тебе, Життєдавче Христе, що заради нас нині плоттю народився від Безневісної і Пречистої Діви Марії». Приспів на 9-й пісні канону «Величай, душе моя, чеснішу і славнішу від горніх воїнств Діву Пречисту Богородицю». На Літургії – антифони свята, вхідний стих: «Із утроби раніше віків Я породив Тебе. Клявся Господь і не розкається: “Ти священник повік за чином Мелхиседековим”». Замість трисвятого – «Всі ви, що в Христа хрестилися...». Замість «Достойно є…» – «Величай, душе моя...», «Таїнство дивне бачу і преславне...» (до віддання). В седмичні дні та на архієрейських службах після малого входу «Прийдіть, поклонімось... спаси нас, Сину Божий, що від Діви народився...» (до віддання). До віддання в седмичні дні відпуст святковий, а в недільні – воскресний."},{"m":12,"d":26,"h":"27-ма неділя після П’ятдесятниці, після Різдва Христового. Глас 2-й. Прав. Йосифа Обручника, Давида, царя, і Якова, брата Господнього (перехідне святкування у неділю після Різдва Христового). Післясвято Різдва Христового. Собор Пресвятої Богородицi. Сщмч. Євфимія, єп. Сардійського (бл. 840). Прп. Костянтина Синадського (VІІІ). Прп. Евареста Студита (825). Віленсько-Остробрамських, названих «Трьох радостей» та «Милостива» ікон Божої Матері.","r":["Ран. –
