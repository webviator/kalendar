копреосвященства і Преосвященства, улюблені у Христі брати і співслужителі! Слава Ісусу Христу! Четвертий раз у новітній історії щорічний Архієрейський Собор Помісної Церкви збирається тут, в Успенській Києво-Печерській Лаврі. Вперше цього року у стінах Лаври відбулося також засідання Священного Синоду Православної Церкви України. Це, серед багатьох інших фактів та подій, є свідченням, що хоча і поступово, але незворотно ця святиня стає невід’ємною частиною духовного життя та церковної праці автокефальної Православної Церкви України, позбуваючись решток штучно накинутого їй ярма вчення і практики «русского міра». Вже за кілька місяців, у листопаді, виповниться 35 років від того часу, коли в цих самих стінах Трапезного храму преподобних Антонія і Феодосія Собор Української Православної Церкви під головуванням її тодішнього Предстоятеля Блаженнійшого Митрополита Філарета одноголосно визначив, що вона повинна бути автокефальною. Нині продовженням нашої праці саме тут ми свідчимо про правильність тих рішень. Рішень, ухвалених тоді одноголосно, хоча згодом, на жаль, багато хто з учасників Собору через страх земний від них і відрікся. Лише як автокефальна і помісна Церква, Українська Православна Церква може повною мірою виконувати своє призначення проповідувати істину без домішку лжевчень, таких як вчення «русского міра». Лише як незалежна, вона може служити Богу, а не кремлівському кесарю та його імперії зла, служити рідному українському народу, а не видуманій «святій русі». Ухвалене тоді в цих стінах рішення, як і всі інші рішення, які православні українські ієрархи, духовенство та вірні протягом ХХ століття – століття української боротьби за духовну та державну незалежність – ухвалювали щодо відкинення неканонічної підлеглості російському імперському центру, було сприйняте не всіма та не відразу. Ми добре знаємо, що Московська патріархія тоді ж спровокувала глибоке розділення в Українській Церкві, яке, на жаль, продовжується навіть дотепер. Однак саме завдяки тим зусиллям, які від часу Української революції 1917-20 рр. прикладалися все новими і новими поколіннями борців за Українську Церкву, в 2018 р. стало можливим довершити цей столітній шлях успішним проведенням у Святій Софії Київській Об’єднавчого Собору. Його плодом стало усунення попередніх перешкод для набуття від нашої Матері-Церкви, від Вселенського Патріархату, Томосу про автокефалію. Нині ж цей Томос вже восьмий рік є канонічним свідченням нашої повноцінної автокефалії, нашої зрілості, як Помісної Церкви, рівноправної з усіма іншими Православними Церквами-Сестрами. В рік 975-ліття від заснування цієї Святої Лаври ми віримо та свідчимо, що молитовне заступництво святих Антонія і Феодосія Печерських, молитви всіх лаврських угодників Божих, завжди були і нині є благословенням для зростання та утвердження як всієї нашої Помісної Церкви, так і, зокрема, цієї Святої Лаври – її особливого священного духовного осередку. На жаль, рік 975-ліття Лаври увійде в історію також і як страшний для обителі, для всього українського народу, для християнського світу та для всіх людей доброї волі рік російської атаки на цю святиню. Запустивши на Лавру смертоносні дрони, що спричинили пожежу та руйнування як на головному соборі, так і в низці інших місць святині, російські агресори цим продовжили ряд злочинів, які проти цього святого місця вже здійснили їхні попередники. Лише протягом ХХ століття саме від кремлівських окупантів ця святиня страждала не один раз – її обстрілювали у 1918 р. війська Муравйова, які йшли на Київ, її двічі розорили за кремлівським наказом, у 1920-х та у 1960-х роках, зупинивши тут молитву та чернече життя і використовуючи для пропагування атеїзму. Але найстрашніший злочин вчинили тоді, коли за вказівкою кремлівського керівництва у 1941 році Велику Лаврську Церкву, Успенський собор, підірвали радянські диверсанти. І ось знову російська імперія зла, власними чорними ділами спростовуючи гордовиту претензію бути «Святою Руссю», зазіхнула на Лавру, на її святині. До явленого раніше зла, до руйнувань і вбивств, які щоденно вже багато років продовжує чинити агресор на нашій землі, додано було новий злочин проти віри, проти духовної святині, проти культури та історії. Собор зазнав пошкоджень, але був врятований від найгіршого. І ми віримо, що Бдіння і Божественна літургія, які у соборному храмі вперше після його пошкодження російським обстрілом відбулися саме в день пам’яті преподобного Антонія Печерського минулого тижня – це знак благословення нашої доброї справи. Ігумен і братія Афонського монастиря Есфігмен, в якому був пострижений святий Антоній і з благословення старців якого він заснував Лавру 975 років тому, звершили тут молитву, засвідчивши нерозривність нашого духовного зв’язку та єдність істинної православної традиції. Дорогі владики! Згадавши про проведені тут, в цих святих стінах, наші соборні та синодальні засідання, хочу наголосити на тому, що попри всі труднощі, пов’язані з триваючою війною, попри всі об’єктивні виклики, які постають перед нашою Церквою, ми неухильно виконуємо обов’язок, покладений на нас канонічним порядком – проводимо чергові засідання Архієрейського Собору та Священного Синоду. У нас у визначений п’ятирічний строк відбувся Помісний Собор і ми вже починаємо підготовку до наступного. Всі рішення та підсумкові документи наших засідань ми офіційно поширюємо для відкритого публічного засвідчення, вивчення та виконання. Можливо для нас самих такий стан речей здається звичайним і є нормою. Але, коли порівняти ці факти з реаліями у тих, хто часто і безпідставно нас критикує – ми можемо побачити явну і принципову відмінність. Наприклад, досі, хоча спливло вже понад чотири роки, так і не було офіційно опубліковано ті документи, якими Митрополія в юрисдикції Московської патріархії, що діє в Україні, нібито «встановила свою незалежність від Російської Церкви». В самій цій Помісній Церкві Росії Архієрейського Собору не було з 2017 року, а останній справжній Помісний Собор був там взагалі у 1990 році! Бо зібрання 2009 р. хоча і назване було Помісним Собором, нічим, окрім фіксації призначення нового глави РПЦ, не займалося. Всі ми добре знаємо, що серед чотирьох сутнісних ознак Церкви є її соборність. Писання називає Церкву тілом, порівнюючи кожного, хто належить до неї, з частиною цього тіла. І всі ці частини тіла, хоча і виконують різні функції, разом забезпечують його здатність жити та діяти, а якщо відокремлюються від тіла, то вмирають. Знаючи це, ми повинні, попри всі наші відмінності, різницю в досвіді, в характерах, в поглядах на різні теми, неухильно дотримуватися соборної єдності. Хто віддаляється від неї, – ті, як частина, відділена від тіла, зазнають біди. Кожен з нас, архієреїв, стаючи на шлях служіння, промовляє слова присяги: «Обіцяю церковний мир зберігати і твердо дотримуватись, і нічого протилежного Православній Кафоличній Східній християнській вірі не мати ні в думках, ні в почуттях у всі дні життя мого; і бути послідовним у всьому і підкорюватися завжди владиці і отцю нашому Блаженнійшому Митрополиту Київському і всієї України, і Священному Синоду Православної Церкви України, і преосвященним митрополитам, архієпископам і єпископам, братії моїй, в усьому бути спільним з ними, і спільноправним з божественними законами і священними правилами святих Апостолів і святих Отців, і любов духовну від усієї душі мати до них і як братію шанувати». Ці слова – не просто формальність урочистої традиції. Вони є словом присяги, складеної перед Богом та церковною повнотою, яке кожному ієрарху, всім нам неухильно слід виконувати, всіляко оберігаючи соборну єдність Церкви. Тож, дорогі владики, закликаю всіх нас і надалі цінувати нашу соборну традицію, нашу спільну працю, плекати нашу єдність. Її виразом є, серед іншого, і цей наш черговий Собор, і те велике свято, яке ми будемо вшановувати сьогодні та завтра – День Хрещення України-Руси та пам’ять святого рівноапостольного князя Володимира. Сьогодні і завтра вперше за вісім років ми знову разом звершимо богослужіння свята Хрещення України-Руси у Володимирському кафедральному патріаршому соборі нашої столиці. У доповіді буде окремо більше уваги приділено подіям, які сталися протягом попереднього року, але тут коротко зазначу: спільними зусиллями, в дусі християнської любові та миру нам вдалося подолати виклики внутрішньої незгоди, які були перед нами не один рік. Ми зміцнили нашу єдність, в любові, пошані та молитві знайшовши мир з попереднім Предстоятелем Київського Патріархату блаженної пам’яті спочилим Святійшим Патріархом Філаретом. На цьому прикладі ми знову пересвідчилися, що терпеливість, смирення, дотримання церковного та канонічного порядку, прагнення порозуміння та християнська любов, як сукупність всіх чеснот, здатні допомагати долати будь-які виклики і випробування. Віримо, що і ті виклики, які перед нами надалі залишаються, в першу чергу – подолання впливу лжевчення «русского міра» та спровокованого і підтримуваного Москвою церковного розділення – у належний час теж з Божою допомогою, завдяки терпеливості та любові, спільними зусиллями будуть успішно розв’язані. Всі ви, дорогі владики, знаєте, що в православній традиції постанови і рішення Соборів хоча і вступають в силу відразу, не є для них останнім етапом – фінальним свідченням про них стає механізм рецепції, тобто прийняття соборних ухвал і діянь повнотою Церкви. Причому слід підкреслити, що іноді може залишатися навіть на багато років чи навіть на століття група тих, хто через свою впертість не сприймає рішення, які Церква визнала добрими та справедливими. Але вперте відкинення правди якоюсь групою в Церкві не зупиняє саму дієвість належних соборних рішень і не робить їх сумнівними. Минулого року ми урочисто разом з усім християнським світом святкували ювілей 1700-ліття Першого Вселенського собору. Він відбувся у 325 році, але протягом наступних понад п’яти десятиліть тривала боротьба за ствердження його рішень, Церкву продовжували хвилювати єресі та розділення, в певні моменти навіть сила держави ставала на бік противників Нікейського символу віри. Остаточно лише Третій Вселенський собор, через понад століття після Першого, у 431 році встановив, що Символ віри є незмінним і до нього нічого не слід додавати та від нього нічого не слід віднімати. Але навіть після цього ще понад півтора століття продовжували діяти групи впертих єретиків аріан. Ми бачимо, що соборні рішення, ухвалені в час відновлення нашої державної незалежності щодо автокефалії Української Церкви, попри весь спротив Московської патріархії та її союзників, були втілені в життя, пройшли свою рецепцію. Так само рішення Об’єднавчого Собору в Святій Софії вже зараз є сприйняті переважною більшістю православних України і щороку число тих, хто виконує їх, продовжує зростати. Водночас, на жаль, залишаються ще ті, хто вперто відкидають Об’єднавчий Собор, ставлять його і саме буття Православної Церкви України під сумнів, чекають якихось інших рішень чи навіть інших соборів, які мали би для них змінити те, що вже утвердилося. Але як позиція різних груп не зупиняла рецепцію і втілення рішень Вселенських Соборів, так і позиція противників церковної єдності в Україні не може ані скасувати, ані змінити того факту, що Православна Церква України, як помісна і автокефальна, рівноправна з іншими Церквами-Сестрами – є і буде. До Об’єднавчого Собору кожна з гілок поділеного українського православ’я з точки зору повноти православ’я мала власні недоліки, на які вказувала нам і Церква-Матір, Вселенський Патріархат. Але всі ці недоліки відповідно до канонічного порядку були завчасно усунуті, Собор своєю волею і рішеннями затвердив це, Томос про автокефалію засвідчив це, рецепція вже відбулася і продовжує успішно відбуватися. Тож ніякого вороття до минулого – не може бути. Попереду є лише один вірний шлях, який відповідає церковному порядку та несе благо для Православної Церкви і для України: всі, хто ще не сприйняв визначення Об’єднавчого Собору і Томосу про автокефалію, мають сприйняти і виконувати їх. Різні спроби поставити це під сумнів – це шлях на манівці, в сторону від правди і від блага для Церкви. Переконаний, що успіх Української держави, яка невдовзі відзначить 35-ліття відновлення своєї незалежності, успіх у розбудові єдиної Помісної Православної Церкви України, є серед тих факторів, які в чорній душі кремлівського диктатора викликали думки силою зброї накласти на нас ярмо «русского міра». Бо він усвідомив, що і політично, і суспільно, і духовно Україна віддаляється від російської імперії зла. Віддаляється назавжди, скинувши ярмо «русского міра». Тому він став сучасним тираном-фараоном, який побачив народ, що за покликом Божим йде з рабства до свободи, і кинувся навздогін за нами зі своїм військом, аби примусити українців знову навіки бути рабами і покарати нас за прагнення волі. Але як Господь посоромив того давнього фараона, що противився волі Божій, так, віримо, буде посоромлений і цей новітній тиран. І разом з ним будуть посоромлені волхви його, які, подібно до згадуваних Писанням чаклунів Яннія та Ямврія, своєю оманою прагнули переконати всіх надалі відкидати волю Божу. Кирил Гундяєв та всі його поплічники у злі, як в самій Росії, так і поза її межами, всі проповідники лжевчення «русского міра» та «священної війни» – це не стільки пастирі Церкви Христової, скільки новітні волхви єгипетські Янній та Ямврій. І як ті давні неправдомовці були викриті пророком Мойсеєм, так і ці сучасні злі волхви неодмінно будуть посоромлені Богом. Водночас, ми всі добре знаємо, що правда перемагає не сама собою, а завдяки тим, хто приймає її та втілює в життя. І наша Помісна Церква, і Україна продовжують своє життя не лише завдяки тому, що на нашому боці правда і Боже благословення, але і завдяки тим, хто жертовно щодня втілює цю правду – нашим мужнім захисникам, нашим новітнім героям-воїнам, які захищають Україну проти агресії російської імперії зла. Попри жорстокість і підступність ворога, вони успішно захищають рідну землю і дають нам надію на перемогу над агресором та на встановлення справедливого тривалого миру. Щодня ми підносимо наші молитви за українське військо, за наші Сили оборони, за наших рятівників, які мужньо допомагають постраждалим від російських варварських обстрілів житлових будинків та цивільної інфраструктури, за лікарів та медичних працівників, які опікуються пораненими, за всіх, хто сприяє стійкості нашого народу в час війни. Завтра під час Божественної літургії ми соборно знову будемо підносити ці молитви. І нехай Господь всіляко допомагає кожному з тих, хто в умовах війни служить правді, захищає ближніх, примножує справи милосердя. На жаль у цій війні український народ щодня зазнає також непоправних втрат. Тисячі захисників за ці дванадцять з половиною років російсько-української війни загинули на фронті, померли від отриманих у бою ран, загинули від тортур і жорстокості у російському полоні. Тисячі мирних мешканців, а серед них – сотні дітей загинули від російських варварських обстрілів. Вшановуючи їхню пам’ять, згадуючи подвиг захисників, молячись за всіх, хто в Україні від нашестя чужинців загинув, просімо у Господа, щоби Він упокоїв душі загиблих у оселях праведників, прийняв їх у Своє Небесне Царство! Вічна їм пам’ять! Молячись за загиблих та полеглих від війни, ми також шануємо всіх захисників, хто продовжує боротьбу з російським агресором. Нехай Господь благословить цю їхню боротьбу успіхом, подає перемогу над супротивником, захищає від небезпеки! Всім нашим мужнім героям, воїнам-захисникам України, многії літа! Дорогі владики! Завершуючи вступне слово я офіційно відкриваю роботу чергового щорічного Архієрейського Собору нашої Помісної Української Православної Церкви. За даними письмової реєстрації для відкриття нашого засідання ми маємо в наявності визначений статутними нормами кворум його учасників. За Статутом Православної Церкви України склад Архієрейського Собору обмежується лише єпархіальними архієреями. Однак Священний Синод нашої Церкви, засідання якого відбулося напередодні, вважає за необхідне продовжити традицію, яка склалася у нас від Об’єднавчого Собору і нашого першого Архієрейського Собору, проводити засідання, залучаючи весь єпископат. Тому черговий Архієрейський Собор також був скликаний у розширеному складі за участі всього єпископату Православної Церкви України. Священний Синод напередодні узгодив порядок денний засідання, який пропонується для вашого затвердження: 1. Доповідь Предстоятеля про життя Помісної Церкви за період після Архієрейського Собору 14 липня 2025 р.; 2. Затвердження рішень Священного Синоду УПЦ (ПЦУ) за попередній період, від часу проведення Архієрейського Собору 14 липня 2025 року, та рішень, що з них випливають, зокрема судових рішень про позбавлення священного сану. Прошу підтримати і затвердити такий формат нашої роботи у розширеному складі та запропонований порядок денний. ЦЕРКВА У ФАКТАХ Дорогі брати! Православна Церква України на даний час складається з 46 єпархій, які в Україні об’єднують понад 9200 релігійних громад, а також понад дев’яносто чоловічих та жіночих монастирів. За рік, який минув, ще близько 200 парафій юридично завершили процес зміни підпорядкування, вийшли з-під неканонічної влади Московського патріархату та доєдналися до родини Православної Церкви України. Попри російську агресію, яка триває, попри складні обставини життя, стараннями парафіяльних громад, різних установ та військових частин за рік було завершене будівництво, облаштування чи відновлення і відбулося освячення 42 нових храмів і каплиць. Окремо слід зупинитися на рівні підтримки, яку наша Церква має з боку суспільства. За даними минулорічного опитування Київського міжнародного інституту соціології, найбільше українців – 63% – вважають себе православними. Серед них найбільше – 50% серед усіх респондентів – зараховують себе до Православної Церкви України, що становить майже 80% серед усіх православних мешканців України. Ще 9% зараховують себе до Православної Церкви «без конкретизації» приналежності до юрисдикції та лише 4% свідчать про приналежність до юрисдикції Московського Патріархату. Далі йдуть атеїсти (16%) – це число дещо зросло за рік, хоча багато з опитаних обирають ідентифікацію агностика чи іншу подібну, не визнаючи себе безпосередньо безбожником. До УКГЦ зараховують себе 6% опитаних. Інші варіанти обирали не більше 2% респондентів. У всіх чотирьох великих регіонах відносна більшість вважають себе православними і у кожному з них більшість серед загального числа опитаних там (44% на Заході, 57% у Центрі, 46% на Півдні і 49% на Сході) зараховують себе саме до Православної Церкви України. Отже, за всіма ключовими показниками Православна Церква України, навіть в умовах аномального існування в Україні неканонічної юрисдикції Московського патріархату, продовжує бути найбільшим релігійним об’єднанням в нашій країні та однією з найбільших Помісних Церков. Однак вкотре слід підкреслити, що ці дані не повинні заспокоювати нас. У порівнянні з попередніми роками цифри підтримки зазнали негативного коливання, хоча і в межах статистичних похибок дослідження, тож необхідно буде вивчати тенденції у більш тривалому розвитку. І все ж необхідно усвідомлювати, що високі для нашої Церкви цифри суспільної підтримки та конфесійної самоідентифікації громадян надалі існують поруч із значно нижчим числом тих, хто регулярно відвідує богослужіння та визнає релігійне життя важливим для себе. Також триває поступова тенденція збільшення числа невіруючих та байдужих до віри, особливо серед молоді: серед тих, кому до 30 років, число атеїстів значно збільшилося (за рік з 20% до 29%), тоді як серед груп старшого віку їх 12-13%. Тому наше спільне завдання – давати відповідь на ці виклики, сприяти більш глибокому воцерковленню номінальних православних, поширенню серед молоді знань про православне християнське вчення і кращому залученню її до практичного духовного життя. На даний час ми маємо 10 закладів вищої духовної освіти – це 5 академій (Київська, Львівська, Волинська, Ужгородська, Івано-Франківська), 1 інститут (Івано-Франківський), 4 семінарії (Львівська, Рівненська, Дніпровська, Чернівецька). Також діють освітні програми «Богослів’я» першого (бакалаврського) і другого (магістерського) рівнів вищої освіти у Чернівецькому національному університеті ім. Ю. Федьковича, та освітньо-професійна програма «Богослів’я» першого (бакалаврського) рівня вищої освіти в Українському державному університеті науки і технологій у м. Дніпро. Загальна кількість студентів, які здобувають освіту в наших духовних навчальних закладах – понад 1700. Попри надзвичайно складні зовнішні умови та катастрофічну демографічну ситуацію є тенденція до збільшення кількості бажаючих отримати вищу богословську освіту у закладах вищої освіти Православної Церкви України. Зокрема, це пов’язане з розвитком капеланського служіння – серед інших студентів освіту отримують як вже діючі, так і майбутні капелани. Педагогічний процес у вищих духовних навчальних закладах нашої Помісної Церкви забезпечують понад 300 викладачів. При Священному Синоді нашої Церкви продовжує діяти 15 синодальних установ та 6 комісій. За звітний період Київською Митрополією спільно із Синодальною богословсько-літургічною комісією та Синодальним видавничо-просвітницьким управлінням були підготовлені та видані чотири томи Требника, окрема книга з чином вечірні на П’ятидесятницю. Також видані п’ятий том проповідей Предстоятеля та збірка його роздумів «Сила віри – відновлює!», пам’ятне видання про митрополита Даниїла (Чокалюка) до 20-ї річниці з дня смерті. Видано презентаційний журнал «Життя Церкви» українською і англійською мовами, в якому містяться основні події з життя нашої Помісної Церкви за минулий рік. Здійснено кілька перевидань, зокрема першого тому Требника, Молитовників різного формату, Часослова, Служебника та інших необхідних книг. Київська Митрополія видає та поширює різні періодичні видання – це офіційний журнал «Помісна Церква», богословсько-публіцистичний журнал «Церква і суспільство», офіційна газета «Моя Церква». Ведеться робота над підготовкою до видання Апостола та Октоїха. Православна Церква України буде продовжувати активно працювати над оновленням всього корпусу богослужбових книг та постійно збільшувати число нових видань не лише богослужбового характеру, але й просвітницького та богословського. Інформаційний супровід життя Православної Церкви України в мережі Інтернет здійснюють офіційний сайт, офіційний додаток для мобільних пристроїв «Моя Церква», який регулярно оновлюється і осучаснюється, працюють офіційні сторінки Церкви та Предстоятеля у низці соціальних мереж, відбувається регулярна трансляція богослужінь Суспільним телебаченням України, а також на сторінках у мережах YouTube і Facebook, завдяки чому до молитви можуть долучатися і ті вірні, які з різних причин не беруть участь у богослужінні особисто. Принагідно ще раз закликаю всіх архієреїв сприяти поширенню серед духовенства і пастви інформації про наші видання, друковані та мережеві. Офіційними виданнями Православної Церкви України також є Церковний календар та Богослужбові вказівки. З благословення Священного Синоду календарною комісією продовжується впорядкування місяцеслова, зокрема за звітний період було подано і затверджено Синодом внесення більше 350 імен святих першого тисячоліття, пам’ять яких шанується в інших Помісних Церквах, а також багатьох старозавітніх святих та святих перших століть. Ця робота буде активно продовжуватись. Щодо складу Помісної Церкви, то на цей час у ній звершують служіння понад 6000 кліриків. Ми маємо 63 архієрея – 45 єпархіальних, 12 вікарних, 3 титулярних архієрея, а також 3 архієреї перебувають на спокої. За звітний рік у єпархіях нашої Церкви звершені були понад 400 священничих і дияконських хіротоній. З часу попереднього Собору відбулися три архієрейські хіротонії – вікаріїв Київської та Рівненської єпархій преосвященних владик Феодосія (Ляховича), Рафаїла (Жигала) та Онуфрія (Ляди). Привітаємо наших співбратів: Аксіос! Один вікарний архієрей, єпископ Єпіфаній (Дімітріу), на його прохання був звільнений від виконання обов’язків та перейшов у юрисдикцію Вселенського Патріархату, продовживши там своє служіння. 20 березня цього року упокоївся найстарший за віком і за хіротонією архієрей нашої Церкви – Святійший Патріарх Філарет. Він був винятковою за значенням та часом праці постаттю в історії Української Церкви. Нехай Господь прийме його у Свої оселі, вічна йому пам’ять! ЦЕРКОВНА ЄДНІСТЬ Дорогі брати! Всім нам добре відомо, які виклики від часу проведення Об’єднавчого Собору та отримання Томосу про автокефалію постали перед Православною Церквою України щодо збереження її внутрішньої єдності. Вже було згадано про те, що прагнення російського імперського державно-релігійного центру утримувати свою беззаконну владу хоча би над частиною православних в Україні було в минулому та продовжує бути зараз основною зовнішньою причиною церковних поділів в українському православ’ї. Однак історія минулого століття яскраво свідчить нам, що окрім цього і серед самих прихильників церковної незалежності виникали суперечки, які призводили до поділів та навіть розколів. Тому від початку нашим спільним ключовим завданням було і залишається збереження єдності Православної Церкви України. Ми не маємо права знову повторювати трагічні помилки минулого, яскраво описані ще в «Думі» видатного гетьмана України та вірного сина і мецената Православної Церкви Івана Степановича Мазепи: «През незгоду всі пропали, самі себе звоювали». В умовах агресивної геноцидної війни, яку російська держава продовжує вести проти України, згуртованість та внутрішня єдність Православної Церкви України, як найбільшого релігійного об’єднання в нашій державі, є також фактором стійкості суспільства та безпеки країни. Наш Архієрейський Собор на своїх попередніх засіданнях не раз обговорював питання, пов’язані зі збереженням канонічного порядку та внутрішньої церковної єдності, ухвалював відповідні рішення. Нині ми можемо з вдячністю Богові констатувати, що обраний нами шлях був вірним і ми спільними зусиллями досягли на ньому успіху. Попри шалені намагання проросійських сил та інших супротивників єдності ПЦУ перешкодити примиренню, завдяки особистим зустрічам Предстоятеля ПЦУ зі спочилим Святійшим Патріархом Філаретом, завдяки добрій волі та усвідомленню відповідальності за майбутнє Української Церкви, ми змогли подолати ту кризу, яка виникла у 2019 р. Святійший Патріарх Філарет відійшов у вічність в мирі, а його приклад спілкування в любові надихнув клір та вірних Володимирського кафедрального патріаршого собору та більшості громад і духовенства відновити повноту канонічного спілкування з Предстоятелем ПЦУ. Водночас ситуацією намагалися скористатися як російські сили, так і дехто в Україні. Всупереч будь-яким елементарним правилам і етичним нормам, з ініціативи колишнього архієрея УПЦ КП Іоасафа Шибаєва, російського громадянина, який живе в Білгородській області РФ та без жодного сумніву перебуває під контролем та впливом російських спецслужб, група з кількох осіб стала видавати себе за керівництво УПЦ Київського Патріархату. Всі ці нечисленні особи – раніше заборонені в служінні за порушення священники нашої Церкви. Їхні заяви та дії, залучення до своєї групи відвертих міжнародних релігійних аферистів свідчать про їхню абсолютну маргінальність. Якщо російські спецслужби чи хтось з любителів інтриг в Україні на початку ще сподівалися використати цих людей з метою якогось впливу на церковну ситуацію, нині є цілком очевидним, що подібні сподівання – марні. Священний Синод завчасно попереджав головних діячів схизматичної групи, що вони, перебуваючи вже під забороною в священнослужінні та продовжуючи свою антицерковну діяльність, підлягають суду. Враховуючи важкість провини цих осіб, їхню затятість у гріху та явне небажання виправитися, Священний Синод на своєму засіданні заслухав справи за звинуваченнями у канонічних порушеннях раніше заборонених у священнослужінні клірика Сумської єпархії архімандрита Никодима (Володимира Кобзаря), клірика Херсонської єпархії ігумена Михаїла (Миколи Ковалюка), клірика Одеської єпархії ієромонаха Никона (Юрія Граблюка), визнав кожного з них винним та позбавив священного сану. Від них не надійшло жодних мотивованих апеляцій, тож є всі підстави для Архієрейського Собору затвердити синодальні судові рішення так само, як це було зроблено щодо низки інших колишніх ієрархів та священників нашої Церкви, які брали участь у діях, спрямованих на її розділення. Окремо слід ще раз підкреслити, що нашими попередніми синодальними та соборними рішенням було ясно і однозначно зафіксовано, що оголошення будь-яких осіб православними архієреями Української Православної Церкви без обрання їх Священним Синодом ПЦУ на чолі з Предстоятелем ПЦУ, Митрополитом Київським і всієї України, не визнається нашою Церквою і не буде визнане у майбутньому як таке, що суперечить канонам і церковному порядку. Всі, хто долучаються до схизматичної діяльності в надії отримати якесь звання, повинні ясно усвідомлювати, що в Православній Церкві України ці фіктивні звання, титули та сани не мають і не будуть мати ніякого значення. На жаль, серед православних існує багато поділів, десятиліттями і навіть довше на території багатьох Помісних Церков існують різні маргінальні схизматичні групи, які називають себе «істинно-православними», «катакомбними» тощо. Тож поява ще однієї подібної групи хоча і викликає жаль, однак це не є чимось унікальним саме для України. Минулого року в доповіді Архієрейському Собору були докладно окреслені ті зовнішні виклики, які стоять перед нашою Церквою. На жаль, за рік ситуація принципово не змінилася і виклики ці залишаються тими ж самими. Відтак, не буду знову повторювати сказане минулого року, а лише коротко нагадаю про те, що нам слід особливо враховувати у нашій подальшій праці. Російська держава та залежна від неї Московська патріархія надалі намагаються використовувати свій вплив серед інших Помісних Церков, аби в той чи інший спосіб утримувати їх від спілкування з Православною Церквою України. Водночас як глибоко позитивний факт ми маємо оцінювати те, що жодна з Церков, окрім Російського Патріархату та залежної від нього Митрополії в Україні, не розірвала спілкування зі Вселенським Патріархатом з приводу проголошення Томосу про автокефалію ПЦУ. Отже, попри великі намагання Росії подати нинішній стан Православ’я як якийсь глобальний поділ чи навіть розкол, насправді в цьому розколі бере участь лише Московська патріархія. Вона, базуючись на викривленому вченні про «русскій мір», все більше віддаляється не лише від спілкування з повнотою Православ’я, але від самих його віровчительних євангельських та святоотцівських основ. Тому наша позиція, висловлена і минулого, і позаминулого року Архієрейським Собором, щодо необхідності загального церковного осудження лжевчення «русского міра» як єретичного, залишається особливо актуальною. Це лжевчення не просто створює проблеми як всередині Помісних Церков, так і у відносинах між ними, але воно вже істотно руйнує саму єдність Православної Церкви як такої, порушує її канонічний порядок і традиції. У порівняні з попереднім часом ми у цій справі маємо істотне зрушення. За участю представників нашої Церкви в грудні 2025 року на конференції у Гельсінкі (Фінляндія) під егідою Конференції європейських церков була схвалена критична заява щодо ідеології та практики «русского міра», бо ця ідеологія містить єретичні елементи, фальсифікує християнство, виправдовує імперіалізм та агресивну війну. Цей документ став логічним продовженням Волоської декларації богословів з осудженням ідеології «русского міра», опублікованої на базі православної Волоської академії (Греція) у 2022 р. Гельсінська заява у березні 2026 року була офіційно схвалена як документ Конференцією європейських церков, що є першим прецедентом засудження вчення про «русскій мір» саме як єретичного, на міжхристиянському загальноєвропейському рівні. Як і минулого року, нині ми можемо знову констатувати, що російська влада має дві мети. Перша – повне знищення української незалежності та самої української ідентичності. Друга, якщо перше не буде можливим реалізувати – максимально зашкодити Україні та українському народу, намагатися тримати під контролем наше суспільне та державне життя, включаючи релігійні справи. Виходячи з цього коли йдеться про Церкву, то перший російський план полягає в повному придушенні та руйнуванні Православної Церкви України, у поверненні всіх православних під контроль Москви. У випадку, коли російські війська не будуть в змозі окупувати всю територію України (а за оцінками експертів при нинішніх темпах ведення війни на це знадобилося би майже дев’ять десятиліть), кремлівська тиранія прагне підкорити собі та зробити маріонетковими всі українські інституції, в тому числі церковні. Це є запасний план. Саме тому перед нами, як перед Помісною Церквою, у найближчому майбутньому продовжує стояти подвійне завдання. Перше – надалі всіма можливими способами сприяти обороні України від російської гібридної агресії, щоби не допустити окупації нашої країни, втрати нею свободи та суверенітету. Друге – чинити максимальний спротив будь-яким спробам поширювати російські впливи як в нашій Помісній Церкві, так і в цілому в українському суспільстві. Окремо слід відзначити виклик для церковного життя в Україні, який залишається актуальним – неканонічне існування структури, підлеглої Московському патріархату. Попри численні власні заяви представників цієї юрисдикції про її нібито незалежність від РПЦ, вона залишається афілійованою з російським релігійним центром – з Московською патріархією. Протягом всього минулого року, як і весь час до того ми неодноразово, постійно і наполегливо закликали і продовжуємо закликати до діалогу і єднання вірних, духовенство та ієрархів, які досі ще перебувають в підлеглості Московському патріархату. З метою надання організаційного сприяння та для координації розв’язання практичних аспектів щодо ведення конструктивного діалогу про подолання церковних суперечностей між православними в Україні, спровокованих помилковими поглядами та рішеннями Московської патріархії РПЦ, 2 лютого 2026 року наш Священний Синод утворив Комісію з діалогу на чолі з митрополитом Хмельницьким і Шепетівським Симеоном. Також Синод поширив своє звернення до православних вірних, духовенства та ієрархів в Україні, які залежать від позиції Російського патріархату. Ніякої офіційної реакції з боку керівництва Митрополії, яку очолює митрополит Онуфрій, не було – як не було її також на всі наші попередні заяви і звернення. Попри це я пропоную в рішеннях Собору знову підтвердити нашу відкритість до діалогу без попередніх умов, метою якого ми бачимо єднання всіх православних в Україні навколо Київського престолу на засадах автокефалії та відповідно до канонічних норм і Патріаршого та Синодального Томосу від 2019 р. Також ми вдячні всім православним, хто протягом цього часу почув наш заклик до єдності, полишив неканонічну, духовно шкідливу і морально збанкрутілу підлеглість Московській патріархії та долучився до родини Православної Церкви України. Остаточне звільнення від ярма «русского міра» є життєво необхідним для України та духовно корисним для православ’я. 15 грудня минулого року як Предстоятель я провів збори духовенства ставропігійних та інших парафій Православної Церкви України, – того духовенства, яке колись перебувало в юрисдикції УПЦ (МП) і долучилося до творення родини нашої Помісної Церкви. За підсумками зборів його учасники опублікували звернення, в якому, серед іншого, сказано: «Ми наголошуємо: історичний момент і трагедія війни вимагають категоричної своєчасності. Не можна відкладати канонічне виправлення та відмежування від ідеології, що освячує геноцид, знову і знову чогось очікувати та в чомусь шукати виправдання власної бездіяльності. Кожен день, який проходить у розділенні та зволіканні, є продовженням духовної ізоляції і шкодить єдності нашого народу. Ми закликаємо єпископат, духовенство та вірних УПЦ усвідомити всю відповідальність моменту і зробити власний рішучий і своєчасний крок до єдиної Помісної Церкви, засвідчуючи свою вірність Христу, Його Церкві та Україні. Це єдиний шлях до духовної перемоги та цілісності нашого народу». Підсумовуючи цю тему, вважаю за необхідне підкреслити: ми як Помісна Церква робимо все можливе і навіть більше для того, щоби подолати наслідки церковного розділення в Україні, яке створила та штучно продовжує підтримувати Московська патріархія і російська держава, що її контролює. Свідчення багатьох громад та кліриків, які вже послідували визначеному Томосом про автокефалію порядку та увійшли в єднання з Православною Церквою України, підтверджують – шлях до єдності відкритий для всіх, хто справді бажає блага Православній Церкві та Україні. Водночас, аналіз історичних процесів доводить, що істотні зміни у церковному устрої прямо пов’язані зі змінами у зовнішньому світі. Наприклад, лише падіння монархії Романових в Росії дало можливість РПЦ вперше за два століття провести свій Собор та відновити патріаршество. Занепад тоталітарного Радянського Союзу дав можливість розпочати успішне відновлення боротьби за автокефалію Української Православної Церкви. Ці та багато інших прикладів доводять, що головними факторами, які істотно вплинуть на зміну позиції Російського патріархату та його послідовників в Україні, будуть поразка РФ у війні проти України та її союзників, а також неминуча зміна політичного режиму в Кремлі, яка станеться після Путіна. Наше спільне завдання – до моменту настання цих історичних змін непохитно протидіяти лжевченню «русского міра» та допомагати всім, хто бажає звільнитися з цього духовного ярма, увійти в родину Православної Церкви України. МІЖНАРОДНІ ВІЗИТИ Протягом звітного року відбулися численні події, пов’язані із міжнародною та міжцерковною взаємодією. Про всі ці події ми робили офіційні повідомлення на сторінках наших церковних видань. Тому коротко хочу зупинитися лише на деяких з них, які мають особливу вагу. В першу чергу йдеться про паломництво делегації ПЦУ на чолі з Предстоятелем до монастирів та святинь Афону, яке відбулася з 10 по 12 жовтня 2025 року. Протягом цих трьох днів відбулися паломницькі відвідування Священної Епістасії та Протату Святої Гори, шести священних монастирів – Есфігмен, Пантократор, Іверон, Ставронікіта, Симонопетра, Ксенофонт, скита пророка Іллі та ісіхастіріона Святих Архангелів Фалакру, були звершені очолені Київським Митрополитом дві Божественні літургії – у Іллінському скиту монастиря Пантократор та у соборному храмі монастиря Ксенофонт, а також Вечірня і молебень перед чудотворною Іверською іконою «Вратарниця» в монастирі Іверон, численні подячні молебні, з піднесенням прохань про українських воїнів та весь народ, про перемогу над злом і справедливий мир для України. З благословення Його Всесвятості Вселенського Патріарха Варфоломія митрополит Мілетський Апостол, настоятель Святого Патріаршого і Ставропігійного монастиря великомучениці Анастасії Узорішительки, супроводжував Предстоятеля ПЦУ та паломників з України протягом всього візиту і співслужив з ними під час Божественних літургій. Також гостей з України супроводжував урядовий губернатор Гори Афон Алківіад Стефаніс, який представляв Уряд Грецької Республіки. Успішний візит Предстоятеля ПЦУ до святинь Афону, візит отців з монастиря Есфігмен до Києва, який відбувся днями, численні паломництва ієрархів духовенства та вірних ПЦУ на Святу Гору спростовують поширювані в середовищі прихильників «русского міра» думки, ніби на Афоні відкидають автокефалію ПЦУ. Навпаки – Священна Епістасія, як головний керівний орган афонського братства, офіційно засвідчила, що приймає на Святій Горі Предстоятеля ПЦУ саме як Митрополита Київського і всієї України. З нагоди сьомої річниці підписання та вручення Патріаршого і Синодального Томосу про автокефалію Православної Церкви України з 4 по 6 січня 2026 р. відбувся візит делегації ПЦУ на чолі з Предстоятелем, Митрополитом Київським і всієї України, до Вселенського Патріархату. До складу делегації увійшли також Головний секретар Священного Синоду митрополит Вінницький і Барський Симеон, заступник голови Управління зовнішніх церковних зв’язків митрополит Рівненський і Острозький Іларіон та інші клірики. Візит засвідчив нашу вдячність за все добре, що Матір-Церква зробила і продовжує робити для нас. У складі делегації Всеукраїнської Ради Церков і релігійних організацій Предстоятель 22-25 червня 2026 р. перебував з візитом у Брюсселі (Бельгія) та Берліні (Німеччина), де брав участь у різних заходах в контексті початку переговорного процесу про вступ нашої держави до Європейського Союзу. Як Церква ми послідовно підтримуємо обраний нашим народом шлях єдності з європейською демократичною спільнотою. Водночас ми вважаємо своїм обов’язком, разом з іншими релігійними об’єднаннями України та інституціями громадянського суспільства захищати духовний, моральний і культурний спадок нашого народу, традиційні для нього цінності, які визначають його унікальність. Згадані тут візити – лише мала частина тих міжнародних контактів, які протягом року відбувалися як в Україні, так і за кордоном, що свідчить про зростаючу повагу до нашої Церкви у світі. ВИКЛИКИ, ПОВ’ЯЗАНІ З ВІЙНОЮ Російська агресія проти України та викликані нею процеси поставили перед нашою Церквою низку викликів, які в цьому році, як і у попередні роки, залишаються актуальними. В першу чергу йдеться про гуманітарну діяльність. Наші громади та єпархії, наші благодійні інституції, такі як «Елеос» та «Параволан», продовжують надавати посильну допомогу Силам оборони України, біженцям і вимушеним переселенцям, які постраждали від війни. Минулого року ми вже відзначали, що з плином часу ця діяльність ускладнюється, адже потреб не стає менше, однак зменшується кількість тих, хто готовий жертвувати на їхнє задоволення. Цей рік став не менш складним, але попри це ми повинні продовжувати нашу гуманітарну місію, знаходити можливість для реалізації відповідних проектів. Водночас одним із важливих завдань для нас залишається збільшення кількості духовенства. Число парафій продовжує зростати, а можливість забезпечувати їх пастирями об’єктивно ускладнюється, адже ми як Церква маємо потребу й надалі скеровувати наших кваліфікованих священників на капеланське служіння. Тож наш постійний обов’язок як архіпастирів, особливо актуальний у нинішніх умовах, – й надалі дбати про добір, виховання та освіту гідних кандидатів до прийняття священного сану. Дорогі владики! Як ви знаєте, продовжує діяти урядова постанова, якою релігійні організації були віднесені до критичної інфраструктури, що дозволило застосувати механізм бронювання священнослужителів, які є керівниками і працівниками релігійних організацій. Через Київську Митрополію вам надається інформація щодо того, які умови ставить держава для здійснення цього процесу та які дані потрібно надати, щоби він відбувався успішно. Знову, як і минулого року, прошу кожного керівника єпархії уважно поставитися до свого обов’язку інформувати і координувати роботу щодо збору та передачі відповідних даних. Також слід пам’ятати, що процес бронювання безпосередньо пов’язаний з поданням релігійними організаціями до податкової служби річного звіту за визначеною формою. Прошу вас завчасно нагадати настоятелям громад про цей обов’язок, щоби на початку наступного року у визначені терміни такі звіти були подані. І ще одне, на чому хочу особливо наголосити: до питання бронювання прикута і підвищена суспільна увага, і увага правоохоронних органів. Викриті зловживання у цій сфері тягнуть за собою як церковне покарання, так і можливу кримінальну відповідальність. Тож всі дії у цій сфері мають бути максимально точними, відповідати церковним правилам та державним нормам. ПРОПОЗИЦІЇ Безперечно, що навіть у великій доповіді неможливо розкрити детально всі теми та питання, які постають перед нашою Помісною Церквою. Тому свої регулярні засідання має Священний Синод, працюють наші Синодальні управління та комісії. Відтак всі ті теми, які прозвучали в доповіді, не можуть вважатися вичерпним переліком питань, які потребують нашої уваги. Однак пропоную обмежитися вже сказаним та перейти до підсумків. Тож подаю на розгляд Собору наступні пропозиції, які мають бути, у разі підтримки, зафіксовані у соборних рішеннях і постановах: 1. Дати оцінку діяльності Київської Митрополії та Предстоятеля за час, що минув від попереднього Архієрейського Собору 14 липня 2025 р. 2. Затвердити всі прийняті Священним Синодом УПЦ (ПЦУ) від часу попереднього Архієрейського Собору (14 липня 2025 р.) рішення, в тому числі судові, відображені у відповідних синодальних документах. 3. Поновити свідчення бажання і готовності нашої Помісної Церкви вести діалог, мета якого – досягнення єдності українського православ’я навколо Київського престолу на засадах Томосу про автокефалію та згідно з викладеними принципами. Ще раз наголосити на тому, що юрисдикція МП в Україні є канонічним порушенням і аномалією та спрямувати заклик до духовенства і мирян, які дотепер ще залишаються в юрисдикції Московського патріархату, продовжувати процес єднання з Православною Церквою України і не боятися так званих «заборон» і «позбавлень сану», бо вони є неканонічними. 4. Підтримати викладені у цій доповіді оцінки та пропозиції і взяти їх до уваги у подальшій праці з розбудови Помісної Церкви. Нехай Бог благословить нас на плідну соборну працю, на корисне обговорення порушених питань та на ухвалення вірних рішень. Дякую всім вам за увагу, за співпрацю та підтримку! Слава Ісусу Христу! Архієрейського Собору Української Православної Церкви (Православної Церкви України) у розширеному складі під головуванням Блаженнійшого Епіфанія, Митрополита Київського і всієї України, від 14 липня 2026 р. Місто Київ, Трапезний храм преподобних Антонія і Феодосія Печерських Свято-Успенської Києво-Печерської Лаври. Зібравшись згідно рішення Священного Синоду на своє чергове щорічне засідання та провівши його у розширеному складі єпископату Української Православної Церкви (Православної Церкви України), Архієрейський Собор підносить подяку Богові за Його численні милості та благодіяння для Православної Церкви України, зокрема явлені протягом часу від попереднього засідання. Собор підносить до Господа подячну молитву за врятування від знищення великої святині – Успенського собору Києво-Печерської Лаври, в дах якого влучив російський дрон, що призвело до пожежі. Атака на цю святиню, як і знищення або пошкодження внаслідок російських обстрілів понад 740 релігійних об’єктів в Україні, безперервні терористичні атаки з російського боку проти мирних мешканців та цивільної інфраструктури в Україні є беззаперечним свідченням диявольської природи агресивної війни, яку російська держава протягом понад дванадцяти років веде проти нашої країни та українського народу. Собор з глибокою вдячністю та пошаною до жертовного подвигу підносить молитви за українських воїнів, які мужньо захищають нашу землю і народ від російської агресії, за рятівників, за лікарів та медичних працівників, за всіх, хто допомагає постраждалим від війни, а також просить для них, для всіх мирних мешканців, які продовжують страждати від атак ворога, для біженців та вимушених переселенців, для наших співгромадян, які перебувають в окупації, для українських полонених Господньої допомоги, милості та опіки. З нагоди Дня Української Державності закликаємо благословення Господнє на Президента України, Верховного Головнокомандувача Збройних сил України Володимира Олександровича Зеленського, на Сили оборони України, на всіх, хто служить Україні та суспільству в органах державної влади та у місцевих громадах і на весь наш народ. Нехай з допомогою Божою буде успішною наша спільна боротьба за перемогу над російським агресором і за встановлення справедливого миру. Незмінно вшановуючи полеглих захисників України та усіх мирних мешканців, вбитих російськими агресорами, ми низько схиляємо голову і підносимо свої молитви за упокоєння їхніх душ. Вічна і світла їм пам’ять! Собор підносить молитви за військових капеланів, а також за братів архієреїв, за духовенство і вірних, які постраждали від війни, перебувають в умовах окупації або були вимушені полишити місце свого проживання. Нехай Господь подає вам сили перенести всі виклики, пов’язані з війною. Від імені повноти Православної Церкви України Собор висловлює незмінну сердечну подяку особисто Його Всесвятості Вселенському Патріарху Варфоломію і нашій Матері Великій Христовій Церкві у Константинополі, Предстоятелям та повноті Олександрійського Патріархату, Церкви Кіпру та Церкви Греції за всебічну підтримку в час важких випробувань війною, яких зазнає український народ і Помісна Українська Православна Церква. Собор щиро цінує підтримку для України з боку християнських Церков, релігійних спільнот та всіх людей доброї волі і благословляє зусилля, які спрямовуються на допомогу для України, на досягнення повного припинення вогню та якнайшвидше встановлення справедливого миру. Собор висловлює вдячність Конференції європейських церков за офіційне засудження вчення «русского міра», як такого, що містить єретичні елементи та суперечить Євангелію, виправдовує і схвалює агресивну імперіалістичну війну. Собор засвідчує, що Православна Церква України послідовно підтримує обраний нашим народом шлях єдності з європейською демократичною спільнотою. Водночас ми вважаємо своїм обов’язком, разом з іншими релігійними об’єднаннями України та інституціями громадянського суспільства захищати духовний, моральний і культурний спадок нашого народу, традиційні для нього цінності, які визначають його унікальність. Заслухавши та обговоривши доповідь Предстоятеля, Митрополита Київського і всієї України Епіфанія, про діяльність від часу попереднього свого засідання 14 липня 2025 р., Архієрейський Собор постановляє: 1. Схвалити роботу Предстоятеля, Митрополита Київського і всієї України Епіфанія та Київської Митрополії УПЦ (ПЦУ) за період від попереднього засідання Архієрейського Собору (14 липня 2025 р.). Засвідчити повну підтримку Предстоятелю, Блаженнійшому Епіфанію, Митрополиту Київському і всієї України, з боку єпископату Православної Церкви України. 2. Підтримати викладені у Доповіді Митрополита Київського і всієї України Епіфанія на Соборі оцінки та пропозиції і взяти їх до уваги у подальшій праці з розбудови Помісної Церкви. 3. Затвердити всі рішення, включаючи судові, ухвалені Священним Синодом УПЦ (ПЦУ) за період від попереднього засідання Архієрейського Собору (14 липня 2025 р.), відображені в синодальних документах. 4. Вкотре засвідчити незмінне бажання і готовність нашої Помісної Церкви вести діалог, мета якого – досягнення єдності українського православ’я навколо Київського престолу на засадах Томосу про автокефалію, для чого створено спеціальну Синодальну комісію. Вкотре наголосити на тому, що юрисдикція МП в Україні є канонічним порушенням і аномалією та спрямувати заклик до духовенства і мирян, які дотепер ще залишаються в юрисдикції Московського патріархату, продовжувати процес єднання з Православною Церквою України, для чого не існує жодних об’єктивних перешкод. Собор вдячний православним громадам і духовенству, які за власним вільним рішення протягом цього року послідували Томосу про автокефалію і увійшли в родину Православної Церкви України, адже це відповідає канонічному порядку, благу Православ’я в Україні та має тверду законну основу. 5. Ухвалити запропонований Священним Синодом проект Послання Собору з нагоди 1038-ї річниці Хрещення України-Руси. Завершуючи свою працю Архієрейський Собор підносить молитви за Помісну Українську Православну Церкву, за перемогу і справедливий мир в Україні та закликає Боже благословення на духовенство і вірних та на весь український народ. Архієрейського Собору Православної Церкви України преосвященним архіпастирям, боголюбивим пастирям, чесному чернецтву та всім православним вірним України з нагоди 1038-ї річниці Хрещення України-Руси. Дорогі брати і сестри! Слава Ісусу Христу! Сьогодні повнота Православної Церкви України знову молитвою і богослужінням урочисто вшановує нашого духовного батька, Хрестителя нашої давньої Київської держави, рівноапостольного князя Володимира. Початки християнства в землях України-Руси сягають апостольського часу, коли святий Андрій Першозванийприйшов з проповіддю Євангелія до Криму, а потім піднявся угору Дніпром. Відтоді серед наших предків не згасав світильник віри. Але саме завдяки зусиллям князя Володимира християнство стало вірою більшості нашого народу, а євангельські заповіді стали дороговказом у розбудові давньої української держави. Саме тому ми сьогодні відзначаємо не лише церковне свято, яке вшановує князя Володимира та звершене за його повелінням Хрещення України-Руси, але також відзначаємо День української державності. Цим самим ми підкреслюємо, що хоча відновлена незалежність України має 35 років, основа і наріжний камінь самої нашої держави – її Хрещення. Тому вона має понад тисячолітню історію та є значно старшою за Московію, яка безпідставно претендує на наш спадок, прагнучипривласнити його. Завдяки Хрещенню Україна-Русь понад тисячоліття тому увійшла до спільноти християнських держав Європи, утвердивши цивілізаційний вибір нашого народу. За цей вибір, який ми разом відстоювали на наших майданах під час революцій недалекого минулого, український народ бореться і зараз. Бо мета Московії, як імперії зла, і цю мету вона не приховує – не допустити нашої справжньої свободи та незалежності. Не допустити, щоби ми остаточно звільнилися від ярма «русского міра» та повернулися в наш європейський дім. Ми маємо бути свідомі того, що ніяка форма земного управління й устрою не може вважатися цілком довершеною. Доки в людях діє гріх, він діє і в людських спільнотах, він виявляється і в житті держав та їхніх об’єднань. Однак і в цих умовах недосконалого світу ми покликані обирати краще, а відкидати гірше, користуючись для цього мірилом плодів. Які плоди несе нам «русскій мір»? Викривлення євангельського вчення, рабське упокорення земній тиранії, позбавлення свободи, викорінення української ідентичності, щоденні руйнування, вбивства і страждання. Європейський Союз має багато проблем, але в ньому можна вільно проповідувати Євангеліє та сповідувати православну християнську віру, не спотворену єретичною доктриною «русского міра». Європа, особливо у порівнянні з Росією та її сателітами, залишається простором свободи, де можна зберігати та захищати свою національну, духовну, культурну ідентичність. Об’єднана Європа разом з її союзниками здатна протистояти ворожим зазіханням і залишатися місцем безпеки. Тому для нас вибір є очевидним – Архієрейський Собор послідовно підтримує обраний нашим народом шлях єдності з європейською демократичною спільнотою. Водночас ми вважаємо своїм обов’язком, разом з іншими релігійними об’єднаннями України та інституціями громадянського суспільства захищати духовний, моральний і культурний спадок нашого народу, традиційні для нього цінності, які визначають його унікальність. Історичний шлях нашого народу свідчить, що ми досягали успіху тоді, коли єднали свої зусилля, долали внутрішні непорозуміння, зберігали суспільний мир. Водночас найгірші сторінки нашого минулого часто були пов’язані з внутрішніми сварками, розпаленням ворожнечі в суспільстві, братовбивчим протистоянням, яким вміло користувалися наші зовнішні супротивники. Вказуючи на цю біду, великий гетьман України Іван Степанович Мазепа у своїй «Думі» писав: «През незгоду всі пропали, самі себе звоювали». Ми маємо виносити добрі уроки з нашої власної історії, одним з яких для нас, як дітей Православної Церкви України, є збереження її єдності, її зростання та розвиток. Адже доля Церкви нерозривно пов’язана з долею України. Бо лише в незалежній, соборній, демократичній Україні, в державі, яка шанує і захищає релігійну свободу, наша Церква має найкращі можливості для свого розвитку. І навпаки – без духовної незалежності від російської імперії зла, без остаточного відкинення лжевчення «русского міра», державність і суверенітет України будуть залишатися під загрозою. Сьогодні головне наше урочисте богослужіння з нагоди свята Хрещення України-Руси ми знову звершуємо у Володимирському <script>
const D=JSON.parse(document.getElementById('data').textContent);
const MN=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MI=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const WD=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const app=document.getElementById('app');
const idx=(m,d)=>D.findIndex(x=>x.m===m&&x.d===d);
let cur=0,view='day',mon=1,q='';
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let fs=+(sg('fs')||18);document.documentElement.style.setProperty('--fs',fs+'px');
function size(n){fs=Math.min(26,Math.max(14,fs+n));document.documentElement.style.setProperty('--fs',fs+'px');ss('fs',fs)}
fm.onclick=()=>size(-1);fp.onclick=()=>size(1);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const wdOf=e=>new Date(2027,e.m-1,e.d).getDay();
const isFeast=e=>/^[А-ЯІЇЄҐ’ʼ'«»\s\-–,]{8,}[.]/.test(e.h);
function title(e){let m=e.h.match(/^([А-ЯІЇЄҐ’ʼ'«»\s\-–,]{8,}\.(?:\s+[А-ЯІЇЄҐ’ʼ'«»\s\-–,]{4,}\.)*)\s*(.*)$/);if(m)return[m[1],m[2]];
m=e.h.match(/^((?:[^.]{0,90}(?:неділя|тиждень|Субота|Навечір’я|Передсвято|Попразднство)[^.]{0,120}\.)(?:\s*Глас \d+-й\.)?)\s*(.*)$/);if(m)return[m[1],m[2]];return['',e.h]}
function dayView(){const e=D[cur],w=wdOf(e),[t,rest]=title(e);
return`<div class="card ${w===0?'sun':''} ${isFeast(e)?'feast':''}"><div class="date"><span class="big">${e.d}</span><span class="dm">${MN[e.m-1]} 2027</span><span class="wd">${WD[w]}</span></div>
${t?`<h2>${esc(t)}</h2>`:''}<p>${esc(rest)}</p>
<div class="lab">Читання</div>${e.r.map(x=>`<div class="r">${esc(x)}</div>`).join('')}
${e.n?`<div class="lab">Уставні примітки</div><p class="note">${esc(e.n)}</p>`:''}</div>
<div class="step"><button id="pv">← Попередній</button><button id="td">Сьогодні</button><button id="nx">Наступний →</button></div>
<input type="date" id="dp" min="2027-01-01" max="2027-12-31" value="2027-${String(e.m).padStart(2,'0')}-${String(e.d).padStart(2,'0')}" aria-label="Обрати дату">
<p class="hint">Дати в уставних замітках — за старим стилем (як у друкованому виданні). Гортайте пальцем вліво/вправо.</p>`}
function monthView(){return`<div class="months">${MI.map((n,i)=>`<button data-m="${i+1}" class="${mon===i+1?'on':''}">${n}</button>`).join('')}</div>`+
D.filter(e=>e.m===mon).map(e=>{const w=wdOf(e),[t,r]=title(e);const s=(t||r).slice(0,150);return`<div class="row ${w===0?'sun':''} ${isFeast(e)?'feast':''}" data-i="${D.indexOf(e)}"><b>${e.d}</b><span>${esc(s)}${s.length>=150?'…':''}</span><small>${WD[w].slice(0,2)}</small></div>`}).join('')}
function searchView(){return`<input type="search" id="q" placeholder="Свято, святий, місце читання…" value="${esc(q)}"><div id="res"></div>`}
function runSearch(){const el=document.getElementById('res');const s=q.trim().toLowerCase();if(s.length<3){el.innerHTML='<p class="hint">Введіть щонайменше 3 літери.</p>';return}
const hit=[];for(let i=0;i<D.length&&hit.length<60;i++){const e=D[i],t=(e.h+' '+e.r.join(' ')+' '+e.n).toLowerCase(),p=t.indexOf(s);if(p>=0)hit.push([i,t,p])}
el.innerHTML=hit.length?hit.map(([i,t,p])=>{const e=D[i],a=Math.max(0,p-40),raw=(e.h+' '+e.r.join(' ')+' '+e.n).slice(a,p+s.length+60);
const hl=esc(raw).replace(new RegExp(esc(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
return`<div class="row" data-i="${i}"><b>${e.d}</b><span>${hl}</span><small>${MN[e.m-1].slice(0,3)}</small></div>`}).join('')+(hit.length>=60?'<p class="hint">Показано перші 60 збігів.</p>':''):'<p class="hint">Нічого не знайдено.</p>'}
function go(i){cur=Math.max(0,Math.min(D.length-1,i));view='day';mon=D[cur].m;render();window.scrollTo(0,0);try{history.replaceState(null,'','#d-'+String(D[cur].m).padStart(2,'0')+'-'+String(D[cur].d).padStart(2,'0'))}catch(e){}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
app.innerHTML=view==='day'?dayView():view==='month'?monthView():searchView();
if(view==='day'){pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);td.onclick=today;dp.onchange=()=>{const[m,d]=dp.value.split('-').slice(1).map(Number);if(m)go(idx(m,d))}}
if(view==='month'){app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mon=+b.dataset.m;render()});app.querySelectorAll('[data-i]').forEach(r=>r.onclick=()=>go(+r.dataset.i))}
if(view==='search'){const inp=document.getElementById('q');inp.oninput=()=>{q=inp.value;runSearch()};runSearch();app.querySelectorAll('#res').forEach(r=>r.onclick=ev=>{const row=ev.target.closest('[data-i]');if(row)go(+row.dataset.i)})}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
function today(){const n=new Date();if(n.getFullYear()===2027)go(idx(n.getMonth()+1,n.getDate()));else{go(0);}}
let x0=null;document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(view!=='day'||x0===null)return;if(e.target.closest&&e.target.closest('input'))return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));x0=null});
const h=(location.hash||'').match(/^#d-(\d\d)-(\d\d)$/);if(h&&idx(+h[1],+h[2])>=0)cur=idx(+h[1],+h[2]);else{const n=new Date();if(n.getFullYear()===2027)cur=Math.max(0,idx(n.getMonth()+1,n.getDate()))}
mon=D[cur].m;render();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
