<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Церковний календар 2027</title>
<meta name="theme-color" content="#6b1f2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2a2220;--mut:#7a6d66;--acc:#6b1f2a;--gold:#b8892f;--red:#b3261e;--line:#e6dccb;--fs:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1615;--card:#262020;--ink:#efe6dc;--mut:#a79a90;--acc:#e0a3ab;--gold:#d9ad5c;--red:#ff8a80;--line:#3a312f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1615;--card:#262020;--ink:#efe6dc;--mut:#a79a90;--acc:#e0a3ab;--gold:#d9ad5c;--red:#ff8a80;--line:#3a312f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:10}
header h1{font-size:1rem;margin:0;flex:1;font-weight:600;line-height:1.2}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;min-width:40px;height:40px;font:inherit;font-size:.95rem;cursor:pointer}
nav{display:flex;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:11px 4px;font:inherit;font-size:.85rem;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--gold);font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px}
.date{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:2.6rem;line-height:1;color:var(--acc);font-weight:700}
.dm{font-size:1.05rem}.wd{color:var(--mut);font-size:.9rem}
.sun .big,.feast .big{color:var(--red)}
h2{font-size:1.2rem;margin:12px 0 6px;color:var(--acc);line-height:1.3}
.lab{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:16px 0 4px;font-family:system-ui,sans-serif;font-weight:700}
p{margin:6px 0}.r{padding:8px 10px;border-left:3px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;margin:6px 0}
.note{color:var(--mut);font-size:.92em}
.step{display:flex;gap:8px;margin:12px 0}.step button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.row{display:flex;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.row b{min-width:2.1em;text-align:right;color:var(--acc)}.row.sun b,.row.feast b{color:var(--red)}
.row span{flex:1;font-size:.92rem;line-height:1.35}.row small{color:var(--mut);font-family:system-ui,sans-serif;font-size:.72rem}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.months button{padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer}
.months button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
input[type=search],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
mark{background:#ffe08a;color:#222;border-radius:3px}.hint{color:var(--mut);font-size:.85rem;margin:8px 2px}
</style>
</head>

Стахія, Амплія, Урвана, Наркиса, Апелія, Аристовула, Родіона (Іродіона), Агава, Руфа, Асинкрита, Флегонта, Єрма, Патрова, Єрмія, Ліна, Гая, Філолога, Лукія, Ясона, Сосипатра, Олімпа (Олімпана), Тертія, Ераста, Куарта, Евода, Онисифора, Климента, Сосфена, Аполоса, Тихика, Епафродита, Карпа, Кодрата, Марка, сина Варнави, Зіни, законника, Аристарха, Пуда, Трофима, Марка, Артеми, Акили, Фортуната, Ахаїка, Діонісія Ареопагіта і Симеона Нігера. Прп. Феоктиста, ігум. Кукума Сикелійського (800). Свт. Євстафія І, архієп. Сербського (бл. 1285). Прп. Ахіли, дияк., Києво-Печерського, в Дальніх печерах (ХІV). Прмч. Зосими і мч. Афанасія (ІІІ – ІV).","r":["2 Кор., 171 зач., II, 3 – 15. Мф., 94 зач., XXIII, 13 – 22.","Апп.: Рим., 96 зач. (від половини), VIII, 3 – 9. Лк., 50 зач., X, 1 – 15."],"n":""},{"m":1,"d":5,"h":"Навечір’я Богоявлення (Хрещенський святвечір). Сщмч. Феопемпта, єп. Нікомидійського, і мч. Феони, волхва (303). Прп. Синклітикії Олександрійської (бл. 350). Прор. Михея (ІХ ст. до Р. Х.). Прп. Аполінарії (бл. 470). Прпп. Фостирія та Мини (VІ). Прп. Григорія Акритського (бл. 820). Літургія за чином свт. Василія Великого.","r":["На 1-му часі – Діян., 33 зач., ХІІІ, 25 – 32. Мф., 5 зач., ІІІ, 1 – 11.","На 3-му часі – Діян., 42 зач., ХІХ, 1 – 8. Мк., 1 зач., І, 1 – 8.","На 6-му часі – Рим., 91 зач., VI, 3 – 11. Мк., 2 зач., І, 9 – 15.","На 9-му часі – Тит., 302 зач., ІІ, 11 – 14; ІІІ, 4 – 7. Мф., 6 зач., ІІІ, 13 – 17.","Літ. – 1 Кор., 143 зач., IX, 19 – 27. Лк., 9 зач., III, 1 – 18.","Під час освячення води – 1 Кор., 143 зач. (від пол.), Х, 1 – 4. Мк., 2 зач., І, 9 – 11."],"n":"Пісний день. 1-ий час до ранньої не приєднується, але відправляються окремо часи навечір’я та зображальні, «Блаженні...» читаються. Літургія за чином свт. Василія Великого починається з вечірні. Після входу з Євангелієм – прокимен дня, читання 13-ох паремій зі співанням заспівів після 3-ої та 6-ої: «Людинолюбче, слава Тобі» та «Тільки на сидячих у пітьмі, слава Тобі». Після прочитання паремій – мала ектенія, виголос «Бо Ти святий, Боже наш...», Трисвяте і далі Літургія. Замість «Достойно є…» – «Тобою радіє, Благодатна...». Після заамвонної молитви – тропарі «Голос Господній...» і велике освячення води. «Нехай буде ім’я Господнє...» (тричі), 33-й псалом і відпуст свята Богоявлення. Після відпусту Літургії чин славлення, клірики перед іконою і свічником з запаленою свічкою співають тропар і кондак свята Богоявлення."},{"m":1,"d":6,"h":"СВЯТЕ БОГОЯВЛЕННЯ. ХРЕЩЕННЯ ГОСПОДА БОГА І СПАСИТЕЛЯ НАШОГО ІСУСА ХРИСТА. Літургія за чином свт. Іоана Золотоустого.","r":["Ран. – Мк., 2 зач., I, 9 – 11.","Літ. – Тит., 302 зач., II, 11 – 14; III, 4 – 7. Мф., 6 зач., III, 13 – 17.","Під час освячення води – 1 Кор., 143 зач. (від пол.), Х, 1 – 4. Мк., 2 зач., І, 9 – 11."],"n":"Всенічна складається з великого повечір’я, літії та ранньої, і починається з виголосу: «Слава Святій, Єдиносущній, Животворчій і Нероздільній Тройці завжди, нині і повсякчас, і на віки віків». На ранній величання: «Величаємо Тебе, Життєдавче Христе, що заради нас нині тілом хрестився від Іоана у водах Йорданських». На Літургії – антифони свята, вхідний стих: «Благословенний, хто йде в ім’я Господнє, благословляємо вас із дому Господнього, Бог Господь і явився нам». На архієрейській службі в день свята і на щоденних службах до віддання (включно) на вході співається «Прийдіть, поклонімось… спаси нас, Сину Божий, що в Йордані хрестився…». У день свята замість Трисвятого – «Всі ви, що в Христа хрестилися...». Задостойник «Величай, душе моя...», «Не в змозі ніяка людина...». Після заамвонної молитви – велике освячення води. Вкінці великого освячення води співаємо: «Нехай буде ім’я Господнє...» (тричі), 33-й псалом і відпуст. Увечері цього дня звершується велика вечірня з входом і великим прокимном: «Бог наш на небесах і на землі, все, що захотів, створив»."},{"m":1,"d":7,"h":"Собор Предтечі і Хрестителя Господнього Іоана.","r":["2 Кор., 175 зач., IV, 1 – 6. Мф., 99 зач., XXIV, 13 – 28.","Предтечі: Діян., 42 зач., XIX, 1 – 8. Ін., 3 зач., I, 29 – 34."],"n":""},{"m":1,"d":8,"h":"Прпп. Георгія Хозевіта (VІІ) та Еміліана, спов. (ІХ). Прп. Домніки (бл. 474). Прп. Григорія, чудотворця Києво-Печерського, в Ближніх печерах (1093). Прп. Григорія, затворника Києво-Печерського, в Дальніх печерах (ХІІІ – ХІV). Сщмч. Картерія, пресвітера Кесарії Каппадокійської (304). Сщмч. Феофіла, диякона, та мч. Елладія (ІV). Мчч. Юліана, Келсія, Антонія, Анастасія, мцц. Василіси і Маріоніли, сімох отроків та 20-ох воїнів (313). Прп. Іллі Єгипетського (ІV). Мч. Або Тбіліського (бл. 790, Груз.).","r":["2 Кор., 177 зач., IV, 13 – 18. Мф., 100 зач., XXIV, 27 – 33, 42 – 51."],"n":""},{"m":1,"d":9,"h":"Субота після Богоявлення. Мч. Полієвкта (259). Прор. Самея (Х ст. до Р. Х.). Свт. Петра, єп. Севастії Вірменської (ІV). Прп. Євстратія, чудотворця (ІХ). Прп. Іони Київського (1902). Суботи після Богоявлення:","r":["Еф., 233 зач., VI, 10 – 17. Мф., 7 зач., IV, 1 – 11."],"n":"Прокимен, алилуарій і причасний – свята; Апостол і Євангеліє – суботи після Богоявлення."},{"m":1,"d":10,"h":"32-га неділя після П’ятдесятниці, після Богоявлення. Глас 7-й. Свт. Григорія, єп. Ниського (395). Прп. Дометіана, єп. Мелітинського (601). Прп. Маркіана, пресвітера (V). Прп. Макарія. Св. Феозви, диякониси, сестри свт. Григорія Ниського (385).","r":["Ран. – Єв. 10-е, Ін., 66 зач., XXI, 1 – 14.","Літ. – неділі після Богоявлення: Еф., 224 зач. (від половини), IV, 7 – 13. Мф., 8 зач., IV, 12 – 17.","Свт.: 1 Кор., 151 зач., XII, 7 – 11. Мф., 34 зач. (від пол.), X, 1 – 8."],"n":""},{"m":1,"d":11,"h":"33-й тиждень після П’ятдесятниці (рядові читання 12-го тижня через Хрещенську відступку). Прп. Феодосія Великого, засновника спільнотного життя (529). Прп. Феодосія Антіохійського (бл. 412). Єлецької ікони Божої Матері (1060).","r":["Ран. – Мф., 43 зач., XI, 27 – 30.","Літ. – 2 Кор., 179 зач., V, 10 – 15. Мк., 2 зач., I, 9 – 15.","Прп.: 2 Кор., 176 зач., IV, 6 – 15. Мф., 43 зач., XI, 27 – 30."],"n":"На ранній величання: «Ублажаємо тебе, преподобний отче Феодосію, і шануємо святу пам’ять твою, наставнику монахів і співрозмовнику ангелів»."},{"m":1,"d":12,"h":"Мц. Тетяни і тих з нею, які в Римі були замучені (226 – 235). Мч. Мертія (284 – 305). Мч. Петра Авесаломіта (309 – 310). Прп. Євпраксії, діви Тавенської (393). Свт. Сави, архієп. Сербського (1237). Ікон Божої Матері, званих «Акафістна» та «Молокоживителька».","r":["2 Кор., 180 зач., V, 15 – 21. Мк., 3 зач., I, 16 – 22."],"n":""},{"m":1,"d":13,"h":"Свт. Іларія Піктавійського (367). Мчч. Єрмила та Стратоніка (бл. 315). Мч. Петра Анійського (309 – 310). Прп. Якова, єп. Низибійського (350).","r":["2 Кор., 182 зач., VI, 11 – 16. Мк., 4 зач., I, 23 – 28."],"n":""},{"m":1,"d":14,"h":"Віддання свята Богоявлення. Прпп. отців, які в Синаї й Раїфі були вбиті: Ісаї, Сави, Мойсея і учня його Мойсея, Єремії, Павла, Адама, Сергія, Домна, Прокла, Іпатія, Ісаака, Макарія, Марка, Веніаміна, Євсевія, Іллі та інших із ними (ІV – V). Рівноап. Ніни, просвітительки Грузії (335). Прп. Йосифа Аналітина Раїфського (ІV). Прп. Феодула (V). Прп. Стефана (VІІІ).","r":["Ран. – Мф., 34 зач. (від половини), X, 1 – 8.","Літ. – 2 Кор., 183 зач., VII, 1 – 10. Мк., 5 зач., I, 29 – 35.","Рівноап.: 1 Кор., 131 зач., IV, 9 – 16. Мф., 104 зач., XXV, 1 – 13."],"n":"На ранній замість «Чеснішу..» співаємо приспіви свята. Служба преподобним отцям, які в Синаї й Раїфі були вбиті, переноситься на 13 січня."},{"m":1,"d":15,"h":"Прп. Павла Фівейського (341) та Іоана Кущника (V). Прмч. Пансофія (249 – 251). Прпп. Прохора (Х) і Гавриїла (ХІ, Серб.).","r":["2 Кор., 184 зач., VII, 10 – 16. Мк., 9 зач., II, 18 – 22.","Прпп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":"З цього дня до передсвята Стрітення Господнього співається Октоїх. З цього дня і до Стрітення на святковій ранній катавасія «Сушу в глибині землі…»."},{"m":1,"d":16,"h":"Поклоніння оковам ап. Петра. Мчч. Спевсипа, Єлевсипа, Малевсипа і бабці їхньої Леоніли, і з ними Неона, Турвона та Іовили (161 – 180). Мч. Данакта, читця (ІІ).","r":["Ап.: Діян., 29 зач., XII, 1 – 11. Ін., 67 зач., XXI, 15 – 25.","Ряд.: 1 Кор., 125 зач. (від половини), I, 26 – 29. Мф., 82 зач., XX, 29 – 34."],"n":""},{"m":1,"d":17,"h":"33-тя неділя після П’ятдесятниці. Глас 8-й. Прп. Антонія Великого (356).","r":["Ран. – Єв. 11-е, Ін., 67 зач., XXI, 15 – 25.","Літ. – 1 Кор., 158 зач., XV, 1 – 11. Мф., 79 зач., XIX, 16 – 26 (неділі 12-ої).","Прп.: Євр., 335 зач., XIII, 17 – 21. Лк., 24 зач., VI, 17 – 23."],"n":""},{"m":1,"d":18,"h":"34-й тиждень після П’ятдесятниці (рядові читання 13-го тижня через Хрещенську відступку). Свтт. Афанасія (373) та Кирила (444), архієпп. Олександрійських. Прп. Маркіана Кирського (бл. 388).","r":["2 Кор., 186 зач., VIII, 7 – 15. Мк., 11 зач., III, 6 – 12.","Свтт.: Євр., 334 зач., XIII, 7 – 16. Мф., 11 зач., V, 14 – 19."],"n":""},{"m":1,"d":19,"h":"Прп. Макарія Великого, Єгипетського (390 – 391). Свт. Марка, архієп. Ефеського (1457). Прп. Макарія, посника Києво-Печерського, в Ближніх печерах (ХІІ). Прп. Макарія, диякона Києво-Печерського, в Дальніх печерах (ХІV). Мц. Євфрасії, діви (303). Прп. Макарія Олександрійського (394 – 395). Свт. Арсенія, архієп. Керкирського (VІІІ). Прп. Антонія, стовпника, Марткобського (VІ, Груз.). Прп. Лаврентія Чернігівського (1950).","r":["Ран. – Лк., 24 зач., VI, 17 – 23.","Літ. – 2 Кор., 187 зач., VIII, 16 – IX, 5. Мк., 12 зач., III, 13 – 19.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":""},{"m":1,"d":20,"h":"Прп. Євфимія Великого (473). Мчч. Інни, Пінни і Римми (І – ІІ). Прпп. Євфимія схимника (ХІV) і Лаврентія затворника (ХІІІ – ХІV), Києво-Печерських, в Дальніх печерах. Мчч. Васса, Євсевія, Євтихія і Василіда (303).","r":["2 Кор., 189 зач., IX, 12 – X, 7. Мк., 13 зач., III, 20 – 27.","Прп.: Євр., 335 зач., XIII, 17 – 21. Лк., 24 зач., VI, 17 – 23."],"n":""},{"m":1,"d":21,"h":"Прп. Максима Сповідника (662). Мч. Неофіта (304). Мчч. Євгенія, Кандида, Валеріана й Акили (ІІІ). Прп. Максима Грека (1556). Мц. Агнії, діви (бл. 304). Мч. Анастасія (662). Ктиторської (ІV) та названої «Відрада» або «Втіха» (807), Ватопедських ікон Божої Матері.","r":["2 Кор., 190 зач., X, 7 – 18. Мк., 14 зач., III, 28 – 35.","Прп.: Євр., 330 зач., XI, 33 – XII, 2. Лк., 64 зач., XIІ, 8 – 12."],"n":""},{"m":1,"d":22,"h":"Ап. Тимофія (бл. 96). Прмч. Анастасія Перського (628). Прмч. Анастасія, дияк. Києво-Печерського, в Ближніх печерах (ХІІ). Сщмчч. Мануїла, Георгія, Петра, Леонтія, єпископів, Сионія, Гавриїла, Іоана, Леонта, Парода, пресвітерів, та інших 377 мучеників (бл. 817).","r":["2 Кор., 192 зач., XI, 5 – 21. Мк., 15 зач., IV, 1 – 9.","Ап.: 2 Тим., 290 зач. (від половини), I, 3 – 9. Лк., 50 зач., X, 1 – 15."],"n":""},{"m":1,"d":23,"h":"Сщмч. Климента, єп. Анкирського, і мч. Агафангела (312). Прп. Мавсими Сирійця (ІV). Прп. Самана, мовчальника (бл. 400). Свт. Павліна Милостивого, єп. Ноланського (431). Пам’ять VІ Вселенського собору (680 – 681).","r":["1 Кор., 126 зач., II, 6 – 9. Мф., 90 зач., XXII, 15 – 22."],"n":""},{"m":1,"d":24,"h":"34-та неділя після П’ятдесятниці. Глас 1-й. Прп. Ксенії Римлянки, дияконіси (V). Мчч. Вавили Сицилійського та учнів його Тимо-фія й Агапія (ІІІ). Прп. Македонія, сирійського пустельника (бл. 420).","r":["Ран. – Єв. 1-е, Мф., 116 зач., XXVIII, 16 – 20.","Літ. – 1 Кор., 166 зач., XVI, 13 – 24."],"n":"Мф., 87 зач., XXI, 33 – 42 (неділі 13-ої)."},{"m":1,"d":25,"h":"35-й тиждень після П’ятдесятниці (рядові читання 14-го тижня через Хрещенську відступку). Свт. Григорія Богослова, архієп. Константинопольського (389). Мц. Філіцати та синів її мчч. Януарія, Фелікса, Филипа, Сильвана, Олександра, Віталія і Марціала (164). Прп. Поплія Сирійського (380). Прп. Мара, співця (бл. 430). Ікони Божої Матері, званої «Утамуй мої печалі».","r":["Ран. – Ін., 35 зач. (від половини), X, 1 – 9.","Літ. – 2 Кор., 195 зач., XII, 10 – 19. Мк., 16 зач., IV, 10 – 23.","Свт.: 1 Кор., 151 зач., XII, 7 – 11. Ін., 36 зач., X, 9 – 16."],"n":"На ранній величання святителю: «Величаємо тебе, святителю отче Григорію, і шануємо святу пам’ять твою, бо ти молиш за нас Христа Бога нашого»."},{"m":1,"d":26,"h":"Прпп. Ксенофонта, дружини його Марії та синів їхніх Аркадія та Іоана (V – VІ). Мчч. Ананії, пресвітера, Петра, сторожа в’язниці, а з ними сімох воїнів (295). Прп. Симеона Древнього, пустельника (бл. 390). Перенесення мощів прп. Федора, ігумена Студійського (845). Свт. Йосифа, архієп. Солунського (830). Блгв. Давида ІІІ Відновителя, царя Іверії та Абхазії (1125, Груз.).","r":["2 Кор., 196 зач., XII, 20 – XIII, 2. Мк., 17 зач., IV, 24 – 34."],"n":""},{"m":1,"d":27,"h":"Перенесення мощів свт. Іоана Золотоустого (438).","r":["Ран. – Ін., 35 зач. (від половини), X, 1 – 9.","Літ. – 2 Кор., 197 зач., XIII, 3 – 13. Мк., 18 зач., IV, 35 – 41.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16."],"n":"На ранній величання святителю: «Величаємо тебе, святителю отче Іоане Золотоустий, і шануємо святу пам’ять твою, бо ти молиш за нас Христа Бога нашого»."},{"m":1,"d":28,"h":"Прп. Єфрема Сиріна (373 – 379). Прп. Єфрема Києво-Печерського, єп. Переяславського (бл. 1098). Прп. Палладія, пустельника (ІV). Прп. Ісаака Сиріна, єп. Ніневійського (VІ). Прп. Єфрема Угрина, Новоторзького (1053). Свтт. єпп. Переяславських: Єфрема (бл. 1098), Миколая (1074), Петра (1082), Лазаря (1117), Сильвестра (1123), Євфимія (1155), Симеона (1239).","r":["Гал., 198 зач., I, 1 – 10, 20 – II, 5. Мк., 19 зач., V, 1 – 20."],"n":""},{"m":1,"d":29,"h":"Перенесення мощів сщмч. Ігнатія Богоносця (107). Свт. Лаврентія, затворника Києво-Печерського, єп. Турівського, в Ближніх печерах (1194). Мчч. Романа, Якова, Філофея, Іперихія, Авіва, Юліана і Паригорія (297). Сщмчч. Сильвана, єп., Луки, дияк., мч. Мокія, читця (312).","r":["Гал., 201 зач., II, 6 – 10. Мк., 20 зач., V, 22 – 24, 35 – VI, 1.","Сщмч.: Євр., 311 зач. (з половини), IV, 14 – V, 6. Мк., 41 зач., IX, 33 – 41."],"n":""},{"m":1,"d":30,"h":"Собор вселенських учителів і святителів Василія Великого, Григорія Богослова та Іоана Золотоустого. Сщмч. Іполита, єп. Римського та з ним мчч. Кенсорина, Савина, Фрисії, діви та інших 20 мчч. (ІІІ). Прп. Зинона, посника Києво-Печерського, в Дальніх печерах (ХІV). Прп. Зинона, учня свт. Василія Великого (V). Мч. Феофіла Нового (784). Блгв. Петра, царя Болгарського (967).","r":["Ран. – Ін., 36 зач., X, 9 – 16.","Літ. – Свтт.: Євр., 334 зач., XIII, 7 – 16. Мф., 11 зач., V, 14 – 19."],"n":"На ранній величання: «Величаємо вас, святителі Христові: Василію Великий, Григорію Богослове та Іоане Золотоустий, і шануємо святу пам’ять вашу, бо ви молите за нас Христа Бога нашого». Замість «Чеснішу..» співаємо приспіви свята."},{"m":1,"d":31,"h":"35-та неділя після П’ятдесятниці. Глас 2-й. Безсрр., мчч. Кира та Іоана і з ними мцц. Афанасії та дочок її Феодотії, Феоктисти і Євдоксії (311). Свт. Микити, затворника Києво-Печерського, єп. Новгородського (1108). Мчч. Вікторина, Віктора, Никифора, Клавдія, Діодора, Серапіона і Папія (251). Мц. Трифени Кизицької.","r":["Ран. – Єв. 2-е, Мк., 70 зач., XVI, 1 – 8.","Літ. – 2 Кор., 170 зач., I, 21 – II, 4. Лк., 26 зач., VI, 31 – 36.","Безсрібн.: 1 Кор., 153 зач., XII, 27 – XIII, 8. Мф., 34 зач. (від половини), X, 1, 5 – 8."],"n":""},{"m":2,"d":1,"h":"36-й тиждень після П’ятдесятниці (рядові читання 15-го тижня через Хрещенську відступку). Передсвято Стрітення Господнього. Мч. Трифона (250). Мцц. Перпетуї і Феліцитати, мчч. Сатира, Ревоката, Саторнила, Секунда (202 – 203). Прп. Петра Галатійського (429). Прп. Вендиміана, пустельника Вифинійського (бл. 512).","r":["Гал., 202 зач., II, 11 – 16. Мк., 21 зач., V, 24 – 34."],"n":""},{"m":2,"d":2,"h":"СТРІТЕННЯ ГОСПОДА НАШОГО ІСУСА ХРИСТА.","r":["Ран. – Лк., 8 зач., II, 25 – 32.","Літ. – Євр., 316 зач., VII, 7 – 17. Лк., 7 зач., II, 22 – 40."],"n":"На ранній величання: «Величаємо Тебе, Життєдавче Христе, і шануємо Пречисту Матір Твою, Нею ж за законом нині принесений був до храму Господнього». Замість «Чеснішу...» – приспіви свята. 1-й приспів: «Богородице Діво, уповання християн, покрий, збережи і спаси тих, хто на Тебе уповає». На Літургії антифони святкові (у додатку с. 88), на вході вхідний стих: «Явив Господь спасіння Своє, перед народами відкрив правду Свою». З цього дня і до віддання на Літургії (крім воскресних днів) після входу співається: «Прийдіть, поклонімось... Спаси нас, Сину Божий, молитвами Богородиці…». Задостойник – «Богородице Діво… У Законі тіні…» (до віддання). Відпуст свята: «Христос, що на руках праведного Симеона спочивати зволив заради нашого спасіння, істинний Бог наш…» (до віддання в седмичні дні, а в неділю – воскресний)."},{"m":2,"d":3,"h":"Післясвято Стрітення Господнього. Правв. Симеона Богоприїмця і Анни, пророчиці (І). Прор. Азарії (Х ст. до Р. Х.). Мчч. Папія, Діодора, Клавдіана (250). Мчч. Адріана і Єввула (308 – 309). Мч. Власія Кесарійського (ІІІ). Свт. Ігнатія Маріупольського, митр. Готфейського і Кефайського (1786). Рівноап. Миколая, архієп. Японського (1912). Знайдення мощів свт. Рафаїла (Заборовського), митр. Київського, Галицького і всієї Руси (2024).","r":["Гал., 207 зач., III, 15 – 22. Мк., 23 зач., VI, 7 – 13.","Прав.: Євр., 321 зач. (від половини), IX, 11 – 14. Лк., 8 зач., II, 25 – 38."],"n":"День інтронізації Блаженнійшого Митрополита Київського і всієї України Епіфанія."},{"m":2,"d":4,"h":"Прп. Ісидора Пелусіота (бл. 436 – 440). Мч. Іадора (ІІІ). Сщмч. Авраамія, єп. Арвільського (бл. 344 – 347). Прп. Миколая, спов., ігумена Студійського (868).","r":["Гал., 208 зач., III, 23 – IV, 5. Мк., 25 зач., VI, 30 – 45."],"n":""},{"m":2,"d":5,"h":"Мц. Агафії (251). Свт. Феодосія, архієп. Чернігівського (1696). Мц. Феодули і мчч. Елладія, Макарія і Євагрія (бл. 304). Єлецько-Чернігівської (1060), Сицилійської, або Дивногорської (1092), і званої «Віднайдення загиблих» ікон Божої Матері.","r":["Гал., 210 зач., IV, 8 – 21. Мк., 26 зач., VI, 45 – 53.","Свт.: Євр., 335 зач., XIII, 17 – 21. Ін., 36 зач., X, 9 – 16."],"n":""},{"m":2,"d":6,"h":"Прп. Вукола, єп. Смирнського (бл. 100). Прп. Варсонофія Великого та Іоана, пророка (VІ).  фарисея. Глас 5-й. Прп. Тимофія, що в Символах (795). Свт. Євстафія, архієп. Антіохійського (337). Свт. Георгія, єп. Амастридського (802 – 811). Козельщанської ікони Божої Матері (1881).","r":["Ран. – Ран. – Єв. 5-е, Лк., 113 зач., XXIV, 12 – 35.","Літ. – 2 Тим., 296 зач., III, 10–15. Лк., 89 зач., XVIII, 10–14."],"n":"Початок Постової тріоді. На ранній після 50-го псалма (до 5-ої неділі включно) – «Покаяння відкрий мені двері, Життєдавче...». У недільні дні (до Вербної неділі) служба здійснюється за Октоїхом і Тріоддю, а Мінея опускається (за винятком пам’яті святих, яким звершується бдіння або полієлей)."},{"m":2,"d":22,"h":"Тиждень загальний.Сщмч. Папія, єп. Ієрапольського (ІІ). Мчч. Маврикія і 70-ох воїнів: Фотина, Федора, Филипа та інших (бл. 305). Знайдення мощів мучеників, що в Євгенії (395 – 423). Прпп. Фаласія, Лимнія і Варадата, пустельників сирійських (V). Прп. Афанасія, спов. (821).","r":["2 Пет., 66 зач., I, 20 – II, 9. Мк., 59 зач., XIII, 9–13."],"n":"Протягом цього тижня посту в середу і п’ятницю немає."},{"m":2,"d":23,"h":"Сщмч. Полікарпа, єп. Смирнського (167). Прав. Горгонії, сестри свт. Григорія Богослова (372). Прпп. Іоана, Антіоха, Антоніна, Мойсея, Зевина, Поліхронія, іншого Мойсея і Даміана, пустельників сирійських (V). Прп. Олександра, засновника обителі «Невсипущих» (бл. 430).","r":["2 Пет., 67 зач., II, 9–22. Мк., 60 зач., XIII, 14–23."],"n":""},{"m":2,"d":24,"h":"Перше (ІV) і друге (452) знайдення голови Іоана Предтечі. Прп. Еразма Києво-Печерського, в Ближніх печерах (бл. 1160).","r":["Ран. – Лк., 31 зач., VII, 17 – 30.","Літ. – 1 Ін., 69 зач., I, 8 – II, 6. Мк., 62 зач., XIII, 31 – XIV, 2.","Предтечі: 2 Кор., 176 зач., IV, 6 – 15. Мф., 40 зач., XI, 2 – 15."],"n":"На ранній величання: «Величаємо тебе, Хрестителю Спасів Іоане, і шануємо всі чесної твоєї глави знайдення». Національний день молитви (встановлений Верховною Радою України)."},{"m":2,"d":25,"h":"Свт. Тарасія, архієп. Константинопольського (806).","r":["1 Ін., 69 зач., I, 8 – II, 6. Мк., 62 зач., XIII, 31 – XIV, 2."],"n":""},{"m":2,"d":26,"h":"Свт. Порфирія, архієп. Газького (420). Мч. Севастіана (бл. 66).","r":["1 Ін., 70 зач., II, 7–17. Мк., 63 зач., XIV, 3–9."],"n":""},{"m":2,"d":27,"h":"Прп. Прокопія Декаполіта, спов. (бл. 750). Прп. Тита, пресвітера Києво-Печерського, в Ближніх печерах (1190). Прп. Тита Києво-Печерського, колишнього воїна, що в Дальніх печерах (ХІV). Прп. Фалалея Сирійського (бл. 460). Прп. Єфрема Катунакського (1998).","r":["2 Тим., 295 зач., III, 1–9. Лк., 103 зач., XX, 45 – XXI, 4."],"n":""},{"m":2,"d":28,"h":"Неділя про блудного сина. Глас 6-й. Свт. Арсенія (Мацієвича), митр. Ростовського (1772). Прп. Василія, спов. (750). Сщмч. Протерія, патр. Олександрійського (457). Сщмч. Нестора, єп. Магідійського (250). Прпп. Марини і Кіри (бл. 450). Прп. Касіяна Римлянина (435) (пам'ять переноситься з 29 лютого). Прп. Касіяна, затворника Києво-Печерського, у Дальніх печерах (XIII – ХІV) (пам'ять переноситься з 29 лютого). Прп. Іоана, названого Варсонофієм, єп. Дамаського (V); прп. Феоктириста, спов., ігум. Пелікітського (VІІІ) (пам'ять переноситься з 29 лютого). Свт. Мелетія, архієп. Харківського (1840) (пам'ять переноситься з 29 лютого).","r":["Ран. – Єв. 6-е, Лк., 114 зач., XXIV, 36 – 53.","Літ. – 1 Кор., 135 зач., VI, 12 – 20. Лк., 79 зач., XV, 11 – 32.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16."],"n":"На ранній до звичайних двох полієлейних псалмів приєднуємо псалом 136-й: «На ріках Вавилонських...». Цей же псалом співається і в дві наступні неділі."},{"m":3,"d":1,"h":"Прмц. Євдокії (бл. 160 – 170). Мчч. Нестора і Тривімія (ІІІ). Мц. Антоніни (ІІІ – ІV). Мчч. Маркела і Антонія. Прп. Домніни Сирійської (бл. 450 – 460).","r":["1 Ін., 71 зач., II, 18 – III, 10. Мк., 49 зач., XI, 1 – 11."],"n":""},{"m":3,"d":2,"h":"Сщмч. Феодота, єп. Киринейського (бл. 326). Свт. Іова (Борецького), митр. Київського і всієї Руси (1631). Мц. Євфалії (257). Мч. Троадія (ІІІ). Прп. Агафона Єгипетського (V). Мчч. 440 італійських (579). Свт. Арсенія, єп. Тверського (1409).","r":["Ран. – Ін., 35 зач. (від половини), X, 1 – 9.","Літ. – 1 Ін., 72 зач., III, 10 – 20. Мк., 64 зач., XIV, 10 – 42.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16."],"n":"На ранній величання святителю: «Величаємо тебе, святителю отче Іове, і шануємо святу пам’ять твою, бо ти молиш за нас Христа Бога нашого»."},{"m":3,"d":3,"h":"Мчч. Євтропія, Клеоника і Василіска (бл. 308). Прп. Піами, діви (337). Свв. Зинона і Зоїла.","r":["1 Ін., 73 зач., III, 21 – IV, 6. Мк., 65 зач., XIV, 43 – XV, 1."],"n":""},{"m":3,"d":4,"h":"Прп. Герасима, який на Йордані (475). Мч. Павла і мц. Юліанії (бл. 273). Прп. Якова, посника (VІ). Перенесення мощів блгв. кн. В’ячеслава Чеського (938). Прп. Герасима Київського, ігум. Вологодського (1178). Свт. Григорія, єп. Констанції Кіпрської. Прмч. Іоасафа Снітногорського (1299).","r":["1 Ін., 74 зач., IV, 20 – V, 21. Мк., 66 зач., XV, 1 – 15."],"n":""},{"m":3,"d":5,"h":"Мч. Конона Ісаврійського (І). Мч. Онисія (І). Мч. Конона, градаря (землероба) (ІІІ). Прп. Марка (V). Прп. Ісихія (бл. 790). Мц. Іраїди. Мч. Євлогія, що в Палестині. Мч. Євлампія.","r":["2 Ін., 75 зач., I, 1 – 13. Мк., 68 зач., XV, 22, 25, 33 – 41."],"n":""},{"m":3,"d":6,"h":"Субота м’ясопусна. Пам’ять усіх від віку спочилих православних християн – отців, братів і сестер наших. Мчч. 42 в Амморії: Костянтина, Аетія, Феофіла, Федора, Мелісена, Каліста, Васоя та інших з ними (бл. 845). Знайдення чесного Хреста і цвяхів св. царицею Оленою в Єрусалимі (326). Прмч. Конона і сина його Конона (270 – 275). Прп. Аркадія Кіпрського (бл. 361). Ікон Божої Матері Ченстоховської, Шестоківської і «Благодатне небо». Поминання померлих. Заупокійне:","r":["1 Сол., 270 зач., IV, 13 – 17. Ін., 16 зач., V, 24 – 30.","Ряд.: 1 Кор., 146 зач., X, 23 – 28. Лк., 105 зач., XXI, 8 – 9, 25 – 27, 33 – 36."],"n":"Служба з Октоїха та Тріоді. На вечірні замість прокимна – «Алилуя» із заупокійними стихами. Після «Нині відпускаєш…» – тропар «Глибиною мудрості…» з Богородичним. На ранній замість «Бог Господь…» – «Алилуя» із заупокійними стихами. 17-та кафизма читається з поділом на дві статті та заупокійними приспівами."},{"m":3,"d":7,"h":"Неділя м’ясопусна, про Страшний суд. Глас 7-й. Священномучеників, які в Херсонесі були єпископами: Василія (309), Єфрема (бл. 315), Євгенія (311), Елпідія (311), Агафодора (311), Єферія (324) та Капітона (після 325). Прп. Павла Препростого (ІV). Свт. Павла, спов., єп. Прусіадського (ІХ). Прп. Еміліана Італійського. Ікони Божої Матері «Споручниця грішних».","r":["Ран. – Єв. 7-е, Ін., 63 зач., XX, 1 – 10.","Літ. – 1 Кор., 140 зач., VIII, 8 – IX, 2. Мф., 106 зач., XXV, 31 – 46."],"n":"Від Неділі м’ясопусної до суботи Лазаревої вечірні та ранкові стихири на стиховні Октоїха заміняються стихирами Тріоді. Заговини на м’ясо."},{"m":3,"d":8,"h":"Тиждень сирний (масляний) – загальниця. Прп. Феофілакта, спов., єп. Нікомидійського (842 – 845). Ап. Єрма (І). Сщмч. Феодорита, пресвітера Антіохійського (361 – 363). Прп. Дометія (363).","r":["3 Ін., 76 зач., I, 1 – 15. Лк., 96 зач., XIX, 29 – 40; XXII, 7 – 39."],"n":"Впродовж усього тижня дозволяється вживання молока та яєць."},{"m":3,"d":9,"h":"40 мчч., які в Севастійському озері мучилися: Киріона, Кандида, Домна, Ісихія, Іраклія, Смарагда, Євноїка, Валента, Вивіана, Клавдія, Пріска, Феодула, Євтихія, Іоана, Ксанфія, Іліана, Сисинія, Ангія, Аетія, Флавія, Акакія, Екдикія (Екдита), Лісимаха, Олександра, Ілія, Горгонія, Феофіла, Дометіана, Гая, Леонтія, Афанасія, Кирила, Сакердона, Миколая, Валерія, Філоктимона, Северіана, Худіона, Мелітона і Аглаїя (бл. 320). Мч. Урпасіана (бл. 295). Св. Кесарія, брата свт. Григорія Богослова (бл. 369). Прав. Тарасія Лікаонійського.","r":["Ран. – Лк., 106 зач., XXI, 12 – 19.","Літ. – Іуд., 77 зач., I, 1 – 10. Лк., 109 зач., XXII, 39 – 42, 45 – XXIII, 1.","Мчч.: Євр., 331 зач., XII, 1 – 10. Мф., 80 зач., XX, 1 – 16."],"n":"На ранній величання: «Величаємо вас, святі мученики Севастійські, і шануємо чесні страждання ваші, які за Христа перетерпіли ви»."},{"m":3,"d":10,"h":"Мчч. Кодрата та з ним Кипріана, Діонісія, Анекта, Павла, Крискента, Діонісія (іншого), Вікторина, Віктора, Никифора, Клавдія, Діодора, Серафіона, Папія, Леоніда і мцц. Харієси, Нунехії, Василіси, Ніки, Галі, Галини, Феодори та інших багатьох (бл. 258). Мчч. Кодрата Нікомидійського, Саторина, Руфина та інших (ІІІ). Прп. Анастасії (567 – 568). Літургія не звершується.","r":["На 6-му часі: Іоїл. II, 12 – 26.","На веч.: Іоїл. III, 12 – 21."],"n":"Починаючи з вечірні, служби відправляються подібно до великопостових. Великопостові тропарі на часах та «Блаженні…» на зображальних читаються. Наприкінці вечірні, великого повечір’я, полуношниці, ранньої, кожного часу, зображальних – молитва прп. Єфрема Сиріна з поклонами."},{"m":3,"d":11,"h":"Свт. Софронія, патр. Єрусалимського (639). Прп. Іоана Мосха (622). Прп. Софронія, затворника Києво-Печерського, в Дальніх печерах (ХІІІ). Сщмч. Піонія, пресвітера Смирнського, та інших з ним (250). Перенесення мощів мч. Епимаха. Свт. Софронія, єп. Врачанського (1813, Болг.). Прп. Шіо Мгвимського (VІ, Груз.) (перехідне святкування у четвер сиропусного тижня).","r":["Іуд., 78 зач., I, 11 – 25. Лк., 110 зач., XXIII, 1 – 34, 44 – 56."],"n":""},{"m":3,"d":12,"h":"Свт. Григорія Великого, Двоєслова, папи Римського (604). Прп. Феофана, спов., Сигріанського (818). Прав. Фінеєса (бл. 1500 р. до Р. Х.). Прп. Симеона Нового Богослова (1021). Ліддської [нерукотворної] (в Лідді на стовпі) ікони Божої Матері (І). Літургія не звершується.","r":["На 6-му часі: Зах. VIII, 7 – 17.","На веч.: Зах. VIII, 19 – 23."],"n":"Порядок богослужінь такий же, як у середу."},{"m":3,"d":13,"h":"Всіх преподобних отців, які в подвигу просяяли (перехідне святкування в суботу сиропусного тижня). Перенесення мощів свт. Никифора, патр. Константинопольського (846). Мч. Савина Єгипетського (287). Мчч. Африкана, Публія і Терентія (ІІІ). Мч. Олександра (305 – 311). Мц. Христини Перської (ІV). Прп. Аніна Халкідонського, пресвітера.","r":["Прпп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30.","Ряд.: Рим., 115 зач., XIV, 19 – 26. Мф., 16 зач., VI, 1 – 13."],"n":""},{"m":3,"d":14,"h":"Неділя сиропусна, прощена. Спомин Адамового вигнання з раю. Глас 8-й. Прп. Венедикта Нурсійського (543). Свт. Феогноста, митр. Київського і всієї Руси (1353). Блгв. кн. Київського Ростислава, у хрещенні Михаїла (1167). Свт. Євсхимона, спов., єп. Лампсакійського (ІХ).","r":["Ран. – Єв. 8-е, Ін., 64 зач., XX, 11 – 18.","Літ. – Рим., 112 зач., XIII, 11 – XIV, 4. Мф., 17 зач., VI, 14 – 21."],"n":"Заговини на Великий піст. У цей день на літургії заготовлюються два Агнці для Літургій Ранішосвячених Дарів у середу і п’ятницю. У цю неділю та наступні п’ять (до Вербної неділі) звершується вечірня із входом та великими прокимнами: «Не відверни лиця Твого...» і «Дав мені насліддя...», які співаються почергово. Після вечірні звершується чин прощення."},{"m":3,"d":15,"h":"1-й тиждень Великого посту. Мч. Агапія та з ним семи мчч.: Публія, Тимолая, Ромила, двох Олександрів та двох Діонісіїв (303). Сщмч. Олександра, пресвітера в Сиді (270 – 275). Мч. Никандра (бл. 302).","r":["На 6-му часі: Іс. I, 1 – 20.","На веч.: Бут. I, 1 – 13. Притч. I, 1 – 20."],"n":"У будні дні Великого посту служба звершується за Мінеєю та Тріоддю. У перші чотири дні цього тижня на великому повечір’ї читається канон прп. Андрія Критського. У понеділок, вівторок і четвер всієї святої Чотиридесятниці Літургії не звершуються. Початок Великого посту."},{"m":3,"d":16,"h":"Ап. Аристовула, єп. Вританійського (Британського, І). Мч. Савина (287). Мч. Папи (305 – 311). Сщмч. Олександра, єпископа Римського (119). Мч. Юліана Аназаврського (305 – 311). Сщмчч. Трофима і Фала, пресвітерів Лаодикійських (бл. 300).","r":["На 6-му часі: Іс. I, 19 – II, 3.","На веч.: Бут. I, 14 – 23. Притч. I, 20 – 33."],"n":""},{"m":3,"d":17,"h":"Прп. Олексія Римського, людини Божої (411). Свт. Патрикія, просвітителя Ірландії (після 460). Мч. Марина. Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. II, 3 – 11.","На веч.: Бут. I, 24 – II, 3. Притч. II, 1 – 22."],"n":""},{"m":3,"d":18,"h":"Свт. Кирила, архієп. Єрусалимського (386). Мчч. Трофима і Євкарпія (бл. 300). Прп. Аніна, ченця. Мч. і блгв. Едуарда, короля Англії (978/979).","r":["На 6-му часі: Іс. II, 11 – 21.","На веч.: Бут. II, 4 – 19. Притч. III, 1 – 18."],"n":""},{"m":3,"d":19,"h":"Мч. Хрисанфа і мц. Дарії (283) і з ними мчч. Клавдія, трибуна, Іларії, дружини його, Ясона і Мавра, синів їхніх, сщмчч. Діодора, пресвітера, і Мар’яна, диякона. Мч. Панхарія (бл. 302). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. III, 1 – 14.","На веч.: Бут. II, 20 – III, 20. Притч. III, 19 – 34."],"n":"Після заамвонної молитви – молебний канон вмч. Федору Тирону та благословіння колива."},{"m":3,"d":20,"h":"Вмч. Федора Тирона (бл. 306) (перехідне святкування в суботу 1-го тижня Великого посту). Прмчч. Іоана, Сергія, Патрикія та інших, які в обителі св. Сави були вбиті (796). Мц. Фотини (Світлани), самарянки, її синів мчч. Віктора, названого Фотином, та Іосії (І). Мцц. Анатолії, Фото, Фотиди, Параскеви, Киріакії, Домніни і мч. Севастіана (бл. 66). Мцц. Олександри, Клавдії, Євфрасії, Мотрони, Юліанії, Євфимії і Феодосії (310). Свт. Микити, спов., архієп. Аполоніадського (бл. 813 – 820). Літургія за чином свт. Іоана Золотоустого.","r":["Вмч.: 2 Тим., 292 зач., II, 1 – 10. Ін., 52 зач., XV, 17 – XVI, 2.","Ряд.: Євр., 303 зач., I, 1 – 12. Мк., 10 зач., II, 23 – III, 5."],"n":"Служба тільки з Тріоді. На Літургії прокимен, глас 7-й «Звеселиться праведник у Господі...»."},{"m":3,"d":21,"h":"1-ша неділя Великого посту. Торжество Православ’я. Глас 1-й. Прп. Якова, єп. Катанського, спов. (VІІІ). Свт. Кирила, єп. Катанського (І – ІІ). Свт. Фоми, патр. Константинопольського (610). Літургія за чином свт. Василія Великого.","r":["Ран. – Єв. 9-е, Ін., 65 зач., XX, 19 – 31.","Літ. – Євр., 329 зач. (від половини), XI, 24 – 26, 32 – XII, 2. Ін., 5 зач., I, 43 – 51. На молебні: Рим. 121 зач., ХVІ, 17 – 24. Мф. 75 зач., ХVІІІ, 10 – 20."],"n":"Служба з Октоїха й Тріоді. На ранній катавасія «Моря Червоного безодню…». На Літургії антифони святкові (див. у додатку с. 89), замість «Достойно є…» – «Тобою радіє...». Після Літургії – молебень Торжества Православ’я. У цей день на літургії заготовлюється Агнець для Літургії Ранішосвячених Дарів у середу."},{"m":3,"d":22,"h":"2-й тиждень Великого посту. Сщмч. Василія, пресвітера Анкирського (362 – 363). Мц. Дросиди, дочки царя Траяна (104 – 117). Прп. Ісаакія Далматського (ІV).","r":["На 6-му часі: Іс. IV, 2 – V, 7.","На веч.: Бут. III, 21 – IV, 7. Притч. III, 34 – IV, 22."],"n":""},{"m":3,"d":23,"h":"Прмч. Никона Сицилійського, єп., і мчч. 199 учнів його (251). Прп. Никона, ігумена Києво-Печерського (1088). Мчч. Філита, Лідії, дружини його, Македона, Феопрепія, Кроніда і Амфілохія (117 – 138).","r":["На 6-му часі: Іс. V, 7 – 16.","На веч.: Бут. IV, 8–15. Притч. V, 1 – 15."],"n":""},{"m":3,"d":24,"h":"Передсвято Благовіщення Пресвятої Богородиці. Прп. Захарії, ченця. Свт. Артемія (Артемона), єп. Солунського (Селевкійського, І – ІІ). Прп. Захарії, посника Києво-Печерського, в Дальніх печерах (ХІІІ – ХІV). Прп. Якова, єп. Катанського, спов. (VІІІ – ІХ). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. IІ, 3 – 11.","На веч.: Бут. I, 14 – 23. Притч. I, 20 – 33."],"n":""},{"m":3,"d":25,"h":"БЛАГОВІЩЕННЯ ПРЕСВЯТОЇ ВЛАДИЧИЦІ НАШОЇ БОГОРОДИЦІ І ПРИСНОДІВИ МАРІЇ. Ікони Благовіщення Божої Матері (ХVІ). Літургія за чином свт. Іоана Золотоустого.","r":["Ран. – Лк., 4 зач., I, 39 – 49, 56.","На 6-му часі: Іс. VI, 1 – 12. На веч.: Бут. V, 1–24. Притч. VI, 3 – 20. Благовіщення: Вих. III, 1 – 8. Притч. VIII, 22 – 30.","Літ. – Євр., 306 зач., II, 11 – 18. Лк., 3 зач., I, 24 – 38."],"n":"На трапезі дозволяється риба. Всенічна складається з великого повечір’я, літії та ранньої. Починається з великого повечір’я. На ранній на «Бог Господь» тропар свята тричі. Полієлей, сідальний свята, степенні – 1-й антифон 4 гласу і далі все за чином свята. Величання свята: «Архангельський глас співаємо Тобі, Чистая: “Радуйся, Благодатна, Господь з Тобою”». У каноні на четвертій, восьмій і дев’ятій піснях після канону свята трипіснець Тріоді і катавасія Тріоді. Велике славослів'я читається. Після славослів’я ектенія «Доповнимо ранню молитву», далі стихири стиховні, читається «Благо є» один раз, Трисвяте до Отче наш, тропар свята, ектенія «Помилуй нас Боже», «Премудрість», хор: «Благослови», священник: «Сущий благословенний…», хор «Амінь», читець: «Небесний Царю…», священник читає молитву прп. Єфрема Сиріна з трьома поклонами і відразу перший час. Наприкінці 1-го часу – молитва прп. Єфрема Сиріна з трьома великими поклонами і відпуст. 3-й, 6-й, 9-й часи з кафизмами, але без поклонів. На 6-му часі паремія. На зображальних «Блаженні…» читаються, після «Отче наш…» – кондак свята, в кінці зображальних – молитва прп. Єфрема Сиріна з трьома великими поклонами і відпуст. Літургія починається з вечірні. Вхід з Євангелієм. Паремії Тріоді – 2 і свята – 2. Мала ектенія, виголос «Бо Ти Святий...», Трисвяте, далі – Літургія за чином свт. Іоана Золотоустого. Замість «Достойно є…» – «Благовісти, земле... Як до одухотвореного Божого кивоту...». У цей день на літургії заготовлюється Агнець для Літургії Ранішосвячених Дарів у п’ятницю."},{"m":3,"d":26,"h":"Собор архангела Гавриїла. Віддання свята Благовіщення Пресвятої Богородиці. Сщмч. Іринея, єп. Сирійського (304). Мчч. Вафусія і Верка, пресвітерів, Арпили, ченця, Авіва, Агна, Реаса, Ігафракса, Іскоя, Сили, Сигіця, Сонирила, Суїмвла, Ферма, Філа та мцц. Анни, Алли, Лариси, Моїко, Маміки, Уїрко, Анімаїси (Анімаїди), Гаафи, цариці Готської, і Дукліди (бл. 375). Прп. Малха Сирійського (ІV). Прп. Василія Нового, Константинопольського (бл. 944). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. VII, 1 – 14.","На веч.: Бут. V, 32 – VI, 8. Притч. VI, 20 – VII, 1."],"n":""},{"m":3,"d":27,"h":"Мц. Мотрони Солунської (ІІІ – ІV). Мчч. Мануїла і Феодосія (304). Прп. Іоана, прозорливого, Єгипетського (бл. 395). Літургія за чином свт. Іоана Золотоустого. Поминання померлих. Заупокійне:","r":["1 Сол., 270 зач., IV, 13 – 17. Ін., 16 зач., V, 24 – 30.","Ряд.: Євр., 309 зач., III, 12 – 16. Мк., 6 зач., I, 35 – 44."],"n":"На ранній замість «Бог Господь...» – «Алилуя» із заупокійними стихами. В цю та дві наступних суботи заупокійна служба за Тріоддю поєднується зі службою Мінеї та Октоїха."},{"m":3,"d":28,"h":"2-га неділя Великого посту. Глас 2-й. Свт. Григорія Палами, архієп. Фесалонікійського (перехідне святкування в 2-гу неділю Великого посту). Собор усіх преподобних отців Києво-Печерських (перехідне святкування в 2-гу неділю Великого посту). Прп. Іларіона Нового, ігум. Пелікітського (бл. 754). Прп. Стефана Чудотворця, спов., ігум. Триглійського (бл. 815). Мчч. Іони, Варахисія та ін. з ними (бл. 330). Мч. Бояна, кн. Болгарського (830). Прмч. Євстратія Києво-Печерського, в Ближніх печерах (1097). Літургія за чином свт. Василія Великого.","r":["Ран. – Єв. 10-е, Ін., 66 зач., XXI, 1 – 14.","Літ. – Євр., 304 зач., I, 10 – II, 3. Мк., 7 зач., II, 1 – 12.","Свт.: Євр., 318 зач., VII, 26 – VIII, 2. Ін., 36 зач., X, 9 – 16.","Прпп.: Гал., 213 зач., V, 22 – VІ, 2."],"n":"Лк., 24 зач., VІ, 17 – 23 (під зачало). У цей день на літургії заготовлюються два Агнці для Літургій Ранішосвячених Дарів у середу і п’ятницю."},{"m":3,"d":29,"h":"3-й тиждень Великого посту. Сщмчч. Марка, єп. Арефусійського, Кирила, диякона, та інших багатьох (бл. 364). Прп. Іоана, пустельника (ІV). Свт. Євстафія, спов., єп. Вифинійського (ІХ).","r":["На 6-му часі: Іс. VIII, 13 – IX, 7.","На веч.: Бут. VI, 9 – 22. Притч. VIII, 1 – 21."],"n":""},{"m":3,"d":30,"h":"Прп. Іоана Ліствичника (649). Прор. Іоада (Х ст. до Р. Х.). Апп. Сосфена, Аполоса, Кифи, Кесаря і Епафродита. Св. Євули, матері вмч. Пантелеймона (бл. 303). Прп. Іоана, безмовника (VІ). Прп. Зосими, єп. Сиракузького (бл. 662). Свт. Софронія (Кришталевського), єп. Іркутського (1771).","r":["На 6-му часі: Іс. IX, 9 – X, 4.","На веч.: Бут. VII, 1 – 5. Притч. VIII, 32 – IX, 11."],"n":""},{"m":3,"d":31,"h":"Сщмч. Іпатія, єп. Гангрського (бл. 326). Прп. Іпатія, цілителя Києво-Печерського, в Дальніх печерах (ХІV). Прп. Аполонія Єгипетського (ІV). Сщмчч. Авди, єп. Перського, і Веніаміна, дияк. (418 – 424). Прп. Іпатія, ігумена в Руфіянах (бл. 446). Прмц. Марії Паризької (1945). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. X, 12 – 20.","На веч.: Бут. VII, 6 – 9. Притч. IX, 12 – 18."],"n":""},{"m":4,"d":1,"h":"Прп. Марії Єгипетської (522). Прп. Геронтія, канонарха Києво- Печерського, в Дальніх печерах (ХІV). Прп. Макарія, ігумена Пелікитської обителі (бл. 830). Мчч. Геронтія і Василіда (ІІІ). Прав. Ахаза.","r":["На 6-му часі: Іс. XI, 10 – XII, 2.","На веч.: Бут. VII, 11 – VIII, 3. Притч. X, 1 – 22."],"n":""},{"m":4,"d":2,"h":"Прп. Тита, чудотворця (ІХ). Мчч. Амфіана і Едесія (306). Мч. Полікарпа Олександрійського (ІV). Свт. Сави, архієп. Сурозького (ХІІ). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. XIII, 2 – 13.","На веч.: Бут. VIII, 4 – 21. Притч. X, 31 – XI, 12."],"n":""},{"m":4,"d":3,"h":"Прп. Микити, сповідника, ігум. обителі Мидикійської (824). Мц. Феодосії, діви (307 – 308). Прп. Ілірика. Мчч. Елпідофора, Дія, Віфонія і Галика. Ікони Божої Матері «Нев’янучий цвіт». Літургія за чином свт. Іоана Золотоустого. Поминання померлих. Заупокійне:","r":["1 Сол., 270 зач., IV, 13 – 17. Ін., 16 зач., V, 24 – 30.","Ряд.: Євр., 325 зач., X, 32 – 38. Мк., 8 зач., II, 14 – 17."],"n":"На ранній замість «Бог Господь...» – «Алилуя» із заупокійними стихами. В цю та наступну суботи заупокійна служба за Тріоддю поєднується зі службою Мінеї та Октоїха."},{"m":4,"d":4,"h":"3-тя неділя Великого посту, Хрестопоклонна. Глас 3-й. Прп. Йосифа Піснеписця (883). Прп. Георгія, що в Малеї (ІХ). Прп. Йосифа Багатохворобливого, Києво-Печерського, в Дальніх печерах (ХІV). Прп. Зосими, який знайшов прп. Марію Єгипетську (бл. 560). Мцц. Фервуфи, діви, сестри її Мекадошти та рабині її (341 – 343). Ікони Божої Матері, званої «Герондиса». Літургія за чином свт. Василія Великого.","r":["Ран. – Єв. 11-е, Ін., 67 зач., XXI, 15 – 25.","Літ. – Євр., 311 зач., IV, 14 – V, 6. Мк., 37 зач., VIII, 34 – IX, 1."],"n":"На ранній полієлей звершується у вівтарі. Після великого славослів’я винесення Хреста і поклоніння йому. На Літургії антифони святкові (див. у додатку с. 89), замість Трисвятого – «Хресту Твоєму...». У цей день на літургії заготовлюються два Агнці для Літургій Ранішосвячених Дарів у середу і п’ятницю."},{"m":4,"d":5,"h":"4-й тиждень Великого посту. Сщмч. Агафопода, диякона, мчч. Феодула, читця, та інших з ними (бл. 303). Прп. Пуплія Єгипетського (ІV). Прпп. Феони, Симеона і Форвина (ІV). Прп. Марка Афінського (400). Прп. Платона, спов., Студійського (814). Прп. Феодори Солунської (892).","r":["На 6-му часі: Іс. XIV, 24 – 32.","На веч.: Бут. VIII, 21 – IX, 7. Притч. XI, 19 – XII, 6."],"n":"На 1-му часі поклоніння Хресту. Замість «Стопи мої...» співається «Хресту Твоєму...» і стихири на цілування Хреста (як у неділю хрестопоклонну). Подібним чином поклоніння Хресту на 1-му часі буде в середу. На всіх часах та зображальних у дні цього тижня після «Отче наш…» – кондак «Зброя вогненна...»."},{"m":4,"d":6,"h":"Свт. Євтихія, архієп. Константинопольського (582). Свт. Мефодія, архієп. Моравського (885). Прп. Платоніди (308). Мчч. 120 перських (344 – 347). Мч. Єремія та сщмч. Архилія, пресвітера (ІІІ).","r":["На 6-му часі: Іс. XXV, 1 – 9.","На веч.: Бут. IX, 8 – 17. Притч. XII, 8 – 22."],"n":""},{"m":4,"d":7,"h":"Прп. Георгія, сповідника, митр. Мітиленського (після 820). Мч. Каліопія (304). Сщмч. Руфина, диякона, мц. Акилини і з ними 200 воїнів (бл. 310). Прп. Серапіона, ченця. Прп. Юстина (Поповича), Челійського (1978, Серб.). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. XXVI, 21 – XXVII, 9.","На веч.: Бут. IX, 18 – X, 1. Притч. XII, 23 – XIII, 9."],"n":"На 1-му часі поклоніння Хресту."},{"m":4,"d":8,"h":"Апп. Іродіона, Агава, Асинкрита, Руфа, Флегонта, Єрмія та інших з ними (І). Прп. Руфа, затворника Києво-Печерського, в Дальніх печерах (ХІV). Мч. Павсилипа (117 – 138). Свт. Целестина, папи Римського (432). Свт. Нифонта Києво-Печерського, єп. Новгородського (1156).","r":["На 6-му часі: Іс. XXVIII, 14 – 22.","На веч.: Бут. X, 32 – XI, 9. Притч. XIII, 20 – XIV, 6."],"n":""},{"m":4,"d":9,"h":"Мч. Євпсихія (362). Сщмчч. Дісана, єп., Маріава, пресвіт., мчч. Авдієса та ін. 270-х (362 – 364). Прмч. Вадима, архім. (376). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. XXIX, 13 – 23.","На веч.: Бут. XII, 1 – 7. Притч. XIV, 15 – 26."],"n":"Після зображальних звершується поклоніння Хресту. Після кадіння тричі навколо аналоя Хрест, при співі тропаря і кондака, через Царські врата вноситься у вівтар."},{"m":4,"d":10,"h":"Мчч. Терентія, Помпія, Африкана, Максима, Зинона, Олександра, Федора та інших 33 (бл. 249 – 251). Сщмчч. Якова, пресвітера, Азадана і Авдикія, диякк. Перських (бл. 380). Блгв. гетьмана Петра (Конашевича-Сагайдачного) (1622). Прмчч. священної обителі Пантократора, які в Дау Пенделі (Аттика) постраждали (бл. 1680). Сщмч. Григорія V, патр. Константинопольского (1821). Літургія за чином свт. Іоана Золотоустого. Поминання померлих. Заупокійне:","r":["1 Кор., 163 зач., ХV, 47 – 57. Ін., 16 зач., V, 24 – 30.","Ряд.: Євр., 313 зач., VI, 9 – 12. Мк., 31 зач., VII, 31 – 37."],"n":"На ранній замість «Бог Господь...» – «Алилуя» із заупокійними стихами. В цю суботу заупокійна служба за Тріоддю поєднується зі службою Мінеї та Октоїха."},{"m":4,"d":11,"h":"4-та неділя Великого посту. Глас 4-й. Прп. Іоана Ліствичника (перехідне святкування в 4-ту неділю Великого посту). Сщмч. Антипи, єп. Пергама Асійського (бл. 68). Мчч. Прокеса і Мартиніана (бл. 67). Прп. Фармуфія (ІV). Прп. Іоана, учня прп. Григорія Декаполіта (820 – 850). Свт. Калиника Черникського (1868, Рум.). Літургія за чином свт. Василія Великого.","r":["Ран. – Єв. 1-е, Мф., 116 зач., ХXVIІІ, 16 – 20.","Літ. – Євр., 314 зач., VI, 13 – 20. Мк., 40 зач., IX, 17 – 31.","Прп.: Еф., 229 зач., V, 8 – 19. Мф., 10 зач., IV, 25 – V, 12."],"n":"У цей день на літургії заготовлюється три Агнці для Літургії Ранішосвячених Дарів у середу, четвер і п’ятницю."},{"m":4,"d":12,"h":"5-й тиждень Великого посту. Прп. Василія, спов., єп. Парійського (після 754). Сщмч. Зинона, єп. Веронійського (бл. 260). Прп. Ісаака Сиріна, у Сполеті Італійському (550). Прмчч. Мини, Давида та Іоана (після 636). Прп. Анфуси, діви (801). Прп. Афанасії, ігумені (860). Бєлиницької (ХІІІ) ікони Божої Матері.","r":["На 6-му часі: Іс. XXXVII, 33 – XXXVIII, 6.","На веч.: Бут. XIII, 12 – 18. Притч. XIV, 27 – XV, 4."],"n":""},{"m":4,"d":13,"h":"Сщмч. Артемона, пресвітера Лаодикійського (303). Мч. Крискента з Мир Лікійських. Мц. Фомаїди Єгипетської (476).","r":["На 6-му часі: Іс. XL, 18 – 31.","На веч.: Бут. XV, 1 – 15. Притч. XV, 7 – 19."],"n":""},{"m":4,"d":14,"h":"Свт. Мартина, спов., папи Римського (655). Мчч. Антонія, Іоана і Євстафія Литовських (1347). Мч. Ардаліона (305 – 311). Мчч. 1000 перських і Азата, скопця (бл. 341). Мчч. Христодула й Анастасії Патрських, вбитих в Ахаї (1821). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. XLI, 4 – 14.","На веч.: Бут. XVII, 1 – 9. Притч. XV, 20 – XVI, 9."],"n":"На вечірні на «Господи взиваю» додаються 24 покаянні стихири Великого канону."},{"m":4,"d":15,"h":"Четвер Великого канону. Вишгородської ікони Божої Матері (І). Апп. від 70-х Аристарха, Пуда і Трофима (бл. 67). Мцц. Василіси й Анастасії (бл. 68). Мчч. Месукевійських Сухія і воїнів його: Андрія, Анастасія, Талале, Феодорита, Івхиріона, Йордана, Кіндрата, Лукіана, Мимненоса, Нерангіоса, Полієвкта, Якова, Фоки, Доментіана, Віктора, Зосими (100 – 130, Груз.). Мч. Сави Готського (372). Блгв. кн. Київського Мстислава Володимировича (1132). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. XLII, 5 – 16.","На веч.: Бут. XVIII, 20 – 33. Притч. XVI, 17 – XVII, 17."],"n":"На ранній читання Великого покаянного канону прп. Андрія Критського («Маріїне стояння») із трипіснцем четверга. Читається житіє прп. Марії Єгипетської. 1-ша частина – після кафизми і сідального (перед 50-м псалмом), 2-га частина – після 3-ї пісні канону. Закінчення ранньої звичайне, великопостове. 1-й час без кафизми. У кінці ранньої і кожного часу молитва Єфрема Сиріна з трьома великими поклонами."},{"m":4,"d":16,"h":"Мцц. Агафії, Ірини та Хіонії (304). Мч. Леоніда і мцц. Харієси, Ніки, Галини, Каліси, Нунехії, Василіси, Феодори, Ірини та інших (258). Іллінсько-Чернігівської ікони Божої Матері (1658). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. XLV, 11 – 17.","На веч.: Бут. XXII, 1 – 18. Притч. XVII, 17 – XVIII, 5."],"n":""},{"m":4,"d":17,"h":"Похвала Пресвятої Богородиці (субота акафісту). Сщмчч. Симеона, єп. Перського, і з ним Авделая і Ананії, пресвітерів, мчч. Хусдазата (Усфазана), євнуха, Фусика, Азата, мц. Аскитреї та інших багатьох (344). Прп. Акакія, єп. Мелітинського (бл. 435). Мч. Адріана (251). Свт. Агапіта, папи Римського (536). Літургія за чином свт. Іоана Золотоустого. Богородиці:","r":["Євр., 320 зач., IX, 1 – 7. Лк., 54 зач., X, 38 – 42; XI, 27 – 28.","Ряд.: Євр., 322 зач., IX, 24 – 28. Мк., 35 зач., VIII, 27 – 31."],"n":"Служба з Тріоді. На ранній після 1-ої та 2-ої кафизм і після 3-ої та 6-ої пісень канону співається акафіст Пресвятій Богородиці. Співається велике славослів’я."},{"m":4,"d":18,"h":"5-та неділя Великого посту. Глас 5-й. Прп. Марії Єгипетської (перехідне святкування в 5-ту неділю Великого посту). Прп. Іоана, учня прп. Григорія Декаполіта (820 – 850). Мчч. Віктора, Зотика, Зинона, Акиндина і Северіана (303). Свт. Косми, спов., єп. Халкідонського, і прп. Авксентія (815 – 820). Мч. Іоана Нового з Яніни (1526). Максимівської ікони Божої Матері (1299). Літургія за чином свт. Василія Великого.","r":["Ран. – Єв. 2-е, Мк., 70 зач., XVI, 1 – 8.","Літ. – Євр., 321 зач. (від половини), IX, 11 – 14. Мк., 47 зач., X, 32 – 45.","Прп.: Гал., 208 зач., III, 23 – 29. Лк., 33 зач., VII, 36 – 50."],"n":"У цей день на літургії заготовлюються два Агнці для Літургій Ранішосвячених Дарів у середу і п’ятницю."},{"m":4,"d":19,"h":"6-й тиждень Великого посту (вербний тиждень). Прп. Іоана Давньопечерника (VІІІ). Мчч. Феони, Христофора й Антоніна (303). Сщмч. Пафнутія, єп. Єрусалимського. Свт. Георгія, спов., єп. Антіохії Пісідійської (813 – 820). Свт. Трифона, патр. Константинопольського (933). Прп. Никифора, ігумена.","r":["На 6-му часі: Іс. XLVIII, 17 – XLIX, 4.","На веч.: Бут. XXVII, 1 – 41. Притч. XIX, 16 – 25."],"n":""},{"m":4,"d":20,"h":"Прав. Закхея, єп. Кесарійського (І). Прп. Федора Трихіни. Свтт. Григорія (593) і Анастасія Синаїта (599), патріархів Антіохійських. Прп. Анастасія, ігум. Синайської гори (695). Мч. дитяти Гавриїла Білостоцького (1690). Кіпрської ікони Божої Матері (392).","r":["На 6-му часі: Іс. XLIX, 6 – 10.","На веч.: Бут. XXXI, 3 – 16. Притч. XXI, 3 – 21."],"n":""},{"m":4,"d":21,"h":"Сщмч. Януарія, єп., і з ним сщмчч. Прокула, Соссія і Фавста, дияконів, мчч. Дисидерія, читця, Євтихія і Акутіона (бл. 305). Мчч. Федора, що в Пергії, матері його Филипії, Діоскора, Сократа і Діонісія (138 – 161). Мчч. Ісаакія, Аполоса і Кіндрата (303). Свт. Максиміана, патріарха Константинопольського (434). Літургія Ранішосвячених Дарів.","r":["На 6-му часі: Іс. LVIII, 1 – 11.","На веч.: Бут. XLIII, 26 – 31; XLV, 1 – 16. Притч. XXI, 23 – XXII, 4."],"n":""},{"m":4,"d":22,"h":"Апп. Нафанаїла, Луки та Климента (І). Прп. Федора Сикеота, єп. Анастасіупольського (613). Прп. Віталія (609 – 620).","r":["На 6-му часі: Іс. LXV, 8 – 16.","На веч.: Бут. XLVI, 1 – 7. Притч. XXIII, 15 – XXIV, 5."],"n":""},{"m":4,"d":23,"h":"Вмч. Юрія Переможця (303). Мц. цариці Олександри (303). Мчч. Анатолія і Протолеона (303). Літургія Ранішосвячених Дарів.","r":["Ран. – Лк., 63 зач., XII, 2 – 12.","На 6-му часі: Іс. XLVI, 10 – 24. На веч.: Бут. XLIX, 33 – L, 26. Притч. XXXI, 8 – 32.","Літ. – Вмч.: Діян., 29 зач., XII, 1 – 11. Ін., 52 зач., XV, 17 – XVI, 2."],"n":"Повечір’я велике, без поклонів. Після першого трисвятого тропар великомученику. Після другого Трисвятого – тропарі звичайні «Помилуй нас, Господи...». Замість «Господи сил, з нами будь...» – кондак великомученику. Після виголосу «Боже, змилосердься над нами...» – три великих поклони. На ранній на «Бог Господь…» – тропар великомученику (двічі), «Слава і нині…» – богородичний. Після 1-ї та 2-ї кафизми малої ектенії немає, а відразу сідальні з Тріоді. Після 3-ї кафизми – мала ектенія і сідальні великомученика. Полієлей і величання великомученику. Канон великомученика з ірмосом на 8, катавасія «Відкрию уста мої...». В піснях з трипіснцем канон великомученика з ірмосом на 6 і трипіснець Тріоді на 8; катавасія – ірмос 2-го трипіснця. Після 9-ої пісні замість великопісних світильних – світильний великомученика (двічі), «Слава і нині…» – богородичний. На хвалітних стихири великомученика на 4, «Слава...» – великомученика, «І нині...» – богородичний. Читається повсякденне славослів’я. На стиховні стихири з Тріоді (самогласний дня двічі і мученичний), «Слава...» – великомученика, «І нині...» – богородичний. «Благо є...» (один раз), трисвяте, тропар великомученика, «Слава і нині…» – богородичний, потрійна ектенія «Помилуй нас, Боже...», молитва прп. Єфрема Сиріна з трьома великими поклонами, 1-й час і відпуст. На всіх часах кафизми, тропар і кондак великомученика; в кінці кожного часу молитва прп. Єфрема Сиріна з трьома великими поклонами. На 6-му часі паремія. «Блаженні» читаються. На великій вечірні початок такий, як перед Літургією Ранішосвячених Дарів. Кафизма чергова. На «Господи, взиваю…» стихири з Тріоді – 6 і великомученика – 4, «Слава...» – великомученика, «І нині...» – богородичний догматик. Вхід із Євангелієм. Паремії Тріоді, «Нехай піднесеться молитва моя…», молитва прп. Єфрема Сиріна з трьома великими поклонами й відразу, без малої ектенії, прокимен, Апостол, алилуарій і Євангеліє великомученика. Далі звичайне послідування Літургії Ранішосвячених Дарів. Причасний «Спожийте...» і великомученика."},{"m":4,"d":24,"h":"Лазарева субота. Воскрешення прав. Лазаря. Мчч. Сави Стратилата і з ним 70-х воїнів (272). Прп. Сави Києво-Печерського, в Ближніх печерах (ХІІІ). Прп. Олексія, затворника Києво-Печерського, в Ближніх печерах (ХІІІ). Мчч. Пасикрата і Валентина (228). Мчч. Євсевія, Неона, Леонтія, Лонгина та інших (303). Прп. Фоми, юродивого (546 – 560). Прп. Єлизавети, чудотвориці (VІ – VІІІ). Молченської ікони Божої Матері (1405). Літургія за чином свт. Іоана Золотоустого.","r":["Євр., 333 зач. (від половини), XII, 28 – XIII, 8. Ін., 39 зач., XI, 1 – 45."],"n":"На трапезі дозволяється вживання рибної ікри. Вся служба за Тріоддю. На ранній після 2-ї кафизми – «Ангельський собор...» (здійснюється кадіння всього храму), мала ектенія, сідальний, «Воскресіння Христове бачивши…». На 9-й пісні «Чеснішу...» не співається до понеділка після Фоминої неділі. Співаємо велике славослів’я. На Літургії після входу «Спаси нас, Сину Божий, у святих дивний Ти...». Замість Трисвятого – «Всі ви, що в Христа хрестилися…». Замість «Достойно є…» – ірмос 9-ї пісні канону «Чисту Богородицю...». Відпуст ранньої і Літургії – «Христос, істинний Бог наш...» зі згадуванням імені святого праведного Лазаря. З цього дня Мінея не використовується до понеділка Фоминого тижня, крім служб великим святим."},{"m":4,"d":25,"h":"6-та неділя Великого посту, ваїй, цвітоносна, вербна. ВХІД ГОСПОДНІЙ В ЄРУСАЛИМ. Апостола і євангеліста Марка (63). Царгородської ікони Божої Матері (1071). Львівської ікони Божої Матері (перехідне святкування в неділю після 23 квітня). Літургія за чином свт. Іоана Золотоустого.","r":["Ран. – Мф., 83 зач., XXI, 1 – 11, 15 – 17.","Літ. – Флп., 247 зач., IV, 4 – 9. Ін., 41 зач., XII, 1 – 18."],"n":"На трапезі дозволяється їсти рибу. На ранній величання «Величаємо Тебе, Життєдавче Христе, осанна у вишніх і ми співаємо Тобі: Благословенний, Хто йде в ім’я Господнє». Після Євангелія відразу читається 50-й псалом (в цей час кадимо вербу), потім читаємо молитву на освячення верби, і окроплюємо її освяченою водою. «Чеснішу…» не співається. Після катавасії 9-ої пісні мала ектенія і відразу виголошуємо «Свят Господь Бог наш…». На Літургії антифони святкові. Вхідний стих: «Благословенний, Хто йде в ім’я Господнє, благословляємо вас із дому Господнього, Бог Господь і явився нам». Задостойник свята. Відпуст свята. У цей день на літургії заготовлюються три Агнці для Літургій Ранішосвячених Дарів у понеділок, вівторок і середу."},{"m":4,"d":26,"h":"Страсний тиждень. Великий понеділок. Сщмч. Василія, єп. Амасійського. Прав. Глафіри, діви (322). Прп. Іоаникія Дівиченського (ХІІІ, Серб.). Літургія Ранішосвячених Дарів.","r":["Ран. – Мф., 84 зач., XXI, 18 – 43.","Літ. – Мф., 98 зач., XXIV, 3 – 35."],"n":"У неділю закінчення вечірні за зразком неділь Чотиридесятниці. Відпуст: «Господь, що йде на добровільні страждання, заради нашого спасіння, Христос, істинний Бог наш...». Наприкінці ранньої і Літургії (крім зображальних) у Великий понеділок, вівторок, середу відпуст цей самий (святі храму і дня не згадуються). Наприкінці інших служб відпуст малий. На ранній після кафизм – Євангеліє дня, 50-й псалом, «Спаси, Боже, людей Твоїх...». Часи постові. У понеділок, вівторок і середу Страсного тижня на 3-му, 6-му і 9-му часах читаємо Євангеліє. На Літургії Ранішосвячених Дарів вхід із Євангелієм і читання Євангелія."},{"m":4,"d":27,"h":"Великий вівторок. Ап. від 70-х і сщмч. Симеона, родича Господнього (107). Прп. Стефана, ігум. Києво-Печерського, єп. Володимирського (1094). Прав. Євлогія, гостинного (ІV). Літургія Ранішосвячених Дарів.","r":["Ран. – Мф., 90 зач., XXII, 15 – XXIII, 39.","Літ. – Мф., 102 зач., XXIV, 36 – XXVI, 2."],"n":"Порядок служби, як у понеділок."},{"m":4,"d":28,"h":"Велика середа. Апп. від 70-х Ясона і Сосипатра, мц. Керкири, діви, та інших, які з ними постраждали (І). Мчч. Дади, Максима і Квинтиліана (286). Мчч. Саторнія, Якисхола, Фавстіана, Януарія, Марсалія, Єфрасія, Маммія, Мурина, Зинона, Євсевія, Неона і Віталія (бл. 63). Свт. Кирила, єп. Турівського (1183). Літургія Ранішосвячених Дарів.","r":["Ран. – Ін., 41 зач. (від половини), XII, 17 – 50.","Літ. – Мф., 108 зач., XXVI, 6 – 16."],"n":"Порядок служби, як у понеділок. На зображальних замість відпусту – молитва «Владико Многомилостивий...» (дивись на великому повечір’ї). На Літургії після «Нехай буде ім’я Господнє...» молитва прп. Єфрема Сиріна з трьома великими поклонами, після чого земні поклони в храмі припиняються до дня Святої Тройці (крім поклонів біля святої Плащаниці). Відпуст – «Господь, що йде на добровільні страждання, заради нашого спасіння, Христос, істинний Бог наш...»."},{"m":4,"d":29,"h":"Великий четвер. Спомин Таємної вечері. Дев’ятьох мчч. Кизицьких: Феогнида, Руфа, Антипатра, Феостиха, Артеми, Магна, Феодота, Фавмасія і Филимона (286 – 299). Прп. Мемнона, чудотворця. Мчч. Діодора і Родопіана, диякона (284 – 305). Свт. Василія, єп. Захолмського (ХVІ, Серб.). Мч. Іоана Валаха (Румун.). Літургія за чином свт. Василія Великого.","r":["Ран. – Лк., 108 зач. (від пол.), ХХІІ, 1 – 39.","Літ. – 1 Кор., 149 зач., ХІ, 23 – 32. Єв. (складене): Мф., 107 зач., ХХVІ, 1 – 20. Ін., ХІІІ, 3 – 17; Мф. ХХVІ, 21 – 39; Лк., ХХІІ, 43 – 45; Мф., ХХVІ, 40 – ХХVІІ, 2. Чин обмивання ніг здійснюється при архієрейському служінні на розсуд архієрея. На обмиванні ніг – Ін., 44 зач., ХІІІ, 1 – 11. Після обмивання ніг: Ін., 45 зач., ХІІІ, 12 – 17."],"n":"На ранній кафизм немає, «Спаси, Боже, людей Твоїх...» не промовляється. Після 50-го псалма канон. На часах читаємо тропар і кондак Великого четверга, а не тропарі часу; а на 1-му часі – тропар пророцтва, прокимен і паремія. Літургія починається вечірнею. Вхід з Євангелієм. Замість Херувимської пісні і причасного стиха, під час причащання та замість «Нехай наповняться уста наші...» співається «Вечері Твоєї тайної...». Задостойник – ірмос 9-ої пісні канону «Прийдіть, вірні...». Відпуст ранньої і Літургії – «Христос, що заради нас, людей...». Відпуст після повечір’я і зображальних малий «Христос, істинний Бог наш, молитвами...». Також за традицією, у Великий четвер заготовляються запасні Святі Дари на весь рік для причащання хворих."},{"m":4,"d":30,"h":"Велика п’ятниця. Спомин святих спасительних страстей Господа нашого Ісуса Христа. Ап. Якова Зеведеєва (44). Свт. Доната, єп. Єврії (бл. 387). Знайдення мощів сщмч. Василія, єп. Амасійського (ІV). Знайдення мощів свт. Микити Києво-Печерського, єп. Новгородського (1558). Мч. Максима. Ран. – Євангелія святих страстей Господа нашого Ісуса Христа: 1-е:","r":["Ін., 46 зач., XIII, 31 – XVIII, 1. 2-е: Ін., 58 зач., XVIII, 1 – 28. 3-є: Мф., 109 зач., XXVI, 57 – 75. 4-е: Ін., 59 зач., XVIII, 28 – XIX, 16. 5-е: Мф., 111 зач., XXVII, 3 – 32. 6-е: Мк., 67 зач., XV, 16 – 32. 7-е: Мф., 113 зач., XXVII, 33 – 54. 8-е: Лк., 111 зач., XXIII, 32 – 49. 9-е: Ін., 61 зач., XIX, 25 – 37. 10-е: Мк., 69 зач., XV, 43 – 47. 11-е: Ін., 62 зач., XIX, 38 – 42. 12-е: Мф., 114 зач., XXVII, 62 – 66. Літургія не звершується.","На 1-му часі: Гал., 215 зач. (від пол.), VI, 14 – 18. Мф., 110 зач., XXVII, 1 – 56.","На 3-му часі: Рим., 88 зач. (від пол.), V, 6 – 11. Мк., 67 зач., XV, 16 – 41.","На 6-му часі: Євр., 306 зач., II, 11 – 18. Лк., 111 зач., XXIII, 32 – 49.","На 9-му часі: Євр., 324 зач., X, 19 – 31. Ін., 59 зач., XVIII, 28 – XIX, 37. На веч.: 1 Кор., 125 зач., I, 18 – II, 2."],"n":"Єв. складене: Мф., 110 зач., XXVII, 1 – 44; Лк., XXIII, 39 – 43; Мф., XXVII, 45 – 54; Ін., XIX, 31 – 37; Мф., XXVII, 55 – 61. Суворий піст. У четвер увечері служимо ранню з читанням 12-ти Євангелій святих страстей Господа нашого Ісуса Христа. 1-й час до ранньої не приєднується. У кінці ранньої – відпуст Великої п’ятниці. Вранці у п’ятницю відправляємо послідування Царських часів Великої п’ятниці із зображальними. У другій половині дня звершуємо вечірню Великої суботи, наприкінці якої під час співу тропарів після «Нині відпускаєш...» з вівтаря через північні двері виноситься свята Плащаниця. Відпуст часів із зображальними і вечірні – «Христос, що заради нас, людей...». Після виносу Плащаниці – мале повечір’я з каноном «Розп’яття Господнє й на плач Пресвятої Богородиці». Відпуст повечір’я звичайний. Під час цілування Плащаниці співаємо тропар: «Прийдіть, вшануймо Йосифа...». Служба апостолу Якову Зеведеєвому переноситься на вівторок Світлого тижня."},{"m":5,"d":1,"h":"Велика субота. Прор. Єремії (VІ ст. до Р. Х.). Сщмч. Макарія, митр. Київського і всієї Руси (1497). Прмчч. Афонських: Євфимія (1814), Ігнатія (1814) та Акакія (1816). Прмч. Вати Персянина (ІV). Блгв. Тамари, цариці Грузинської (1213). Ікони Божої Матері, званої «Несподівана радість». Літургія за чином свт. Василія Великого. Ран. – Ап. складений:","r":["1 Кор., 133 зач., V, 6 – 8; Гал., 206 зач., III, 13 – 14. Мф., 114 зач., XXVII, 62 – 66.","Літ. – Рим., 91 зач., VI, 3 – 11. Мф., 115 зач., XXVIII, 1 – 20."],"n":"На ранній – похвали зі стихами 17-ої кафизми на три статті. Після 9-ої пісні канону і малої ектенії – «Свят Господь Бог наш» і відразу «Все, що дише...» та хвалітні стихири. Після співу великого славослів’я обносять святу Плащаницю довкола храму, співаючи поховальне «Святий Боже...». Далі паремія, Апостол і Євангеліє. Після Євангелія потрійна «Промовмо всі...» і прохальна ектенії. Відпуст ранньої – «Христос, що заради нас людей...» і 1-й час. На зображальних «Блаженні…» читаються. Літургія за чином свт. Василія Великого починається вечірнею. Вхід з Євангелієм. Прокимна немає, але відразу читання 15 паремій із заспівами після 6-ої: «Славно, бо прославився» та останньої: «Господа оспівуйте і прославляйте по всі віки». Далі мала ектенія, виголос: «Бо Ти Святий Боже...». Замість Трисвятого – «Всі ви, що в Христа хрестилися...». Після Апостола співці замість «Алилуя» співають «Воскресни, Боже...». Священнослужителі в цей час переодягаються у білі облачення. Замість Херувимської пісні – «Нехай мовчить всяка плоть...». Задостойник – «Не ридай за Мною, Мати...». Після заамвонної молитви співаються тропарі «Благообразний Йосиф...», «Слава...» – «Коли зійшов Ти до смерті...», «І нині...» – «Мироносицям жонам...», молитва на благословення хлібів і вина, але без згадки про пшеницю та єлей, потім «Нехай буде ім’я Господнє…», 33-й псалом і відпуст Літургії – «Христос, істинний Бог наш...». Служба священномученику Макарію, митр. Київському переноситься на середу Світлого тижня."},{"m":5,"d":2,"h":"СВІТЛЕ ХРИСТОВЕ ВОСКРЕСІННЯ. ПАСХА. ВЕЛИКДЕНЬ. Свт. Афанасія Великого, архієп. Олександрійського (373). Перенесення мощів блгвв. князів страстотерпців Бориса і Гліба, у св. хрещенні Романа і Давида (1072 і 1115). Свт. Афанасія, патр. Константинопольського, Лубенського чудотворця (1654). Мчч. Еспера і Зої та дітей їх Киріака і Феодула (ІІ). Блгв. і рівноап. царя Бориса, у св. хрещенні Михаїла, просвітителя болгар (907, Болг.). Літургія за чином свт. Іоана Золотоустого.","r":["Літ. – Діян., 1 зач., I, 1 – 8. Ін., 1 зач., I, 1 – 17. На веч.: Ін., 65 зач., XX, 19 – 25."],"n":"Після читання Діянь святих апостолів служимо полуношницю. На 9-й пісні канону, коли співають катавасію «Не ридай за Мною, Мати…», святу Плащаницю кадимо і потім на словах «...встану і прославлюся...» підіймаємо і вносимо царськими вратами у вівтар, і кладемо на престіл, врата зачиняються, полуношниця продовжується. Відпуст короткий «Христос, істинний Бог наш...». Опівночі починається хресний хід навколо храму зі співом стихири «Воскресіння Твоє, Христе Спасе…». Пасхальна рання починається перед зачиненими західними (вхідними) дверима храму виголосом «Слава Святій…», під час цього виголосу священник трисвічником і хрестом зображує хресне знамення не один, як за звичай, а тричі і далі за пасхальним чином. Кадіння на кожній пісні канону і мала ектенія. Після стихир Пасхи читається повчальне слово свт. Іоана Золотоустого і співається йому тропар. Часи співаються пасхальні. На Літургії – антифони Пасхи. Вхідний стих: «В церквах благословіте Бога, Господа від джерел Ізраїлевих». Замість Трисвятого – «Всі ви, що в Христа хрестилися…». Задостойник – «Ангел звістив…», «Світися, світися…». Замість «Благословенний, Хто йде…», «Тіло Христове прийміть…», «Ми бачили Світло істинне…», «Нехай наповняться уста наші…» співається «Христос воскрес із мертвих…» (один раз), а замість «Нехай буде ім’я Господнє…» і 33-го псалма співається «Христос воскрес із мертвих…» (багато разів). Після заамвонної молитви освячується артос. Відпуст Літургії пасхальний, без згадки святих. На вечірні: служимо її у повному облаченні, вхід із Євангелієм. Після великого прокимна священник читає Євангеліє в царських вратах обличчям до народу."},{"m":5,"d":3,"h":"Пасхальний тиждень. Загальниця. Світлий понеділок. Мчч. Тимофія і Маври (бл. 286). Прп. Феодосія, ігум. Києво-Печерського (1074). Прп. Петра, чудотворця, єп. Аргоського (Х). Ікон Божої Матері: Успіння Києво-Печерської, принесеної з Константинополя (1073), Києво-Печерської (з Антонієм і Феодосієм) (1085).","r":["Діян., 2 зач., I, 12 – 17, 21 – 26. Ін., 2 зач., I, 18 – 28.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":"Порядок служби, як у перший день Пасхи. Початок ранньої у вівтарі. На каноні додаються Богородичні. Ектенія після 3-ої, 6-ої і 9-ої пісень. Кадіння – на 1-ій, 4-ій, 7-ій і 9-ій піснях канону. Часи пасхальні. На Літургії антифони Пасхи, Вхідний стих: «В церквах благословіте Бога, Господа від джерел Ізраїлевих», замість Трисвятого – «Всі ви, що в Христа хрестилися…», задостойник Пасхи. Закінчення Літургії – як у перший день Пасхи. З такими ж особливостями звершуються служби в усі дні світлого тижня. До Пасхальної відправи додається служба прп. Феодосію, ігум. Києво-Печерському з Мінеї."},{"m":5,"d":4,"h":"Світлий вівторок. Іверської ікони Божої Матері (перехідне святкування у вівторок Світлого тижня). Мц. Пелагії, діви Тарсійської (бл. 290). Сщмч. Еразма, єп. Формійського (303). Сщмч. Альвіана, єп. Анейського, та учнів його (304). Сщмч. Сильвана, єп. Газького, і з ним 40 мучеників (311). Прмчч. отців Давидо-Гареджийських (ХVІІ, Груз.) (перехідне святкування у вівторок Світлого тижня).","r":["Діян., 4 зач., II, 14 – 21. Лк., 113 зач., XXIV, 12 – 35.","Ап.: Діян., 29 зач., ХІІ, 1 – 11. Лк., 17 зач., V, 1 – 11."],"n":"До Пасхальної відправи додається служба ап. Якову Зеведеєву з Мінеї."},{"m":5,"d":5,"h":"Світла середа. Вмц. Ірини Македонської (І – ІІ). Собор преподобних отців, які на горі Синай подвизалися (перехідне святкування в середу Світлого тижня). Ікони Божої Матері «Невипивана чаша» (1878). Віленської ікони Божої Матері. Касперівської ікони Божої Матері (перехідне святкування в середу Світлого тижня).","r":["Діян., 5 зач., II, 22 – 36. Ін., 4 зач., I, 35 – 51.","Сщмч.: Євр., 334 зач., ХІІІ, 7 – 16."],"n":"Ін., 36., Х, 9 – 16. До Пасхальної відправи додається служба сщмч. Макарію, митр. Київському з Мінеї."},{"m":5,"d":6,"h":"Світлий четвер. Прав. Іова Багатостраждального (бл. 2000 – 1500 до Р. Х.). Прп. Іова Почаївського (1651). Мчч. Варвара, воїна, Вакха, Калимаха та Діонісія (бл. 362). Мч. Парфенія. Мч. Варвара, колишнього розбійника.","r":["Діян., 6 зач., II, 38 – 43. Ін., 8 зач., III, 1 – 15.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":"До Пасхальної відправи додається служба прп. Іову Почаївському з Мінеї."},{"m":5,"d":7,"h":"Світла п’ятниця. Ікони Божої Матері «Живоносне джерело» (перехідне святкування у п’ятницю Світлого тижня). Згадування появи на небі Хреста Господнього в Єрусалимі (351). Мч. Акакія, сотника (303). Прпп. Іоана Зедазнійського та учнів його: Авіва, єп. Некреського, Антонія Марткобського, Давида Гареджийського, Зинона Ілкатського, Фадея Степанцмидського, Ісе (Ієсея), єп. Цилканського, Йосифа, єп. Алавердського, Ісидора Самтавійського, Михаїла Улумбійського, Пірра Бретського, Стефана Хирського та Шіо Мгвимського (VІ, Груз.). Прмч. Пахомія Русина, Афонського (1730). Любецької (ХІ) та Жировицької (1470) ікон Божої Матері.","r":["Діян., 7 зач., III, 1 – 8. Ін., 7 зач., II, 12 – 22. Богородиці: Флп., 240 зач., II, 5 – 11. Лк., 54 зач., X, 38 – 42; XI, 27 – 28. На водосвятті: Євр., 306 зач., II, 11 – 18. Ін., 14 зач., V, 1 – 4."],"n":"До Пасхальної відправи додається служба Пресвятій Богородиці на честь її ікони «Живоносне джерело» (в Тріоді квітній). Після Літургії, за звичаєм, звершується мале освячення води."},{"m":5,"d":8,"h":"Світла субота. Апостола і євангеліста Іоана Богослова (98 – 117). Прп. Арсенія Великого (449 – 450). Прпп. Арсенія Працелюбного (ХІV) та Пимена, посника, (ХІІ) Києво-Печерських, в Дальніх печерах.","r":["Ран. – Ін., 67 зач., XXI, 15 – 25.","Літ. – Діян., 8 зач., III, 11 – 16. Ін., 11 зач., III, 22 – 33.","Ап.: 1 Ін., 68 зач., I, 1 – 7. Ін., 61 зач., XIX, 25 – 27; XXI, 24 – 25."],"n":"Поминання загиблих у ІІ Світовій війні. До Пасхальної відправи додається служба ап. і єв. Іоану Богослову з Мінеї. Після заамвонної молитви на Літургії читається молитва на роздроблення артоса, і відбувається роздроблення та роздається артос вірним. Ввечері перед читанням 9-го часу зачиняються царські врата."},{"m":5,"d":9,"h":"Антипасха. 2-га неділя після Пасхи, апостола Фоми. Перенесення мощів святителя і чудотворця Миколая з Мир Лікійських у м. Бар (1087). Прор. Ісаї (VІІІ ст. до Р. Х.). Мч. Христофора (бл. 250). Прп. Шіо Мгвимського (VІ, Груз.). Прп. Йосифа Оптинського (1911).","r":["Ран. – Єв. 1-е, Мф., 116 зач., XXVIII, 16 – 20.","Літ. – Діян., 14 зач., V, 12 – 20. Ін., 65 зач., XX, 19 – 31.","Свт.: Євр., 335 зач., XIII, 17 – 21. Мф., 11 зач., V, 14 – 19."],"n":"Від сьогодні щодня до віддання Пасхи богослужіння після виголосу священника починається триразовим читанням або співом «Христос воскрес із мертвих…». В усі недільні дні до віддання Пасхи «Чеснішу..» не співаємо. На ранній величання «Величаємо Тебе, Життєдавче Христе, що заради нас у пекло зійшов і з Собою всіх воскресив» та свт. Миколаю Чудотворцю. Після Євангелія у всі неділі до віддання Пасхи – «Воскресіння Христове бачивши…» – (тричі). Пасхальний канон в цю неділю вже не співається. На Літургії задостойник «Ангел звістив…», «Світися, світися…» (так щодня, крім Переполовення і його віддання). Замість «Ми бачили Світло істинне…» – «Христос воскрес…» (один раз), а перед відпустом після «Слава Тобі, Христе Боже, надіє наша, слава Тобі» співається тричі. Відпуст воскресний: «Христос, що воскрес із мертвих, істинний Бог наш...» (так і у всі дні до віддання Пасхи включно). Вечірня в неділю Антипасхи із входом і великим прокимном."},{"m":5,"d":10,"h":"2-й тиждень після Пасхи (Проводи). Апостола Симона Зилота (І). Свт. Симона Києво-Печерського, єп. Володимирського і Суздальського, у Ближніх печерах (1226). Мчч. Алфія, Філадельфа, Кипріана, Онисима, Еразма та інших (251). Мч. Ісихія Антіохійського (ІV). Прп. Ісидори, юродивої (ІV). Св. Таїсії Єгипетської (V). Києво-Братської ікони Божої Матері (1654).","r":["Ран. – Ін., 67 зач., XXI, 15 – 25.","Літ. – Діян., 9 зач., III, 19–26. Ін., 6 зач., II, 1–11.","Ап.: 1 Кор., 131 зач., IV, 9 – 16. Мф., 56 зач., XIII, 54 – 58."],"n":"Від сьогодні у будні до віддання Пасхи перед каноном співається «Воскресіння Христове бачивши…» (один раз). Співається «Чеснішу...». Катавасія, коли співається велике славослів’я, – «Воскресіння день…». «Царю Небесний…» не читається до П’ятдесятниці. У період Тріоді квітної на Літургії у всі дні Апостол і Євангеліє дня читається першим, потім читання святим. На ранній величання: «Величаємо тебе, апостоле Христів Симоне, і шануємо страждання і труди твої, ними ж потрудився ти у благовісті Христовому». Цього тижня за традицією звершується поминання померлих."},{"m":5,"d":11,"h":"Сщмч. Мокія (бл. 295). Рівноапп. Кирила (869) та Мефодія (885), вчителів слов’янських. Прп. Софронія, затворника Києво-Печерського, в Дальніх печерах (ХІІІ). Свт. Никодима, архієп. Сербського (1325).","r":["Ран. – Ін., 35 зач. (від половини), X, 1 – 9.","Літ. – Діян., 10 зач., IV, 1 – 10. Ін., 10 зач., III, 16 – 21.","Рівноапп.: Євр., 318 зач., VII, 26 – VIII, 2. Мф., 11 зач., V, 14 – 19."],"n":"На ранній величання: «Величаємо вас, святі рівноапостольні Кириле і Мефодію, що всі слов’янські країни вченням своїм просвітили і до Христа привели»."},{"m":5,"d":12,"h":"Свт. Епіфанія, єп. Кіпрського (403). Свт. Германа, патр. Константинопольського (740). Свтт. Савина, архієп. Кіпрського (V), і Полувія, єп. Ринокирського (V). Прп. Амфілохія Почаївського, в малій схимі Йосифа, чудотворця Іловецького. (1971).","r":["Ран. – Лк., 24 зач., VI, 17 – 23.","Літ. – Діян., 11 зач., IV, 13 – 22. Ін., 15 зач., V, 17 – 24.","Прп.: Гал., 213 зач., V, 22 – VI, 2. Мф., 43 зач., XI, 27 – 30."],"n":"На ранній величання: «Ублажаємо тебе, преподобний отче Амфілохію, і шануємо святу пам’ять твою, наставнику монахів і співрозмовнику ангелів». День тезоіменитства Блаженнійшого Митрополита Київського і всієї України Епіфанія."},{"m":5,"d":13,"h":"Мц. Глікерії, діви, і з нею мч. Лаодикія, сторожа в’язничного (бл. 117). Перенесення мощів прмч. Макарія, архім. Канівського, ігум. Пінського, Переяславського чудотворця (1688). Мч. Олександра Римського (284 – 305). Свт. Павсикакія, єп. Синадського (606). Свв. Георгія, спов., з дружиною Іриною і дітьми (ІХ). Прп. Євфимія Іверського (1028, Груз.).","r":["Діян., 12 зач., IV, 23 – 31. Ін., 16 зач., V, 24 – 30."],"n":""},{"m":5,"d":14,"h":"Мч. Ісидора (251). Прп. Микити, затворника Києво-Печерського, єп. Новгородського (1108). Мч. Максима (бл. 250). Прп. Серапіона Синдоніта (V). Свт. Леонтія, патр. Єрусалимського (1175).","r":["Діян., 13 зач., V, 1 – 11. Ін., 17 зач., V, 30 – VI, 2."],"n":""},{"m":5,"d":15,"h":"Прп. Пахомія Великого (348). Свт. Ісаї Києво-Михайлівського, єп. Ростовського, чудотворця (1090). Прп. Ісаї Києво-Печерського (1115). Прп. Ахилія, єп. Лариссійського (ІІ).","r":["Діян., 15 зач., V, 21 – 33. Ін., 19 зач., VI, 14 – 27.","Прп.: 2 Кор., 176 зач., ІV, 6 – 15. Лк., 77 зач., XІV, 25 – 35."],"n":""},{"m":5,"d":16,"h":"3-тя неділя після Пасхи, святих жінок-мироносиць. Свв. жінок-мироносиць: Марії Магдалини, Марії Клеопової, Соломії, Іоанни, Марфи і Марії, Сусанни та інших; праведних Йосифа Аримафейського і Никодима (перехідне святкування в 3-тю неділю після Пасхи). Прп. Федора Освяченого (3
